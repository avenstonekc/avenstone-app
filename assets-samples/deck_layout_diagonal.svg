<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Style system: see STYLE.md. Deck plan: boards run at 45deg inside a picture-frame border. -->
  <defs>
    <clipPath id="deck"><rect x="180" y="180" width="440" height="440"/></clipPath>
  </defs>
  <rect width="800" height="800" fill="#ffffff"/>
  <!-- diagonal board seams at 45deg -->
  <g clip-path="url(#deck)" stroke="#0A1F44" stroke-width="2.5" stroke-linecap="round">
    <line x1="120" y1="260" x2="700" y2="-320"/>
    <line x1="120" y1="340" x2="700" y2="-240"/>
    <line x1="120" y1="420" x2="700" y2="-160"/>
    <line x1="120" y1="500" x2="700" y2="-80"/>
    <line x1="120" y1="580" x2="700" y2="0"/>
    <line x1="120" y1="660" x2="700" y2="80"/>
    <line x1="120" y1="740" x2="700" y2="160"/>
    <line x1="120" y1="820" x2="700" y2="240"/>
    <line x1="200" y1="820" x2="780" y2="240"/>
    <line x1="280" y1="820" x2="860" y2="240"/>
    <line x1="360" y1="820" x2="940" y2="240"/>
  </g>
  <!-- deck outline -->
  <rect x="180" y="180" width="440" height="440" fill="none" stroke="#0A1F44" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- GOLD: the 45deg run + picture-frame border = the defining fork -->
  <rect x="180" y="180" width="440" height="440" fill="none" stroke="#C9A84C" stroke-width="4" stroke-linejoin="round" stroke-dasharray="0"/>
  <g stroke="#C9A84C" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M250 560 h70"/>
    <path d="M250 560 l50 -50"/>
    <path d="M300 560 a50 50 0 0 0 -14 -35"/>
  </g>
  <text x="335" y="548" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#C9A84C">45&#176;</text>
  <text x="400" y="740" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0A1F44" text-anchor="middle">Deck boards — diagonal</text>
</svg>
