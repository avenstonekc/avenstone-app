<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Style system: see STYLE.md. Shadowbox = boards alternate front/back of the rail with gaps → same look both sides. -->
  <rect width="800" height="800" fill="#ffffff"/>
  <!-- BACK boards (behind the rail): lighter, seen through the gaps between front boards -->
  <g fill="none" stroke="#0A1F44" stroke-width="2" opacity="0.45" stroke-linejoin="round">
    <rect x="150" y="200" width="70" height="360"/>
    <rect x="290" y="200" width="70" height="360"/>
    <rect x="430" y="200" width="70" height="360"/>
    <rect x="570" y="200" width="70" height="360"/>
  </g>
  <!-- Posts + rails -->
  <g fill="none" stroke="#0A1F44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="150" y1="250" x2="650" y2="250"/>
    <line x1="150" y1="510" x2="650" y2="510"/>
    <rect x="120" y="170" width="34" height="470"/>
    <rect x="646" y="170" width="34" height="470"/>
  </g>
  <!-- FRONT boards (in front of the rail), offset to cover the back gaps -->
  <g fill="none" stroke="#0A1F44" stroke-width="2.5" stroke-linejoin="round">
    <rect x="220" y="200" width="70" height="360"/>
    <rect x="360" y="200" width="70" height="360"/>
    <rect x="500" y="200" width="70" height="360"/>
  </g>
  <!-- GOLD: one front + one back board = the defining alternation -->
  <g fill="none" stroke="#C9A84C" stroke-width="4" stroke-linejoin="round">
    <rect x="360" y="200" width="70" height="360"/>
    <rect x="430" y="200" width="70" height="360"/>
  </g>
  <text x="465" y="188" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#C9A84C" text-anchor="middle">front + back boards alternate</text>
  <text x="400" y="740" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0A1F44" text-anchor="middle">Fence — shadowbox</text>
</svg>
