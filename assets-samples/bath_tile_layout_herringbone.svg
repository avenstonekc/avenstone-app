<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Style system: see STYLE.md. Herringbone = 2:1 tiles, each short end butting a neighbor's long side, run at 45deg. -->
  <defs>
    <pattern id="herring" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <g fill="none" stroke="#0A1F44" stroke-width="2.5" stroke-linejoin="round">
        <rect x="0"  y="0"  width="60" height="30"/>
        <rect x="60" y="0"  width="30" height="60"/>
        <rect x="0"  y="30" width="30" height="60"/>
        <rect x="30" y="60" width="60" height="30"/>
        <rect x="90" y="30" width="30" height="60"/>
        <rect x="60" y="90" width="60" height="30"/>
      </g>
    </pattern>
    <clipPath id="panel"><rect x="150" y="150" width="500" height="420"/></clipPath>
  </defs>
  <rect width="800" height="800" fill="#ffffff"/>
  <!-- tiled panel -->
  <g clip-path="url(#panel)">
    <rect x="120" y="120" width="600" height="500" fill="url(#herring)"/>
    <!-- GOLD: two interlocking tiles that define the herringbone -->
    <g fill="none" stroke="#C9A84C" stroke-width="4" stroke-linejoin="round" transform="rotate(45 400 360)">
      <rect x="360" y="330" width="60" height="30"/>
      <rect x="420" y="330" width="30" height="60"/>
    </g>
  </g>
  <rect x="150" y="150" width="500" height="420" fill="none" stroke="#0A1F44" stroke-width="2.5"/>
  <text x="400" y="740" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0A1F44" text-anchor="middle">Wall tile — herringbone</text>
</svg>
