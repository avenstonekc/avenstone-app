workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "avenstone-vite/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.avenstonekc.app"
      node: 22.12.0
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install web dependencies
        script: |
          cd avenstone-vite
          npm install
      - name: Build web assets
        script: |
          cd avenstone-vite
          npm run build
      - name: Sync Capacitor iOS
        script: |
          cd avenstone-vite
          npx cap sync ios
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Initialize keychain and add certificates
        script: |
          keychain initialize
          keychain add-certificates
      - name: Set up signing
        script: |
          cd avenstone-vite/ios/App
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd avenstone-vite/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo "0")
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          agvtool new-version -all $NEW_BUILD_NUMBER
      - name: Build IPA
        script: |
          cd avenstone-vite/ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"
    artifacts:
      - avenstone-vite/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - avenstone-vite/ios/App/build/ios/xcarchive/*.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal
