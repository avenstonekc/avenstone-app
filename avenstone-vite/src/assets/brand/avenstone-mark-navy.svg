<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Avenstone mark">
  <rect width="100" height="100" rx="14" ry="14" fill="#0A1F44"/>
  <!-- Outer house -->
  <path d="M50,5 L95,41 L95,92 L5,92 L5,41 Z"
        fill="none" stroke="#C9A84C" stroke-width="2.8"
        stroke-linejoin="miter" stroke-miterlimit="8"/>
  <!-- Middle house -->
  <path d="M50,19 L82,47 L82,84 L18,84 L18,47 Z"
        fill="none" stroke="#C9A84C" stroke-width="2.5"
        stroke-linejoin="miter" stroke-miterlimit="8"/>
  <!-- Inner A: house frame with center-floor notch -->
  <path d="M50,33 L71,54 L71,78 L63,78 M37,78 L29,78 L29,54 Z"
        fill="none" stroke="#C9A84C" stroke-width="2.5"
        stroke-linejoin="miter" stroke-miterlimit="8"
        stroke-linecap="round"/>
  <!-- A crossbar -->
  <line x1="35" y1="66" x2="65" y2="66"
        stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
</svg>