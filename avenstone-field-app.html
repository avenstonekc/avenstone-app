function Field({q,value,onChange}){
  const base={width:"100%",background:"#0d1117",border:`1px solid ${value?G+"44":BR}`,color:"#e6edf3",padding:"10px 14px",fontFamily:"'Barlow',sans-serif",fontSize:15,outline:"none",boxSizing:"border-box",borderRadius:2};
  return(
    <div style={{marginBottom:22}}>
      <label style={{fontSize:13,color:"#e6edf3",fontWeight:600,display:"block",marginBottom:4,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:0.5,textTransform:"uppercase"}}>
        {q.critical&&<span style={{color:"#ef4444",marginRight:5}}>*</span>}{q.label}
      </label>
      {q.why&&<div style={{fontSize:11,color:G,marginBottom:7,fontStyle:"italic",opacity:0.9}}>⚡ {q.why}</div>}
      {q.type==="text"&&<input value={value||""} onChange={e=>onChange(e.target.value)} placeholder={q.placeholder} style={base}/>}
      {q.type==="select"&&<select value={value||""} onChange={e=>onChange(e.target.value)} style={{...base,color:value?"#e6edf3":"#6e7681"}}><option value="">— Select —</option>{q.options.map(o=><option key={o} value={o}>{o}</option>)}</select>}
      {q.type==="textarea"&&<textarea value={value||""} onChange={e=>onChange(e.target.value)} placeholder={q.placeholder} rows={5} style={{...base,resize:"vertical",lineHeight:1.7}}/>}
      {q.type==="multicheck"&&<div style={{display:"flex",flexWrap:"wrap",gap:7}}>{q.options.map(opt=>{const on=Array.isArray(value)&&value.includes(opt);return<button key={opt} onClick={()=>{const c=Array.isArray(value)?value:[];onChange(on?c.filter(x=>x!==opt):[...c,opt]);}} style={{background:on?G:"transparent",border:`1px solid ${on?G:BR}`,color:on?N:"#8b949e",padding:"7px 13px",fontFamily:"'Barlow',sans-serif",fontSize:13,cursor:"pointer",fontWeight:on?700:400,borderRadius:2,transition:"all 0.15s"}}>{on?"✓ ":""}{opt}</button>;})}</div>}
    </div>
  );
}

function ValModal({violations,onClose,onAnyway}){
  const cr=violations.filter(v=>v.sev==="critical"),wa=violations.filter(v=>v.sev==="warning"),ok=cr.length===0;
  return(
    <div style={{position:"fixed",inset:0,background:"#000000dd",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:S,border:"1px solid #30363d",width:"100%",maxWidth:460,maxHeight:"82vh",overflowY:"auto",borderRadius:4}}>
        <div style={{padding:"16px 20px",borderBottom:"1px solid #30363d",background:N,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:9,color:G,letterSpacing:3,fontFamily:"'Barlow Condensed',sans-serif"}}>PRE-SUBMIT CHECK</div>
            <div style={{fontSize:18,fontWeight:800,color:"#fff",fontFamily:"'Barlow Condensed',sans-serif"}}>REVIEW BEFORE SUBMITTING</div>
          </div>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:"#8b949e",fontSize:22,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{padding:"18px 20px"}}>
          {cr.length>0&&<div style={{marginBottom:18}}><div style={{fontSize:10,color:"#ef4444",letterSpacing:2,marginBottom:8,fontFamily:"'Barlow Condensed',sans-serif"}}>⛔ REQUIRED — FIX BEFORE SUBMITTING</div>{cr.map((v,i)=><div key={i} style={{background:"#1c0a0a",border:"1px solid #ef444433",padding:"10px 14px",marginBottom:6,borderRadius:2}}><div style={{fontSize:13,color:"#fca5a5",fontWeight:600}}>{v.msg}</div><div style={{fontSize:11,color:"#6e7681",marginTop:2}}>{v.sec}</div></div>)}</div>}
          {wa.length>0&&<div style={{marginBottom:18}}><div style={{fontSize:10,color:"#f59e0b",letterSpacing:2,marginBottom:8,fontFamily:"'Barlow Condensed',sans-serif"}}>⚠️ WARNINGS — MAY BE INCOMPLETE</div>{wa.map((v,i)=><div key={i} style={{background:"#1a1200",border:"1px solid #f59e0b33",padding:"10px 14px",marginBottom:6,borderRadius:2}}><div style={{fontSize:13,color:"#fcd34d",fontWeight:600}}>{v.msg}</div><div style={{fontSize:11,color:"#6e7681",marginTop:2}}>{v.sec}</div></div>)}</div>}
          {ok&&wa.length===0&&<div style={{background:"#0a1f0a",border:"1px solid #22c55e44",padding:14,marginBottom:18,borderRadius:2,fontSize:14,color:"#86efac",fontWeight:600}}>✓ All checks passed. Ready to submit.</div>}
          <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
            <button onClick={onClose} style={{background:"transparent",border:"1px solid #30363d",color:"#8b949e",padding:"10px 20px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,cursor:"pointer",borderRadius:2,letterSpacing:1}}>GO BACK</button>
            {(ok||wa.length>0)&&<button onClick={onAnyway} style={{background:ok?G:"#374151",border:`1px solid ${ok?G:"#f59e0b"}`,color:ok?N:"#f59e0b",padding:"10px 20px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:800,cursor:"pointer",borderRadius:2,letterSpacing:1}}>{ok?"SUBMIT NOW":"SUBMIT ANYWAY"}</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

function FormScreen({title,sections,rules,formType,onBack}){
  const[answers,setAnswers]=useState({});
  const[active,setActive]=useState(0);
  const[showVal,setShowVal]=useState(false);
  const[state,setState]=useState("idle");
  const set=(id,val)=>setAnswers(p=>({...p,[id]:val}));
  const totalA=sections.reduce((a,s)=>a+s.questions.filter(q=>answers[q.id]&&answers[q.id]!=="").length,0);
  const totalQ=sections.reduce((a,s)=>a+s.questions.length,0);
  const pct=Math.round((totalA/totalQ)*100);
  const violations=rules.filter(r=>r.check(answers));
  const crits=violations.filter(v=>v.sev==="critical");
  const ready=crits.length===0;
  const buildPayload=()=>({_meta:{form_type:formType,exported:new Date().toISOString(),style_guide:CFG.styleGuide,instructions_for_claude:CFG.claudeInstructions},answers:Object.fromEntries(sections.map(s=>[s.id,{_label:s.label,responses:Object.fromEntries(s.questions.map(q=>[q.id,{question:q.label,answer:answers[q.id]||null}]))}]))});
  const doSubmit=async()=>{
    const json=JSON.stringify(buildPayload(),null,2);
    setShowVal(false);setState("submitting");
    try{
      if(CFG.submitMode==="clipboard"||CFG.submitMode==="both")await navigator.clipboard.writeText(json);
      if((CFG.submitMode==="webhook"||CFG.submitMode==="both")&&CFG.webhookUrl&&!CFG.webhookUrl.includes("YOUR_WEBHOOK"))await fetch(CFG.webhookUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:json});
      setState("success");
    }catch(e){setState("error");setTimeout(()=>setState("idle"),3000);}
  };
  const handleSubmit=()=>{if(!ready){setShowVal(true);return;}doSubmit();};
  const sec=sections[active];
  if(state==="success")return(
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:D,padding:32,textAlign:"center"}}>
      <div style={{fontSize:56,marginBottom:16}}>✅</div>
      <div style={{fontSize:32,fontWeight:800,color:"#22c55e",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1,marginBottom:10}}>SUBMITTED</div>
      <div style={{fontSize:14,color:"#8b949e",maxWidth:320,lineHeight:1.8,marginBottom:24}}>
        {CFG.submitMode==="clipboard"||CFG.submitMode==="both"?"JSON copied to clipboard. Paste into a .txt file, save as .json, then upload to Claude with your floor plan.":"Sent to Make.com. Bid document will be generated shortly."}
      </div>
      <button onClick={onBack} style={{background:G,border:"none",color:N,padding:"12px 28px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,cursor:"pointer",letterSpacing:1,borderRadius:2}}>← DASHBOARD</button>
    </div>
  );
  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{background:N,borderBottom:`2px solid ${G}`,padding:"12px 16px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
        <button onClick={onBack} style={{background:"transparent",border:"none",color:"#8b949e",fontSize:22,cursor:"pointer",padding:"0 4px"}}>←</button>
        <div style={{flex:1}}>
          <div style={{fontSize:9,color:G,letterSpacing:3,fontFamily:"'Barlow Condensed',sans-serif"}}>{title.toUpperCase()}</div>
          <div style={{fontSize:11,color:"#8b949e",marginTop:1}}>{answers.address||answers.property_address||""}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {crits.length>0&&<div onClick={()=>setShowVal(true)} style={{background:"#ef444422",border:"1px solid #ef4444",color:"#ef4444",fontSize:10,padding:"3px 9px",cursor:"pointer",borderRadius:2,fontFamily:"'Barlow Condensed',sans-serif"}}>⛔ {crits.length}</div>}
          <div style={{textAlign:"right"}}><div style={{fontSize:9,color:"#8b949e",letterSpacing:2,fontFamily:"'Barlow Condensed',sans-serif"}}>DONE</div><div style={{fontSize:18,fontWeight:800,color:ready?"#22c55e":G,lineHeight:1,fontFamily:"'Barlow Condensed',sans-serif"}}>{pct}%</div></div>
          <button onClick={handleSubmit} style={{background:ready?G:"#374151",border:`2px solid ${ready?G:"#ef4444"}`,color:ready?N:"#ef4444",padding:"8px 14px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,fontWeight:800,cursor:"pointer",letterSpacing:1,borderRadius:2,whiteSpace:"nowrap"}}>
            {state==="submitting"?"...":ready?"⬇ SUBMIT":"⛔ FIX"}
          </button>
        </div>
      </div>
      <div style={{height:3,background:"#21262d",flexShrink:0}}><div style={{height:3,background:ready?"#22c55e":G,width:`${pct}%`,transition:"width 0.4s"}}/></div>
      <div style={{display:"flex",overflowX:"auto",background:S,borderBottom:`1px solid ${BR}`,flexShrink:0}}>
        {sections.map((s,i)=>{
          const isA=active===i,hasCrit=rules.some(r=>r.sev==="critical"&&r.check(answers)&&r.sec===s.label);
          return<button key={s.id} onClick={()=>setActive(i)} style={{background:isA?"#0d1117":"transparent",border:"none",borderBottom:`2px solid ${isA?G:"transparent"}`,padding:"10px 14px",cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,color:isA?G:"#6e7681",letterSpacing:1,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5,textTransform:"uppercase"}}>
            <span>{s.icon}</span><span>{s.label}</span>{hasCrit&&<span style={{color:"#ef4444"}}>⛔</span>}
          </button>;
        })}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"20px 16px",background:D}}>
        <div style={{fontSize:20,fontWeight:800,color:"#e6edf3",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:0.5,marginBottom:18,paddingBottom:14,borderBottom:`1px solid ${BR}`}}>{sec.icon} {sec.label.toUpperCase()}</div>
        {sec.questions.map(q=><Field key={q.id} q={q} value={answers[q.id]} onChange={v=>set(q.id,v)}/>)}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:20,paddingTop:16,borderTop:`1px solid ${BR}`}}>
          <button onClick={()=>setActive(Math.max(0,active-1))} disabled={active===0} style={{background:"transparent",border:`1px solid ${active===0?"#21262d":BR}`,color:active===0?"#30363d":"#8b949e",padding:"10px 22px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,cursor:active===0?"default":"pointer",letterSpacing:1,borderRadius:2}}>← BACK</button>
          {active<sections.length-1
            ?<button onClick={()=>setActive(active+1)} style={{background:G,border:"none",color:N,padding:"10px 26px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:800,cursor:"pointer",letterSpacing:1,borderRadius:2}}>NEXT →</button>
            :<button onClick={handleSubmit} style={{background:ready?G:"#374151",border:`2px solid ${ready?G:"#ef4444"}`,color:ready?N:"#ef4444",padding:"10px 26px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:800,cursor:"pointer",letterSpacing:1,borderRadius:2}}>{ready?"⬇ SUBMIT":"⛔ FIX FIRST"}</button>
          }
        </div>
      </div>
      {showVal&&<ValModal violations={violations} onClose={()=>setShowVal(false)} onAnyway={doSubmit}/>}
    </div>
  );
}

function TakeoffScreen({onBack}){
  return(
    <div style={{flex:1,overflowY:"auto",background:D}}>
      <div style={{background:N,borderBottom:`2px solid ${G}`,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
        <button onClick={onBack} style={{background:"transparent",border:"none",color:"#8b949e",fontSize:22,cursor:"pointer"}}>←</button>
        <div style={{fontSize:16,fontWeight:800,color:"#fff",fontFamily:"'Barlow Condensed',sans-serif"}}>MATERIAL TAKEOFF</div>
      </div>
      <div style={{padding:"20px 16px"}}>
        <div style={{background:S,border:`1px solid ${BR}`,borderLeft:`4px solid ${G}`,padding:"18px",borderRadius:2,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:G,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1,marginBottom:12}}>HOW TO GENERATE A MATERIAL LIST</div>
          {[["1","Complete Project Intake → Submit",G],["2","Scan floor plan with LiDAR — label all rooms first","#3b82f6"],["3","Open claude.ai in a new chat","#22c55e"],["4","Upload the intake .json + floor plan PDF","#a855f7"],["5","Claude reads both files and generates the full material list","#f59e0b"]].map(([n,t,c])=>(
            <div key={n} style={{display:"flex",gap:12,marginBottom:12,alignItems:"flex-start"}}>
              <div style={{background:c,color:N,width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,flexShrink:0,fontFamily:"'Barlow Condensed',sans-serif"}}>{n}</div>
              <div style={{fontSize:13,color:"#c9d1d9",lineHeight:1.6}}>{t}</div>
            </div>
          ))}
        </div>
        <div style={{background:S,border:`1px solid ${BR}`,padding:"16px 18px",borderRadius:2}}>
          <div style={{fontSize:10,color:"#8b949e",letterSpacing:2,fontFamily:"'Barlow Condensed',sans-serif",marginBottom:10}}>PRO TIPS</div>
          {["📐 Label every room on your floor plan before scanning — room name + sqft","🏗️ Foundation type is critical — slab vs basement vs crawlspace changes everything","🚿 Describe each bath specifically — walk-in vs tub, double vs single vanity","🔌 Note completed or excluded work so it does not get double-counted"].map((t,i)=>(
            <div key={i} style={{fontSize:13,color:"#8b949e",marginBottom:10,lineHeight:1.6}}>{t}</div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Dashboard({onNavigate}){
  const today=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const Action=({icon,title,sub,page,accent})=>(
    <button onClick={()=>onNavigate(page)} style={{background:S,border:`1px solid ${BR}`,borderLeft:`4px solid ${accent}`,padding:"16px 18px",cursor:"pointer",textAlign:"left",width:"100%",fontFamily:"'Barlow',sans-serif",borderRadius:2,display:"flex",alignItems:"center",gap:14}}
      onMouseEnter={e=>e.currentTarget.style.background="#1c2433"} onMouseLeave={e=>e.currentTarget.style.background=S}>
      <span style={{fontSize:26,flexShrink:0}}>{icon}</span>
      <div style={{flex:1}}><div style={{fontSize:15,fontWeight:700,color:"#e6edf3",fontFamily:"'Barlow Condensed',sans-serif",textTransform:"uppercase",letterSpacing:0.5}}>{title}</div><div style={{fontSize:12,color:"#8b949e",marginTop:2}}>{sub}</div></div>
      <div style={{color:accent,fontSize:18}}>→</div>
    </button>
  );
  return(
    <div style={{flex:1,overflowY:"auto",background:D}}>
      <div style={{background:`linear-gradient(135deg, ${N} 0%, #0f2d5e 60%, #1a3a6b 100%)`,padding:"28px 20px 24px",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",inset:0,opacity:0.04,backgroundImage:`linear-gradient(${G} 1px, transparent 1px), linear-gradient(90deg, ${G} 1px, transparent 1px)`,backgroundSize:"32px 32px"}}/>
        <div style={{position:"relative"}}>
          <div style={{fontSize:10,color:G,letterSpacing:3,fontFamily:"'Barlow Condensed',sans-serif",marginBottom:4}}>{today.toUpperCase()}</div>
          <div style={{fontSize:30,fontWeight:900,color:"#fff",fontFamily:"'Barlow Condensed',sans-serif",lineHeight:1,letterSpacing:1}}>FIELD ESTIMATOR</div>
          <div style={{fontSize:13,color:"#94a3b8",marginTop:6}}>{CFG.co.area} · {CFG.co.license}</div>
        </div>
      </div>
      <div style={{padding:"18px 16px"}}>
        <div style={{fontSize:10,color:"#8b949e",letterSpacing:3,marginBottom:10,fontFamily:"'Barlow Condensed',sans-serif"}}>QUICK START</div>
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:24}}>
          <Action icon="📋" title="New Project Intake" sub="Capture property details, scope, and conditions" page="intake" accent={G}/>
          <Action icon="💼" title="New Bid / Proposal" sub="Build a bid document — all job types" page="bid" accent="#3b82f6"/>
          <Action icon="📦" title="Material Takeoff" sub="How to generate a material list from intake + floor plan" page="takeoff" accent="#22c55e"/>
        </div>
        <div style={{fontSize:10,color:"#8b949e",letterSpacing:3,marginBottom:10,fontFamily:"'Barlow Condensed',sans-serif"}}>THE WORKFLOW</div>
        <div style={{background:S,border:`1px solid ${BR}`,padding:"16px 18px",borderRadius:2,marginBottom:20}}>
          {[["1","Fill out Project Intake on site",G],["2","Fill out Bid form with your numbers","#3b82f6"],["3","Submit — JSON fires to Make.com","#22c55e"],["4","Bid document generated and delivered to GHL","#a855f7"]].map(([n,t,c])=>(
            <div key={n} style={{display:"flex",gap:12,marginBottom:10,alignItems:"flex-start"}}>
              <div style={{background:c,color:N,width:20,height:20,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,flexShrink:0,fontFamily:"'Barlow Condensed',sans-serif"}}>{n}</div>
              <div style={{fontSize:13,color:"#c9d1d9",lineHeight:1.5}}>{t}</div>
            </div>
          ))}
        </div>
        <div style={{paddingTop:14,borderTop:`1px solid ${BR}`,textAlign:"center"}}>
          <div style={{fontSize:10,color:"#484f58",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1}}>{CFG.co.name.toUpperCase()}</div>
          <div style={{fontSize:10,color:"#30363d",marginTop:3}}>{CFG.co.phone} · {CFG.co.website}</div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const[page,setPage]=useState("dashboard");
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100dvh",maxWidth:500,margin:"0 auto",background:D,overflow:"hidden",fontFamily:"'Barlow',sans-serif"}}>
      <div style={{background:`linear-gradient(135deg, ${N} 0%, #0f2d5e 100%)`,borderBottom:`3px solid ${G}`,padding:"10px 16px",display:"flex",alignItems:"center",gap:12,flexShrink:0,paddingTop:"max(10px, env(safe-area-inset-top))"}}>
        <div style={{background:G,color:N,fontWeight:900,fontSize:14,padding:"4px 10px",letterSpacing:3,fontFamily:"'Barlow Condensed',sans-serif"}}>AV</div>
        <div>
          <div style={{fontSize:8,color:G,letterSpacing:4,fontFamily:"'Barlow Condensed',sans-serif"}}>{CFG.co.name.toUpperCase()}</div>
          <div style={{fontSize:12,fontWeight:700,color:"#fff",letterSpacing:1,fontFamily:"'Barlow Condensed',sans-serif"}}>FIELD ESTIMATOR</div>
        </div>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {page==="dashboard"&&<Dashboard onNavigate={setPage}/>}
        {page==="intake"&&<FormScreen title="Project Intake" sections={INTAKE} rules={IRULES} formType="intake" onBack={()=>setPage("dashboard")}/>}
        {page==="bid"&&<FormScreen title="Bid and Proposal" sections={BID} rules={BRULES} formType="bid" onBack={()=>setPage("dashboard")}/>}
        {page==="takeoff"&&<TakeoffScreen onBack={()=>setPage("dashboard")}/>}
      </div>
      {page==="dashboard"&&(
        <div style={{background:S,borderTop:`1px solid ${BR}`,display:"flex",flexShrink:0,paddingBottom:"env(safe-area-inset-bottom)"}}>
          {[{id:"dashboard",icon:"🏠",label:"Home"},{id:"intake",icon:"📋",label:"Intake"},{id:"bid",icon:"💼",label:"Bid"},{id:"takeoff",icon:"📦",label:"Takeoff"}].map(tab=>(
            <button key={tab.id} onClick={()=>setPage(tab.id)} style={{flex:1,background:"transparent",border:"none",padding:"11px 0",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,borderTop:`2px solid ${page===tab.id?G:"transparent"}`}}>
              <span style={{fontSize:19}}>{tab.icon}</span>
              <span style={{fontSize:9,color:page===tab.id?G:"#6e7681",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1,textTransform:"uppercase"}}>{tab.label}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
