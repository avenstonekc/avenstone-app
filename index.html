        <div className="mob-hdr">
          <img src={L} alt="Avenstone" style={{width:44,height:44,objectFit:"contain"}}/>
          <div style={{flex:1}}><div style={{fontSize:8,color:"#C9A84C",letterSpacing:4,textTransform:"uppercase"}}>Avenstone Group</div><div style={{fontSize:13,fontWeight:600,color:"#fff",letterSpacing:0.5}}>Field Estimator</div></div>
          <button onClick={()=>setShowNotif(true)} style={{position:"relative",background:"transparent",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.6)",padding:4,display:"flex",alignItems:"center"}}>
            <span style={{width:20,height:20,display:"flex"}}>{Ic.bell}</span>
            {unreadCount>0&&<span style={{position:"absolute",top:0,right:0,background:"#C9A84C",color:"#0A1F44",width:16,height:16,borderRadius:"50%",fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>{unreadCount>9?"9+":unreadCount}</span>}
          </button>
          <button onClick={signOut} title="Sign out" style={{background:"transparent",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.4)",padding:4,display:"flex",alignItems:"center"}}>
            <span style={{width:18,height:18,display:"flex"}}>{Ic.logout}</span>
          </button>
        </div>
        <div className="top-bar">
          <div style={{fontSize:13,color:"#9CA3AF"}}><strong style={{color:"#0A1F44"}}>{NAV.find(n=>n.id===pg)?.lb||"Dashboard"}</strong>&nbsp;·&nbsp;{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            {isOwnerOrRep&&<><button className="btn btn-ghost" onClick={()=>setPg("intake")}>New Intake</button><button className="btn btn-navy" onClick={()=>setPg("jobs")}>+ New Project</button></>}
            <button onClick={()=>setShowNotif(true)} title="Notifications" style={{position:"relative",background:"transparent",border:"1px solid #E8E4DC",color:"#6B7280",width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,transition:"all 0.15s"}} onMouseEnter={e=>e.currentTarget.style.borderColor="#C9A84C"} onMouseLeave={e=>e.currentTarget.style.borderColor="#E8E4DC"}>
              <span style={{width:16,height:16,display:"flex"}}>{Ic.bell}</span>
              {unreadCount>0&&<span style={{position:"absolute",top:-6,right:-6,background:"#C9A84C",color:"#0A1F44",width:18,height:18,borderRadius:"50%",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>{unreadCount>9?"9+":unreadCount}</span>}
            </button>
          </div>
        </div>
        <div className="pg-wrap">
          {pg==="dashboard"&&<Dash nav={setPg} jobs={jobs} profile={profile}/>}
          {pg==="jobs"&&<JobsScr jobs={jobs} setJobs={setJobs} onBack={()=>setPg("dashboard")} pendingJobId={pendingJobId} clearPendingJobId={()=>setPendingJobId(null)} profile={profile}/>}
          {pg==="intake"&&isOwnerOrRep&&<FormScr title="Project Intake" secs={IQ} rules={IR} ftype="intake" onBack={()=>setPg("dashboard")} onSave={saveJob}/>}
          {pg==="bid"&&isOwnerOrRep&&<FormScr title="Bid and Proposal" secs={BQ} rules={BR} ftype="bid" onBack={()=>setPg("dashboard")}/>}
          {pg==="takeoff"&&isStaff&&<TkOf onBack={()=>setPg("dashboard")}/>}
          {pg==="subs"&&isStaff&&<SubDir/>}
          {pg==="team"&&profile?.role==="owner"&&<UserMgmt/>}
          {pg==="pipeline"&&isOwnerOrRep&&<div style={{padding:"16px 20px"}}>
            <div style={{marginBottom:16}}><div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:"#0A1F44"}}>Lead Pipeline</div><div style={{fontSize:13,color:"#9CA3AF",marginTop:2}}>Drag jobs between columns to update status</div></div>
            <Pipeline jobs={jobs} onStatusChange={(jid,status)=>{const u=jobs.map(j=>j.id===jid?{...j,status}:j);setJobs(u);ls("av_j",u);sbUpd(jid,{status});}} onOpenJob={j=>{setPg("jobs");setPendingJobId(j.id);}}/>
          </div>}
        </div>
        <div className="bot-nav">
          {[
            {id:"dashboard",ic:"grid",lb:"Home"},
            {id:"jobs",ic:"home",lb:"Projects"},
            ...(isOwnerOrRep?[{id:"intake",ic:"clip",lb:"Intake"},{id:"bid",ic:"doc",lb:"Bid"}]:[]),
            ...(isStaff?[{id:"subs",ic:"home",lb:"Subs"}]:[]),
          ].map(t=>(
            <button key={t.id} className={`bn-item${pg===t.id?" on":""}`} onClick={()=>setPg(t.id)}>
              <span style={{width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",color:pg===t.id?"#C9A84C":"#9CA3AF"}}>{Ic[t.ic]||Ic.grid}</span>
              <span className="bn-lbl" style={{color:pg===t.id?"#C9A84C":"#9CA3AF"}}>{t.lb}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
    {showNotif&&<NotifPanel notifs={notifs} onClose={()=>setShowNotif(false)} onMarkAllRead={markAllNotifsRead} onClickNotif={onClickNotif}/>}</>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
