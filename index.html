const sbSaveJob=async(job)=>{
  try{
    await window.SB.from("jobs").upsert({
      id:job.id,address:job.address,status:job.status,scope:job.scope||"",sqft:job.sqft||"",
      notes:job.notes||"",created_at:job.created,intake_answers:job.ans||{},

      client_email:job.client_email||"",assigned_rep:job.assigned_rep||"",
      assigned_subs:job.assigned_subs||"",contract_value:job.contract_value||0,
      co_total:job.co_total||0,target_completion:job.target_completion||""
    });
  }catch(e){console.error("sbSaveJob:",e);}
};

const sbLoadJobs=async()=>{
  try{
    const{data,error}=await window.SB.from("jobs").select("*").order("created_at",{ascending:false});
    if(error||!data)return null;
    const jobs=await Promise.all(data.map(async j=>{
      const[{data:photos},{data:notes},{data:cos}]=await Promise.all([
        window.SB.from("photos").select("*").eq("job_id",j.id).order("created_at",{ascending:true}),
        window.SB.from("job_notes").select("*").eq("job_id",j.id).order("created_at",{ascending:false}),
        window.SB.from("change_orders").select("*").eq("job_id",j.id).order("created_at",{ascending:false})
      ]);
      return{
        id:j.id,address:j.address,status:j.status,scope:j.scope||"",sqft:j.sqft||"",
        notes:j.notes||"",created:j.created_at,ans:j.intake_answers||{},
        client_name:j.client_name||"",client_phone:j.client_phone||"",
        client_email:j.client_email||"",assigned_rep:j.assigned_rep||"",
        assigned_subs:j.assigned_subs||"",contract_value:j.contract_value||0,
        co_total:j.co_total||0,target_completion:j.target_completion||"",
        photos:(photos||[]).map(p=>({id:p.id,type:p.type,url:p.url,name:p.name})),
        activity:(notes||[]),
        change_orders:(cos||[])
      };
    }));
    return jobs;
  }catch(e){console.error("sbLoadJobs:",e);return null;}
};

const sbUpdateJob=async(id,changes)=>{
  try{
    const allowed=["status","notes","scope","sqft","client_name","client_phone","client_email",
      "assigned_rep","assigned_subs","contract_value","co_total","target_completion"];
    const patch={};
    allowed.forEach(k=>{if(changes[k]!==undefined)patch[k]=changes[k];});
    if(Object.keys(patch).length)await window.SB.from("jobs").update(patch).eq("id",id);
  }catch(e){console.error("sbUpdateJob:",e);}
};

const sbDeleteJob=async(id)=>{
  try{
    const{data:photos}=await window.SB.from("photos").select("url").eq("job_id",id);
    if(photos&&photos.length){
      const paths=photos.map(p=>p.url.split("/job-photos/")[1]).filter(Boolean);
      if(paths.length)await window.SB.storage.from("job-photos").remove(paths);
    }
    await Promise.all([
      window.SB.from("photos").delete().eq("job_id",id),
      window.SB.from("job_notes").delete().eq("job_id",id),
      window.SB.from("change_orders").delete().eq("job_id",id),
      window.SB.from("jobs").delete().eq("id",id)
    ]);
  }catch(e){console.error("sbDeleteJob:",e);}
};

const sbAddNote=async(jobId,content,author)=>{
  try{
    const{data,error}=await window.SB.from("job_notes").insert({
      job_id:jobId,content,author:author||"Kalin",
      created_at:new Date().toISOString()
    }).select().single();
    return error?null:data;
  }catch(e){return null;}
};

const sbUploadPhoto=async(jobId,file)=>{
  try{
    const ext=file.name.split(".").pop()||"jpg";
    const path=`${jobId}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const{error:upErr}=await window.SB.storage.from("job-photos").upload(path,file,{contentType:file.type,upsert:false});
    if(upErr){console.error("upload error:",upErr);return null;}
    const{data:urlData}=window.SB.storage.from("job-photos").getPublicUrl(path);
    const url=urlData.publicUrl;
    const row={id:Date.now().toString()+Math.random(),job_id:jobId,type:file.type.startsWith("video")?"video":"photo",url,name:file.name};
    await window.SB.from("photos").insert(row);
    return{id:row.id,type:row.type,url,name:file.name};
  }catch(e){console.error("sbUploadPhoto:",e);return null;}
};

function Fld({q,val,set}){
  const bs={width:"100%",background:SF,border:`1px solid ${val?GD+"44":BD}`,color:"#e6edf3",padding:"10px 14px",fontFamily:"'Barlow',sans-serif",fontSize:15,outline:"none",boxSizing:"border-box",borderRadius:2};
  return(
    <div style={{marginBottom:22}}>
      <label style={{fontSize:13,color:"#e6edf3",fontWeight:600,display:"block",marginBottom:4,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:0.5,textTransform:"uppercase"}}>
        {q.req&&<span style={{color:"#ef4444",marginRight:5}}>*</span>}{q.lb}
      </label>
      {q.why&&<div style={{fontSize:11,color:GD,marginBottom:7,fontStyle:"italic",opacity:0.9}}>⚡ {q.why}</div>}
      {q.t==="text"&&<input value={val||""} onChange={e=>set(e.target.value)} placeholder={q.ph} style={bs}/>}

    </div>
  );
}

function FormScr({title,secs,rules,ftype,onBack,onSave}){
  const[ans,setAns]=useState({});
  const[tab,setTab]=useState(0);
  const[showV,setShowV]=useState(false);
  const[st,setSt]=useState("idle");
  const setA=(id,v)=>setAns(p=>({...p,[id]:v}));
  const tA=secs.reduce((a,s)=>a+s.qs.filter(q=>ans[q.id]&&ans[q.id]!=="").length,0);
  const tQ=secs.reduce((a,s)=>a+s.qs.length,0);
  const pct=Math.round((tA/tQ)*100);
  const errs=rules.filter(r=>r.f(ans));
  const ok=errs.length===0;
  const build=()=>({_meta:{form_type:ftype,exported:new Date().toISOString(),instructions:["Read this JSON and generate a professional Avenstone bid document.","Never mention Claude or AI.","Match tone and format to bid_type.","Include: header, scope by trade, pricing table, timeline, payment terms, 1-year warranty, signature block."]},answers:Object.fromEntries(secs.map(s=>[s.id,{label:s.lb,data:Object.fromEntries(s.qs.map(q=>[q.id,ans[q.id]||null]))}]))});
  const submit=async()=>{
    const json=JSON.stringify(build(),null,2);
    setShowV(false);setSt("sub");
    try{
      if(CFG.mode==="clipboard"||CFG.mode==="both")await navigator.clipboard.writeText(json);
      if((CFG.mode==="webhook"||CFG.mode==="both")&&!CFG.webhook.includes("YOUR_WEBHOOK"))await fetch(CFG.webhook,{method:"POST",headers:{"Content-Type":"application/json"},body:json});
      if(ftype==="intake"&&onSave){const addr=ans.address||"New Job";onSave({id:Date.now().toString(),address:addr,status:"lead",created:new Date().toISOString(),scope:ans.scope_type||"",sqft:ans.total_sqft||"",notes:"",photos:[],ans});}
      setSt("ok");
    }catch(e){setSt("err");setTimeout(()=>setSt("idle"),3000);}
  };
  const go=()=>{if(!ok){setShowV(true);return;}submit();};
  const sec=secs[tab];
  if(st==="ok")return(
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:DK,padding:32,textAlign:"center"}}>
      <div style={{fontSize:56,marginBottom:16}}>✅</div>
      <div style={{fontSize:32,fontWeight:800,color:"#22c55e",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1,marginBottom:10}}>SUBMITTED</div>
      <div style={{fontSize:14,color:"#8b949e",maxWidth:320,lineHeight:1.8,marginBottom:24}}>{ftype==="intake"?"Job saved. JSON copied to clipboard.":"JSON copied. Upload to Claude with your floor plan."}</div>
      <button onClick={onBack} style={{background:GD,border:"none",color:NV,padding:"12px 28px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,cursor:"pointer",letterSpacing:1,borderRadius:2}}>← DASHBOARD</button>
    </div>
  );
  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{background:NV,borderBottom:`2px solid ${GD}`,padding:"12px 16px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
        <button onClick={onBack} style={{background:"transparent",border:"none",color:"#8b949e",fontSize:22,cursor:"pointer",padding:"0 4px"}}>←</button>
        <div style={{flex:1}}><div style={{fontSize:9,color:GD,letterSpacing:3,fontFamily:"'Barlow Condensed',sans-serif"}}>{title.toUpperCase()}</div><div style={{fontSize:11,color:"#8b949e",marginTop:1}}>{ans.address||ans.property_address||""}</div></div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {!ok&&<div onClick={()=>setShowV(true)} style={{background:"#ef444422",border:"1px solid #ef4444",color:"#ef4444",fontSize:10,padding:"3px 9px",cursor:"pointer",borderRadius:2}}>⛔ {errs.length}</div>}
          <div style={{textAlign:"right"}}><div style={{fontSize:9,color:"#8b949e",letterSpacing:2,fontFamily:"'Barlow Condensed',sans-serif"}}>DONE</div><div style={{fontSize:18,fontWeight:800,color:ok?"#22c55e":GD,lineHeight:1,fontFamily:"'Barlow Condensed',sans-serif"}}>{pct}%</div></div>
          <button onClick={go} style={{background:ok?GD:"#374151",border:`2px solid ${ok?GD:"#ef4444"}`,color:ok?NV:"#ef4444",padding:"8px 14px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,fontWeight:800,cursor:"pointer",letterSpacing:1,borderRadius:2,whiteSpace:"nowrap"}}>{st==="sub"?"...":ok?"⬇ SUBMIT":"⛔ FIX"}</button>
        </div>
      </div>
      <div style={{height:3,background:"#21262d",flexShrink:0}}><div style={{height:3,background:ok?"#22c55e":GD,width:`${pct}%`,transition:"width 0.4s"}}/></div>
      <div style={{display:"flex",overflowX:"auto",background:SF,borderBottom:`1px solid ${BD}`,flexShrink:0}}>
        {secs.map((s,i)=><button key={s.id} onClick={()=>setTab(i)} style={{background:tab===i?"#0d1117":"transparent",border:"none",borderBottom:`2px solid ${tab===i?GD:"transparent"}`,padding:"10px 14px",cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,color:tab===i?GD:"#6e7681",letterSpacing:1,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5,textTransform:"uppercase"}}><span>{s.ic}</span><span>{s.lb}</span></button>)}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"20px 16px",background:DK}}>
        <div style={{fontSize:20,fontWeight:800,color:"#e6edf3",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:0.5,marginBottom:18,paddingBottom:14,borderBottom:`1px solid ${BD}`}}>{sec.ic} {sec.lb.toUpperCase()}</div>
        {sec.qs.map(q=><Fld key={q.id} q={q} val={ans[q.id]} set={v=>setA(q.id,v)}/>)}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:20,paddingTop:16,borderTop:`1px solid ${BD}`}}>
          <button onClick={()=>setTab(Math.max(0,tab-1))} disabled={tab===0} style={{background:"transparent",border:`1px solid ${tab===0?"#21262d":BD}`,color:tab===0?"#30363d":"#8b949e",padding:"10px 22px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,cursor:tab===0?"default":"pointer",letterSpacing:1,borderRadius:2}}>← BACK</button>
          {tab<secs.length-1?<button onClick={()=>setTab(tab+1)} style={{background:GD,border:"none",color:NV,padding:"10px 26px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:800,cursor:"pointer",letterSpacing:1,borderRadius:2}}>NEXT →</button>:<button onClick={go} style={{background:ok?GD:"#374151",border:`2px solid ${ok?GD:"#ef4444"}`,color:ok?NV:"#ef4444",padding:"10px 26px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:800,cursor:"pointer",letterSpacing:1,borderRadius:2}}>{ok?"⬇ SUBMIT":"⛔ FIX"}</button>}
        </div>
      </div>
      {showV&&<div style={{position:"fixed",inset:0,background:"#000000dd",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}><div style={{background:SF,border:"1px solid #30363d",width:"100%",maxWidth:440,maxHeight:"80vh",overflowY:"auto",borderRadius:4}}><div style={{padding:"16px 20px",borderBottom:"1px solid #30363d",background:NV,display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{fontSize:18,fontWeight:800,color:"#fff",fontFamily:"'Barlow Condensed',sans-serif"}}>FIX BEFORE SUBMITTING</div><button onClick={()=>setShowV(false)} style={{background:"transparent",border:"none",color:"#8b949e",fontSize:22,cursor:"pointer"}}>✕</button></div><div style={{padding:"18px 20px"}}>{errs.map((v,i)=><div key={i} style={{background:"#1c0a0a",border:"1px solid #ef444433",padding:"10px 14px",marginBottom:6,borderRadius:2}}><div style={{fontSize:13,color:"#fca5a5",fontWeight:600}}>⛔ {v.m}</div></div>)}<button onClick={()=>setShowV(false)} style={{marginTop:16,background:"transparent",border:`1px solid ${BD}`,color:"#8b949e",padding:"10px 20px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,cursor:"pointer",borderRadius:2,width:"100%"}}>GO BACK AND FIX</button></div></div></div>}
    </div>
  );
}

function Jobs({jobs,setJobs,onBack}){
  const{useEffect,useState:us}=React;
  const[sel,setSel]=us(null);
  const[showN,setShowN]=us(false);
  const[newA,setNewA]=us("");
  const[fil,setFil]=us("all");
  const[loading,setLoading]=us(false);

  useEffect(()=>{
    setLoading(true);
    sbLoadJobs().then(data=>{
      if(data){setJobs(data);saveJ(data);}
      setLoading(false);
    });
  },[]);

  const add=()=>{
    if(!newA.trim())return;
    const j={id:Date.now().toString(),address:newA.trim(),status:"lead",created:new Date().toISOString(),
      scope:"",sqft:"",notes:"",photos:[],activity:[],change_orders:[],
      client_name:"",client_phone:"",client_email:"",assigned_rep:"",
      assigned_subs:"",contract_value:0,co_total:0,target_completion:""};
    const u=[j,...jobs];setJobs(u);saveJ(u);sbSaveJob(j);
    setNewA("");setShowN(false);setSel(j.id);
  };

  const upd=(id,ch)=>{
    const u=jobs.map(j=>j.id===id?{...j,...ch}:j);
    setJobs(u);saveJ(u);sbUpdateJob(id,ch);
  };

  const del=(id)=>{
    if(!window.confirm("Delete this job? This cannot be undone."))return;
    const u=jobs.filter(j=>j.id!==id);
    setJobs(u);saveJ(u);sbDeleteJob(id);setSel(null);
  };

  const filtered=fil==="all"?jobs:jobs.filter(j=>j.status===fil);
  const selJ=jobs.find(j=>j.id===sel);
  if(selJ)return<JDet job={selJ} upd={(c)=>upd(selJ.id,c)} del={()=>del(selJ.id)} back={()=>setSel(null)}/>;

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{background:NV,borderBottom:`2px solid ${GD}`,padding:"12px 16px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
        <button onClick={onBack} style={{background:"transparent",border:"none",color:"#8b949e",fontSize:22,cursor:"pointer"}}>←</button>
        <div style={{flex:1}}>
          <div style={{fontSize:9,color:GD,letterSpacing:3,fontFamily:"'Barlow Condensed',sans-serif"}}>AVENSTONE</div>
          <div style={{fontSize:16,fontWeight:800,color:"#fff",fontFamily:"'Barlow Condensed',sans-serif"}}>PROJECTS ({jobs.length})</div>
        </div>
        <button onClick={()=>setShowN(true)} style={{background:GD,border:"none",color:NV,padding:"8px 16px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:800,cursor:"pointer",letterSpacing:1,borderRadius:2}}>+ NEW</button>
      </div>

      {/* Status filter tabs */}
      <div style={{display:"flex",overflowX:"auto",background:SF,borderBottom:`1px solid ${BD}`,padding:"8px 12px",gap:8,flexShrink:0}}>
        <button onClick={()=>setFil("all")} style={{background:fil==="all"?GD:"transparent",border:`1px solid ${fil==="all"?GD:BD}`,color:fil==="all"?NV:"#8b949e",padding:"5px 12px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,cursor:"pointer",borderRadius:2,whiteSpace:"nowrap",letterSpacing:1}}>ALL ({jobs.length})</button>
        {STATS.map(st=>{const cnt=jobs.filter(j=>j.status===st.id).length;if(!cnt)return null;return<button key={st.id} onClick={()=>setFil(st.id)} style={{background:fil===st.id?st.c:"transparent",border:`1px solid ${fil===st.id?st.c:BD}`,color:fil===st.id?"#fff":"#8b949e",padding:"5px 12px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,cursor:"pointer",borderRadius:2,whiteSpace:"nowrap",letterSpacing:1}}>{st.lb} ({cnt})</button>;})}
      </div>

      <div style={{flex:1,overflowY:"auto",background:DK,padding:"12px 16px"}}>
        {loading&&<div style={{textAlign:"center",padding:"40px",color:"#8b949e",fontSize:13}}>Loading jobs...</div>}
        {!loading&&!filtered.length&&<div style={{textAlign:"center",padding:"40px 20px",color:"#8b949e"}}><div style={{fontSize:40,marginBottom:12}}>🏗️</div><div style={{fontSize:16,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1}}>NO JOBS YET</div><div style={{fontSize:13,marginTop:8}}>Tap + NEW to add your first project</div></div>}
        {filtered.map(j=>{
          const coTotal=Number(j.co_total||0);
          const contractVal=Number(j.contract_value||0);
          const revised=contractVal+coTotal;
          return(
            <div key={j.id} className="jcard" onClick={()=>setSel(j.id)} style={{background:SF,border:`1px solid ${BD}`,borderLeft:`4px solid ${sc(j.status)}`,padding:"14px 16px",marginBottom:10,cursor:"pointer",borderRadius:2,transition:"transform 0.1s"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:700,color:"#e6edf3",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:0.5}}>{j.address}</div>
                  {j.client_name&&<div style={{fontSize:12,color:GD,marginTop:2,fontWeight:600}}>{j.client_name}{j.client_phone?` · ${j.client_phone}`:""}</div>}
                </div>
                <div style={{background:sc(j.status)+"22",border:`1px solid ${sc(j.status)}44`,color:sc(j.status),fontSize:10,padding:"3px 8px",borderRadius:2,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1,whiteSpace:"nowrap",marginLeft:10}}>{sl(j.status)}</div>
              </div>
              <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                {j.sqft&&<span style={{fontSize:11,color:"#8b949e"}}>📐 {j.sqft} sqft</span>}
                {revised>0&&<span style={{fontSize:11,color:"#22c55e",fontWeight:600}}>💰 {fmtMoney(revised)}</span>}
                {coTotal>0&&<span style={{fontSize:11,color:"#f59e0b"}}>⚠️ {j.change_orders?.length||0} CO{j.change_orders?.length===1?"":"s"}</span>}
                {j.photos?.length>0&&<span style={{fontSize:11,color:"#8b949e"}}>📷 {j.photos.length}</span>}
                {j.assigned_rep&&<span style={{fontSize:11,color:"#8b949e"}}>👤 {j.assigned_rep}</span>}
                {j.target_completion&&<span style={{fontSize:11,color:"#8b949e"}}>🗓 {j.target_completion}</span>}
              </div>
              <div style={{fontSize:10,color:"#484f58",marginTop:8}}>{new Date(j.created).toLocaleDateString()}{j.activity?.length>0?` · ${j.activity.length} note${j.activity.length>1?"s":""}`:""}</div>
            </div>
          );
        })}
      </div>

      {showN&&<div style={{position:"fixed",inset:0,background:"#000000dd",zIndex:1000,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:SF,border:`1px solid ${BD}`,borderTop:`3px solid ${GD}`,width:"100%",maxWidth:500,padding:"24px 20px",borderRadius:"4px 4px 0 0"}}>
          <div style={{fontSize:14,fontWeight:700,color:"#e6edf3",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1,marginBottom:16}}>NEW PROJECT</div>
          <input value={newA} onChange={e=>setNewA(e.target.value)} placeholder="Property address" onKeyDown={e=>e.key==="Enter"&&add()} style={{width:"100%",background:DK,border:`1px solid ${BD}`,color:"#e6edf3",padding:"12px 14px",fontFamily:"'Barlow',sans-serif",fontSize:15,outline:"none",borderRadius:2,marginBottom:12,boxSizing:"border-box"}} autoFocus/>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setShowN(false)} style={{flex:1,background:"transparent",border:`1px solid ${BD}`,color:"#8b949e",padding:"11px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,cursor:"pointer",borderRadius:2,letterSpacing:1}}>CANCEL</button>
            <button onClick={add} style={{flex:1,background:GD,border:"none",color:NV,padding:"11px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:800,cursor:"pointer",borderRadius:2,letterSpacing:1}}>ADD JOB</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

function JDet({job,upd,del,back}){
  const{useState:us,useRef}=React;
  const[tab,setTab]=us("info");
  const[esSt,setEsSt]=us(false);
  const[noteText,setNoteText]=us("");
  const[noteAuthor,setNoteAuthor]=us("Kalin");
  const[savingNote,setSavingNote]=us(false);
  const[uploading,setUploading]=us(false);
  const[uploadPct,setUploadPct]=us(0);
  const[showCO,setShowCO]=us(false);
  const[coDesc,setCoDesc]=us("");
  const[coReason,setCoReason]=us("");
  const[coAmt,setCoAmt]=us("");
  const[savingCO,setSavingCO]=us(false);
  const[editInfo,setEditInfo]=us(false);
  const[infoForm,setInfoForm]=us({
    client_name:job.client_name||"",
    client_phone:job.client_phone||"",
    client_email:job.client_email||"",
    assigned_rep:job.assigned_rep||"",
    assigned_subs:job.assigned_subs||"",
    contract_value:job.contract_value||"",
    target_completion:job.target_completion||"",
    sqft:job.sqft||""
  });
  const pr=useRef();const vr=useRef();

  const coTotal=(job.change_orders||[]).filter(c=>c.status==="approved").reduce((a,c)=>a+Number(c.amount||0),0);
  const contractVal=Number(job.contract_value||0);
  const revised=contractVal+coTotal;

  const saveInfo=()=>{upd({...infoForm});setEditInfo(false);};

  const addNote=async()=>{
    if(!noteText.trim())return;
    setSavingNote(true);
    const saved=await sbAddNote(job.id,noteText.trim(),noteAuthor);
    if(saved){
      const newActivity=[saved,...(job.activity||[])];
      upd({activity:newActivity});
      setNoteText("");
    }
    setSavingNote(false);
  };

  const onFile=async(e)=>{
    const files=Array.from(e.target.files);
    if(!files.length)return;
    setUploading(true);setUploadPct(0);
    const results=[];
    for(let i=0;i<files.length;i++){
      const photo=await sbUploadPhoto(job.id,files[i]);
      if(photo)results.push(photo);
      setUploadPct(Math.round(((i+1)/files.length)*100));
    }
    if(results.length)upd({photos:[...(job.photos||[]),...results]});
    setUploading(false);setUploadPct(0);
  };

  const delPhoto=async(id)=>{
    const photo=(job.photos||[]).find(p=>p.id===id);
    if(photo?.url){
      try{
        const path=photo.url.split("/job-photos/")[1];
        if(path)await window.SB.storage.from("job-photos").remove([path]);
        await window.SB.from("photos").delete().eq("id",id);
      }catch(e){}
    }
    upd({photos:(job.photos||[]).filter(p=>p.id!==id)});
  };

  const addCO=async()=>{
    if(!coDesc.trim()||!coAmt)return;
    setSavingCO(true);
    const coNum=`CO-${String((job.change_orders||[]).length+1).padStart(3,"0")}`;
    const co={
      id:Date.now().toString(),job_id:job.id,co_number:coNum,
      description:coDesc.trim(),reason:coReason.trim(),
      amount:Number(coAmt),status:"pending",
      created_at:new Date().toISOString()
    };
    const saved=await sbSaveCO(co);
    if(saved){
      upd({change_orders:[saved,...(job.change_orders||[])]});
      setCoDesc("");setCoReason("");setCoAmt("");setShowCO(false);
    }
    setSavingCO(false);
  };

  const approveCO=async(coId)=>{
    await sbUpdateCO(coId,{status:"approved",approved_at:new Date().toISOString(),approved_by:noteAuthor});
    const updated=(job.change_orders||[]).map(c=>c.id===coId?{...c,status:"approved"}:c);
    const newCoTotal=updated.filter(c=>c.status==="approved").reduce((a,c)=>a+Number(c.amount||0),0);
    upd({change_orders:updated,co_total:newCoTotal});
  };

  const TABS=[
    {id:"info",lb:"INFO",ic:"📋"},
    {id:"notes",lb:"NOTES",ic:"📝"},
    {id:"photos",lb:"PHOTOS",ic:"📷"},
    {id:"co",lb:"CHANGE ORDERS",ic:"📄"},
  ];

  const inputSt={width:"100%",background:DK,border:`1px solid ${BD}`,color:"#e6edf3",padding:"9px 12px",fontFamily:"'Barlow',sans-serif",fontSize:14,outline:"none",borderRadius:2,boxSizing:"border-box",marginBottom:10};

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Header */}
      <div style={{background:NV,borderBottom:`2px solid ${GD}`,padding:"12px 16px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
          <button onClick={back} style={{background:"transparent",border:"none",color:"#8b949e",fontSize:22,cursor:"pointer"}}>←</button>
          <div style={{flex:1}}>
            <div style={{fontSize:9,color:GD,letterSpacing:3,fontFamily:"'Barlow Condensed',sans-serif"}}>PROJECT</div>
            <div style={{fontSize:14,fontWeight:700,color:"#fff",fontFamily:"'Barlow Condensed',sans-serif",lineHeight:1.2}}>{job.address}</div>
            {job.client_name&&<div style={{fontSize:11,color:GD,marginTop:2}}>{job.client_name}</div>}
          </div>
          <button onClick={()=>setEsSt(true)} style={{background:sc(job.status)+"22",border:`1px solid ${sc(job.status)}`,color:sc(job.status),padding:"6px 10px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,cursor:"pointer",borderRadius:2,letterSpacing:1,whiteSpace:"nowrap"}}>{sl(job.status)} ▾</button>
        </div>
        {/* Contract value bar */}
        {revised>0&&<div style={{display:"flex",gap:12,padding:"8px 0 2px",borderTop:`1px solid ${BD}`}}>
          <div style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:9,color:"#8b949e",letterSpacing:1,fontFamily:"'Barlow Condensed',sans-serif"}}>CONTRACT</div>
            <div style={{fontSize:14,fontWeight:800,color:"#22c55e",fontFamily:"'Barlow Condensed',sans-serif"}}>{fmtMoney(contractVal)}</div>
          </div>
          {coTotal>0&&<div style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:9,color:"#8b949e",letterSpacing:1,fontFamily:"'Barlow Condensed',sans-serif"}}>CO TOTAL</div>
            <div style={{fontSize:14,fontWeight:800,color:"#f59e0b",fontFamily:"'Barlow Condensed',sans-serif"}}>+{fmtMoney(coTotal)}</div>
          </div>}
          {coTotal>0&&<div style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:9,color:"#8b949e",letterSpacing:1,fontFamily:"'Barlow Condensed',sans-serif"}}>REVISED</div>
            <div style={{fontSize:14,fontWeight:800,color:GD,fontFamily:"'Barlow Condensed',sans-serif"}}>{fmtMoney(revised)}</div>
          </div>}
        </div>}
      </div>

      {/* Tab bar */}
      <div style={{display:"flex",background:SF,borderBottom:`1px solid ${BD}`,flexShrink:0}}>
        {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:tab===t.id?"#0d1117":"transparent",border:"none",borderBottom:`2px solid ${tab===t.id?GD:"transparent"}`,padding:"10px 4px",cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,color:tab===t.id?GD:"#6e7681",letterSpacing:0.5,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <span style={{fontSize:16}}>{t.ic}</span><span>{t.lb}</span>
        </button>)}
      </div>

      <div style={{flex:1,overflowY:"auto",background:DK,padding:"16px"}}>

        {/* ── INFO TAB ── */}
        {tab==="info"&&<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div style={{fontSize:11,color:"#8b949e",letterSpacing:2,fontFamily:"'Barlow Condensed',sans-serif"}}>JOB INFO</div>
            <button onClick={()=>setEditInfo(!editInfo)} style={{background:"transparent",border:`1px solid ${BD}`,color:GD,padding:"5px 12px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,cursor:"pointer",borderRadius:2,letterSpacing:1}}>{editInfo?"CANCEL":"EDIT"}</button>
          </div>
          {editInfo?(
            <div style={{background:SF,border:`1px solid ${BD}`,padding:"16px",borderRadius:2,marginBottom:16}}>
              {[
                ["client_name","Client Name","John Smith"],
                ["client_phone","Client Phone","(816) 555-1234"],
                ["client_email","Client Email","john@email.com"],
                ["assigned_rep","Assigned Rep","Kalin / Blake"],
                ["assigned_subs","Assigned Subs","e.g. KC Electric, Brother mold crew"],
                ["contract_value","Contract Value ($)","85000"],
                ["target_completion","Target Completion","June 15, 2026"],
                ["sqft","Total Sqft","1879"],
              ].map(([k,lb,ph])=><div key={k}>
                <label style={{fontSize:11,color:"#8b949e",display:"block",marginBottom:4,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1}}>{lb.toUpperCase()}</label>
                <input value={infoForm[k]||""} onChange={e=>setInfoForm(p=>({...p,[k]:e.target.value}))} placeholder={ph} style={inputSt}/>
              </div>)}
              <button onClick={saveInfo} style={{width:"100%",background:GD,border:"none",color:NV,padding:"11px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:800,cursor:"pointer",borderRadius:2,letterSpacing:1}}>SAVE INFO</button>
            </div>
          ):(
            <div style={{background:SF,border:`1px solid ${BD}`,borderLeft:`4px solid ${sc(job.status)}`,padding:"14px 16px",borderRadius:2,marginBottom:16}}>
              {[
                ["👤 Client",job.client_name],
                ["📞 Phone",job.client_phone],
                ["✉️ Email",job.client_email],
                ["🏗️ Rep",job.assigned_rep],
                ["🔧 Subs",job.assigned_subs],
                ["📐 Sqft",job.sqft],
                ["🗓 Target",job.target_completion],
                ["📅 Created",new Date(job.created).toLocaleDateString()],
              ].filter(([,v])=>v).map(([lb,v])=><div key={lb} style={{display:"flex",gap:8,marginBottom:8,fontSize:13}}>
                <span style={{color:"#8b949e",minWidth:80,flexShrink:0}}>{lb}</span>
                <span style={{color:"#e6edf3"}}>{v}</span>
              </div>)}
              {!job.client_name&&!job.assigned_rep&&<div style={{fontSize:13,color:"#484f58",textAlign:"center",padding:"12px 0"}}>Tap EDIT to add client and job details</div>}
            </div>
          )}
          <button onClick={del} style={{width:"100%",background:"transparent",border:"1px solid #ef444444",color:"#ef4444",padding:"12px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,cursor:"pointer",letterSpacing:1,borderRadius:2,marginTop:8}}>DELETE JOB</button>
        </div>}

        {/* ── NOTES TAB ── */}
        {tab==="notes"&&<div>
          <div style={{background:SF,border:`1px solid ${BD}`,padding:"14px 16px",borderRadius:2,marginBottom:16}}>
            <div style={{fontSize:11,color:"#8b949e",letterSpacing:2,fontFamily:"'Barlow Condensed',sans-serif",marginBottom:10}}>ADD NOTE</div>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              {["Kalin","Blake"].map(name=><button key={name} onClick={()=>setNoteAuthor(name)} style={{background:noteAuthor===name?GD:"transparent",border:`1px solid ${noteAuthor===name?GD:BD}`,color:noteAuthor===name?NV:"#8b949e",padding:"6px 14px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,cursor:"pointer",borderRadius:2,fontWeight:noteAuthor===name?700:400}}>{name}</button>)}
            </div>
            <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Site conditions, phase updates, sub notes, anything job-related..." rows={3} style={{...inputSt,resize:"vertical",lineHeight:1.7,marginBottom:10}}/>
            <button onClick={addNote} disabled={savingNote||!noteText.trim()} style={{width:"100%",background:noteText.trim()?GD:"#374151",border:"none",color:noteText.trim()?NV:"#6e7681",padding:"10px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:800,cursor:noteText.trim()?"pointer":"default",letterSpacing:1,borderRadius:2}}>{savingNote?"SAVING...":"ADD NOTE"}</button>
          </div>
          {!(job.activity||[]).length&&<div style={{textAlign:"center",padding:"30px",color:"#484f58",fontSize:13}}>No notes yet. Add the first one above.</div>}
          {(job.activity||[]).map((n,i)=>(
            <div key={n.id||i} style={{background:SF,border:`1px solid ${BD}`,borderLeft:`3px solid ${GD}`,padding:"12px 14px",borderRadius:2,marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:11,fontWeight:700,color:GD,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1}}>{n.author||"Kalin"}</span>
                <span style={{fontSize:10,color:"#484f58"}}>{fmtDate(n.created_at||n.created)}</span>
              </div>
              <div style={{fontSize:13,color:"#c9d1d9",lineHeight:1.7}}>{n.content}</div>
            </div>
          ))}
        </div>}

        {/* ── PHOTOS TAB ── */}
        {tab==="photos"&&<div>
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            <input ref={pr} type="file" accept="image/*" multiple onChange={onFile} style={{display:"none"}}/>
            <input ref={vr} type="file" accept="video/*" multiple onChange={onFile} style={{display:"none"}}/>
            <button onClick={()=>pr.current.click()} disabled={uploading} style={{flex:1,background:"transparent",border:`1px solid ${GD}`,color:GD,padding:"12px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,cursor:"pointer",borderRadius:2,letterSpacing:1,fontWeight:700}}>📷 ADD PHOTOS</button>
            <button onClick={()=>vr.current.click()} disabled={uploading} style={{flex:1,background:"transparent",border:`1px solid ${GD}`,color:GD,padding:"12px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,cursor:"pointer",borderRadius:2,letterSpacing:1,fontWeight:700}}>🎥 ADD VIDEO</button>
          </div>
          {uploading&&<div style={{background:"#0d1117",border:"1px solid #C9A84C44",padding:"12px 16px",marginBottom:12,borderRadius:2}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontSize:11,color:"#8b949e",fontFamily:"'Barlow Condensed',sans-serif"}}>UPLOADING TO SUPABASE</span>
              <span style={{fontSize:11,color:GD,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>{uploadPct}%</span>
            </div>
            <div style={{background:"#21262d",height:6,borderRadius:3}}><div style={{background:GD,height:6,borderRadius:3,width:`${uploadPct}%`,transition:"width 0.3s"}}/></div>
          </div>}
          {!(job.photos||[]).length&&!uploading&&<div style={{textAlign:"center",padding:"30px",color:"#484f58",fontSize:13}}>No photos yet. Tap ADD PHOTOS above.</div>}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {(job.photos||[]).map(p=>(
              <div key={p.id} style={{position:"relative",paddingBottom:"100%",background:"#0d1117",borderRadius:2,overflow:"hidden",border:`1px solid ${BD}`}}>
                {p.type==="video"?<video src={p.url||p.data} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}} controls/>:<img src={p.url||p.data} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>}
                <button onClick={()=>delPhoto(p.id)} style={{position:"absolute",top:4,right:4,background:"#ef444499",border:"none",color:"#fff",width:22,height:22,borderRadius:"50%",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
              </div>
            ))}
          </div>
        </div>}

        {/* ── CHANGE ORDERS TAB ── */}
        {tab==="co"&&<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div>
              <div style={{fontSize:11,color:"#8b949e",letterSpacing:2,fontFamily:"'Barlow Condensed',sans-serif"}}>CHANGE ORDERS</div>
              {coTotal>0&&<div style={{fontSize:13,color:"#f59e0b",fontWeight:600,marginTop:2}}>Approved CO Total: {fmtMoney(coTotal)}</div>}
            </div>
            <button onClick={()=>setShowCO(true)} style={{background:GD,border:"none",color:NV,padding:"7px 14px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,fontWeight:800,cursor:"pointer",letterSpacing:1,borderRadius:2}}>+ NEW CO</button>
          </div>

          {!(job.change_orders||[]).length&&<div style={{textAlign:"center",padding:"30px",color:"#484f58",fontSize:13}}>No change orders yet.</div>}

          {(job.change_orders||[]).map((co,i)=>(
            <div key={co.id||i} style={{background:SF,border:`1px solid ${BD}`,borderLeft:`4px solid ${co.status==="approved"?"#22c55e":co.status==="rejected"?"#ef4444":"#f59e0b"}`,padding:"14px 16px",borderRadius:2,marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div>
                  <div style={{fontSize:12,fontWeight:800,color:GD,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1}}>{co.co_number}</div>
                  <div style={{fontSize:13,color:"#e6edf3",marginTop:2,fontWeight:600}}>{co.description}</div>
                  {co.reason&&<div style={{fontSize:12,color:"#8b949e",marginTop:2}}>{co.reason}</div>}
                </div>
                <div style={{textAlign:"right",flexShrink:0,marginLeft:12}}>
                  <div style={{fontSize:16,fontWeight:800,color:"#22c55e",fontFamily:"'Barlow Condensed',sans-serif"}}>{fmtMoney(co.amount)}</div>
                  <div style={{fontSize:10,color:co.status==="approved"?"#22c55e":co.status==="rejected"?"#ef4444":"#f59e0b",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1,marginTop:2}}>{co.status.toUpperCase()}</div>
                </div>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:10,color:"#484f58"}}>{fmtDate(co.created_at)}</div>
                {co.status==="pending"&&<div style={{display:"flex",gap:8}}>
                  <button onClick={()=>approveCO(co.id)} style={{background:"#22c55e22",border:"1px solid #22c55e44",color:"#22c55e",padding:"5px 12px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,cursor:"pointer",borderRadius:2,letterSpacing:1}}>✓ APPROVE</button>
                  <button onClick={()=>{sbUpdateCO(co.id,{status:"rejected"});const u=(job.change_orders||[]).map(c=>c.id===co.id?{...c,status:"rejected"}:c);upd({change_orders:u});}} style={{background:"#ef444422",border:"1px solid #ef444444",color:"#ef4444",padding:"5px 12px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,cursor:"pointer",borderRadius:2,letterSpacing:1}}>✕ REJECT</button>
                </div>}
              </div>
            </div>
          ))}
        </div>}
      </div>

      {/* Status picker modal */}
      {esSt&&<div style={{position:"fixed",inset:0,background:"#000000dd",zIndex:1000,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:SF,border:`1px solid ${BD}`,borderTop:`3px solid ${GD}`,width:"100%",maxWidth:500,padding:"20px",borderRadius:"4px 4px 0 0",maxHeight:"70vh",overflowY:"auto"}}>
          <div style={{fontSize:13,fontWeight:700,color:"#e6edf3",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1,marginBottom:16}}>UPDATE STATUS</div>
          {STATS.map(st=><button key={st.id} onClick={()=>{upd({status:st.id});setEsSt(false);}} style={{width:"100%",background:job.status===st.id?st.c+"22":"transparent",border:`1px solid ${job.status===st.id?st.c:BD}`,color:job.status===st.id?st.c:"#8b949e",padding:"12px 16px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,cursor:"pointer",letterSpacing:1,borderRadius:2,marginBottom:8,textAlign:"left",display:"flex",alignItems:"center",gap:12}}><div style={{width:10,height:10,borderRadius:"50%",background:st.c,flexShrink:0}}/>{st.lb}{job.status===st.id&&<span style={{marginLeft:"auto"}}>✓</span>}</button>)}
          <button onClick={()=>setEsSt(false)} style={{width:"100%",background:"transparent",border:`1px solid ${BD}`,color:"#8b949e",padding:"12px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,cursor:"pointer",letterSpacing:1,borderRadius:2,marginTop:4}}>CANCEL</button>
        </div>
      </div>}

      {/* New CO modal */}
      {showCO&&<div style={{position:"fixed",inset:0,background:"#000000dd",zIndex:1000,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:SF,border:`1px solid ${BD}`,borderTop:`3px solid ${GD}`,width:"100%",maxWidth:500,padding:"24px 20px",borderRadius:"4px 4px 0 0",maxHeight:"80vh",overflowY:"auto"}}>
          <div style={{fontSize:14,fontWeight:700,color:"#e6edf3",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1,marginBottom:16}}>NEW CHANGE ORDER</div>
          <label style={{fontSize:11,color:"#8b949e",display:"block",marginBottom:4,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1}}>DESCRIPTION *</label>
          <input value={coDesc} onChange={e=>setCoDesc(e.target.value)} placeholder="What work is being added or changed?" style={inputSt}/>
          <label style={{fontSize:11,color:"#8b949e",display:"block",marginBottom:4,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1}}>REASON</label>
          <input value={coReason} onChange={e=>setCoReason(e.target.value)} placeholder="Why is this change needed?" style={inputSt}/>
          <label style={{fontSize:11,color:"#8b949e",display:"block",marginBottom:4,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1}}>AMOUNT ($) *</label>
          <input value={coAmt} onChange={e=>setCoAmt(e.target.value)} placeholder="e.g. 2500" type="number" style={inputSt}/>
          <div style={{display:"flex",gap:10,marginTop:8}}>
            <button onClick={()=>{setShowCO(false);setCoDesc("");setCoReason("");setCoAmt("");}} style={{flex:1,background:"transparent",border:`1px solid ${BD}`,color:"#8b949e",padding:"11px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,cursor:"pointer",borderRadius:2,letterSpacing:1}}>CANCEL</button>
            <button onClick={addCO} disabled={savingCO||!coDesc.trim()||!coAmt} style={{flex:1,background:coDesc.trim()&&coAmt?GD:"#374151",border:"none",color:coDesc.trim()&&coAmt?NV:"#6e7681",padding:"11px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:800,cursor:coDesc.trim()&&coAmt?"pointer":"default",borderRadius:2,letterSpacing:1}}>{savingCO?"SAVING...":"CREATE CO"}</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

function TkOf({back}){
  return(
    <div style={{flex:1,overflowY:"auto",background:DK}}>
      <div style={{background:NV,borderBottom:`2px solid ${GD}`,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}><button onClick={back} style={{background:"transparent",border:"none",color:"#8b949e",fontSize:22,cursor:"pointer"}}>←</button><div style={{fontSize:16,fontWeight:800,color:"#fff",fontFamily:"'Barlow Condensed',sans-serif"}}>MATERIAL TAKEOFF</div></div>
      <div style={{padding:"20px 16px"}}><div style={{background:SF,border:`1px solid ${BD}`,borderLeft:`4px solid ${GD}`,padding:"18px",borderRadius:2}}><div style={{fontSize:13,fontWeight:700,color:GD,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1,marginBottom:12}}>HOW TO GENERATE A MATERIAL LIST</div>{[["1","Complete Project Intake and Submit",GD],["2","Scan floor plan with LiDAR — label all rooms first","#3b82f6"],["3","Open claude.ai in a new chat","#22c55e"],["4","Upload the intake .json + floor plan PDF","#a855f7"],["5","Claude reads both and generates the full trade-by-trade material list","#f59e0b"]].map(([n,t,c])=><div key={n} style={{display:"flex",gap:12,marginBottom:12,alignItems:"flex-start"}}><div style={{background:c,color:NV,width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,flexShrink:0,fontFamily:"'Barlow Condensed',sans-serif"}}>{n}</div><div style={{fontSize:13,color:"#c9d1d9",lineHeight:1.6}}>{t}</div></div>)}</div></div>
    </div>
  );
}

function App(){
  const[pg,setPg]=useState("dashboard");
  const[jobs,setJobs]=useState(loadJ);
  const saveJob=(j)=>{const u=[j,...jobs];setJobs(u);saveJ(u);sbSaveJob(j);};
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100dvh",maxWidth:500,margin:"0 auto",background:DK,overflow:"hidden",fontFamily:"'Barlow',sans-serif"}}>
      <div style={{background:`linear-gradient(135deg, ${NV} 0%, #0f2d5e 100%)`,borderBottom:`3px solid ${GD}`,padding:"10px 16px",display:"flex",alignItems:"center",gap:12,flexShrink:0,paddingTop:"max(10px, env(safe-area-inset-top))"}}>
        <img src={L} alt="Avenstone" style={{width:32,height:32,objectFit:"contain",borderRadius:3}}/>
        <div><div style={{fontSize:8,color:GD,letterSpacing:4,fontFamily:"'Barlow Condensed',sans-serif"}}>{CFG.co.name.toUpperCase()}</div><div style={{fontSize:12,fontWeight:700,color:"#fff",letterSpacing:1,fontFamily:"'Barlow Condensed',sans-serif"}}>FIELD ESTIMATOR</div></div>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {pg==="dashboard"&&<Dash nav={setPg} jobs={jobs}/>}
        {pg==="jobs"&&<Jobs jobs={jobs} setJobs={setJobs} onBack={()=>setPg("dashboard")}/>}
        {pg==="intake"&&<FormScr title="Project Intake" secs={IQ} rules={IR} ftype="intake" onBack={()=>setPg("dashboard")} onSave={saveJob}/>}
        {pg==="bid"&&<FormScr title="Bid and Proposal" secs={BQ} rules={BR2} ftype="bid" onBack={()=>setPg("dashboard")}/>}
        {pg==="takeoff"&&<TkOf back={()=>setPg("dashboard")}/>}
      </div>
      {pg==="dashboard"&&<div style={{background:SF,borderTop:`1px solid ${BD}`,display:"flex",flexShrink:0,paddingBottom:"env(safe-area-inset-bottom)"}}>
        {[{id:"dashboard",ic:"🏠",lb:"Home"},{id:"jobs",ic:"🏗️",lb:"Projects"},{id:"intake",ic:"📋",lb:"Intake"},{id:"bid",ic:"💼",lb:"Bid"}].map(t=><button key={t.id} onClick={()=>setPg(t.id)} style={{flex:1,background:"transparent",border:"none",padding:"11px 0",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,borderTop:`2px solid ${pg===t.id?GD:"transparent"}`}}><span style={{fontSize:19}}>{t.ic}</span><span style={{fontSize:9,color:pg===t.id?GD:"#6e7681",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:1,textTransform:"uppercase"}}>{t.lb}</span></button>)}
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
