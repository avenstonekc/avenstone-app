const PIPELINE_COLS=[
  {id:"lead",        lb:"Lead",         c:"#6366f1"},
  {id:"bid_sent",    lb:"Bid Sent",     c:"#f59e0b"},
  {id:"signed",      lb:"Signed",       c:"#22c55e"},

function Pipeline({jobs,onStatusChange,onOpenJob}){
  const[dragging,setDragging]=useState(null);
  const[dragOver,setDragOver]=useState(null);
  const colJobs=col=>{
    if(col.ids)return jobs.filter(j=>col.ids.includes(j.status));
    return jobs.filter(j=>j.status===col.id);
  };
  const drop=async colId=>{
    if(!dragging||dragging===colId)return;
    const newStatus=colId==="active"?"demo":colId; // default active → demo
    onStatusChange(dragging,newStatus);
    setDragging(null);setDragOver(null);
  };
  const colVal=col=>colJobs(col).reduce((a,j)=>a+Number(j.contract_value||0),0);
  return(
    <div style={{overflowX:"auto",padding:"0 0 16px"}}>
      <div style={{display:"flex",gap:12,minWidth:PIPELINE_COLS.length*220+"px"}}>
        {PIPELINE_COLS.map(col=>{
          const cj=colJobs(col);
          const val=colVal(col);
          const isOver=dragOver===col.id;
          return(
            <div key={col.id}
              onDragOver={e=>{e.preventDefault();setDragOver(col.id);}}
              onDragLeave={()=>setDragOver(null)}
              onDrop={()=>drop(col.id)}
              style={{flex:"0 0 210px",background:isOver?"rgba(201,168,76,0.06)":"#F7F5F0",border:`2px dashed ${isOver?"#C9A84C":"#E8E4DC"}`,borderRadius:6,padding:10,minHeight:300,transition:"all 0.15s"}}>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:col.c,flexShrink:0}}/>
                <div style={{fontSize:11,fontWeight:700,color:"#0A1F44",textTransform:"uppercase",letterSpacing:1,flex:1}}>{col.lb}</div>
                <span style={{fontSize:10,background:col.c+"18",color:col.c,padding:"1px 7px",fontWeight:700}}>{cj.length}</span>
              </div>
              {val>0&&<div style={{fontSize:11,color:"#9CA3AF",marginBottom:8,fontWeight:600}}>{f$(val)}</div>}
              {cj.map(j=>(
                <div key={j.id}
                  draggable
                  onDragStart={()=>setDragging(j.id)}
                  onDragEnd={()=>{setDragging(null);setDragOver(null);}}
                  onClick={()=>onOpenJob(j)}
                  style={{background:"#fff",border:"1px solid #E8E4DC",borderLeft:`3px solid ${col.c}`,padding:"10px 12px",marginBottom:8,cursor:"grab",userSelect:"none",opacity:dragging===j.id?0.4:1,transition:"box-shadow 0.1s",boxShadow:dragging===j.id?"none":"0 1px 3px rgba(0,0,0,0.04)"}}
                  onMouseEnter={e=>e.currentTarget.style.boxShadow="0 2px 8px rgba(10,31,68,0.12)"}
                  onMouseLeave={e=>e.currentTarget.style.boxShadow=dragging===j.id?"none":"0 1px 3px rgba(0,0,0,0.04)"}>
                  <div style={{fontSize:12,fontWeight:600,color:"#0A1F44",marginBottom:3,lineHeight:1.4}}>{j.address}</div>
                  {j.client_name&&<div style={{fontSize:11,color:"#9CA3AF",marginBottom:3}}>{j.client_name}</div>}
                  {Number(j.contract_value)>0&&<div style={{fontSize:11,fontWeight:700,color:"#C9A84C"}}>{f$(Number(j.contract_value))}</div>}
                  {j.assigned_rep&&<div style={{fontSize:10,color:"#D1C9B8",marginTop:3}}>{j.assigned_rep}</div>}
                </div>
              ))}
              {!cj.length&&<div style={{textAlign:"center",padding:"20px 0",color:"#D1C9B8",fontSize:12,fontStyle:"italic"}}>Drop here</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function UserMgmt(){
  const[team,setTeam]=useState([]);
  const[loading,setLoading]=useState(true);
  const[showAdd,setShowAdd]=useState(false);
  const[form,setForm]=useState({name:"",email:"",role:"sales_rep"});
  const[saving,setSaving]=useState(false);
  const[err,setErr]=useState("");
  const[editRole,setEditRole]=useState(null); // {id, role}
  const[commEdit,setCommEdit]=useState(null); // {id, pct, dollar}
  useEffect(()=>{sbLoadTeam().then(d=>{setTeam(d);setLoading(false);});},[]);
  const invite=async()=>{
    if(!form.name.trim()||!form.email.trim()){setErr("Name and email required.");return;}
    setSaving(true);setErr("");
    try{
      const res=await sbInviteStaff(form.name.trim(),form.email.trim(),form.role);
      if(res.error){setErr(res.error);setSaving(false);return;}
      setTeam(await sbLoadTeam());
      setForm({name:"",email:"",role:"sales_rep"});setShowAdd(false);
    }catch(e){setErr(e?.message||"Something went wrong — check that the send-invite function is deployed");}
    setSaving(false);
  };
  const toggleActive=async u=>{
    await sbSetUserActive(u.id,!u.is_active);
    setTeam(p=>p.map(x=>x.id===u.id?{...x,is_active:!u.is_active}:x));
  };
  const saveRole=async()=>{
    if(!editRole)return;
    await sbSetUserRole(editRole.id,editRole.role);
    setTeam(p=>p.map(x=>x.id===editRole.id?{...x,role:editRole.role}:x));
    setEditRole(null);
  };
  const saveComm=async()=>{
    if(!commEdit)return;
    await sbSaveCommission(commEdit.id,commEdit.pct,commEdit.dollar);
    setTeam(p=>p.map(x=>x.id===commEdit.id?{...x,commission_pct:Number(commEdit.pct)||0,commission_dollar:Number(commEdit.dollar)||0}:x));

function PushEnableButton({profile}){
  const[status,setStatus]=useState(()=>{
    if(!("Notification" in window))return "unsupported";
    return Notification.permission; // "default" | "granted" | "denied"
  });
  const[loading,setLoading]=useState(false);

  const enable=async()=>{
    setLoading(true);
    try{
      const perm=await Notification.requestPermission();
      setStatus(perm);
      if(perm==="granted"){
        const reg=await navigator.serviceWorker.register("/sw.js");
        await navigator.serviceWorker.ready;
        const VAPID_PUBLIC="BOwPGVdaON00Aqor0hyG7HLR6nx9VX3YA1FhlrwahMiBnBhAqTk_zPUu6BfuQ0F0aRh70r7ru0uxrDR4Is5DVXI";
        const b64ToUint8=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
        let sub=await reg.pushManager.getSubscription();
        if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToUint8(VAPID_PUBLIC)});
        const{endpoint,keys}=sub.toJSON();
        await window.SB.from("push_subscriptions").upsert({user_id:profile.id,endpoint,p256dh:keys.p256dh,auth:keys.auth},{onConflict:"user_id,endpoint"});
      }
    }catch(e){console.warn("push enable error",e);}
    setLoading(false);
  };

  if(status==="unsupported")return null;

  if(status==="granted")return(
    <div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:4,padding:"10px 14px",display:"flex",alignItems:"center",gap:8,fontSize:13}}>
      <span style={{color:"#16a34a",fontSize:16}}>✓</span>
      <span style={{color:"#16a34a",fontWeight:600}}>Push notifications enabled on this device</span>
    </div>
  );

  if(status==="denied")return(
    <div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:4,padding:"10px 14px",fontSize:12,color:"#DC2626"}}>
      Notifications blocked. Go to your browser/phone Settings → Notifications → find this site and allow it.
    </div>
  );

  return(
    <button className="btn btn-outline" style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:8}} onClick={enable} disabled={loading}>
      <span style={{fontSize:16}}>🔔</span>{loading?"Enabling...":"Enable Push Notifications on This Device"}
    </button>
  );
}

          {resetSent?`We sent a password reset link to `:`We sent a sign-in link to `}<strong>{email}</strong>.{resetSent?" Click it to set a new password.":" Click it to access your project portal."}
        </div>
        <button className="auth-link" onClick={()=>{setMagicSent(false);setResetSent(false);setMode("password");setErr("");}}>Back to sign in</button>
      </div>
    </div>
  );

  if(mode==="forgot")return(
    <div className="auth-wrap">
      <div className="auth-card">
        <div className="auth-logo"><img src={L} alt="Avenstone"/></div>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#0A1F44",marginBottom:4,textAlign:"center"}}>Reset Password</div>
        <div style={{fontSize:13,color:"#9CA3AF",textAlign:"center",marginBottom:28}}>Enter your email and we'll send a reset link</div>
        {err&&<div className="auth-err">{err}</div>}
        <div className="fg"><label className="flbl">Email</label><input className="finp" type="email" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} placeholder="you@company.com" onKeyDown={e=>e.key==="Enter"&&sendReset()} autoFocus/></div>
        <button className="btn btn-navy" style={{width:"100%",padding:"12px",fontSize:13}} onClick={sendReset} disabled={loading}>{loading?"Sending...":"Send Reset Link"}</button>
        <div style={{marginTop:16,textAlign:"center"}}><button className="auth-link" onClick={()=>{setMode("password");setErr("");}}>Back to sign in</button></div>
      </div>
    </div>
  );

  return(
    <div className="auth-wrap">
      <div className="auth-card">
        <div className="auth-logo"><img src={L} alt="Avenstone"/></div>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#0A1F44",marginBottom:4,textAlign:"center"}}>Sign in</div>
        <div style={{fontSize:13,color:"#9CA3AF",textAlign:"center",marginBottom:28}}>Avenstone Group</div>
        {err&&<div className="auth-err">{err}</div>}
        <div className="fg">
          <label className="flbl">Email</label>
          <input className="finp" type="email" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} placeholder="you@company.com" onKeyDown={e=>e.key==="Enter"&&(mode==="password"?signIn():sendMagic())} autoFocus/>
        </div>
        {mode==="password"&&(
          <div className="fg">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <label className="flbl" style={{margin:0}}>Password</label>
              <button className="auth-link" style={{fontSize:11,padding:0}} onClick={()=>{setMode("forgot");setErr("");}}>Forgot password?</button>
            </div>
            <input className="finp" type="password" value={password} onChange={e=>{setPassword(e.target.value);setErr("");}} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&signIn()}/>
          </div>
        )}
        <button className="btn btn-navy" style={{width:"100%",padding:"12px",fontSize:13}} onClick={mode==="password"?signIn:sendMagic} disabled={loading}>
          {loading?(mode==="password"?"Signing in...":"Sending..."):(mode==="password"?"Sign In":"Send Magic Link")}
        </button>
        <div className="auth-divider">or</div>
        {mode==="password"
          ?<button className="auth-link" style={{width:"100%",textAlign:"center",display:"block"}} onClick={()=>{setMode("magic");setErr("");}}>Sign in with a magic link</button>
          :<button className="auth-link" style={{width:"100%",textAlign:"center",display:"block"}} onClick={()=>{setMode("password");setErr("");}}>Sign in with a password instead</button>
        }
        <div className="auth-foot">Invite only — contact your administrator</div>
      </div>
    </div>
  );
}

function Reports({jobs,profile}){
  const isOwner=profile?.role==="owner";
  const isRep=profile?.role==="sales_rep";
  // Filter jobs by role — reps only see their own
  const myJobs=isOwner?jobs:jobs.filter(j=>(j.assigned_rep||"")===(profile?.full_name||profile?.email||"__none__"));
  const active=myJobs.filter(j=>!["complete","on_hold"].includes(j.status));
  const complete=myJobs.filter(j=>j.status==="complete");
  const leads=myJobs.filter(j=>j.status==="lead");
  const bids=myJobs.filter(j=>j.status==="bid_sent");
  const signed=myJobs.filter(j=>j.status==="signed");
  const inProgress=myJobs.filter(j=>["demo","framing","rough_mep","drywall","finish","punch"].includes(j.status));
  const[subRatings,setSubRatings]=useState([]);
  const[logStats,setLogStats]=useState([]);
  const[payments,setPayments]=useState([]);
  const[repProfiles,setRepProfiles]=useState([]);
  const[reportTab,setReportTab]=useState("overview");
  useEffect(()=>{
    window.SB.from("sub_ratings").select("sub_id,stars,sub:sub_id(full_name,trade)").eq("tenant_id",window.AV_TENANT).then(({data})=>{if(data)setSubRatings(data);});
    window.SB.from("daily_logs").select("job_id,crew_count,hours_worked,job:job_id(address)").eq("tenant_id",window.AV_TENANT).then(({data})=>{if(data)setLogStats(data);});
    window.SB.from("payments").select("*").eq("tenant_id",window.AV_TENANT).eq("status","paid").then(({data})=>{if(data)setPayments(data);});
    if(isOwner){window.SB.from("profiles").select("*").eq("tenant_id",window.AV_TENANT).in("role",["sales_rep","owner","project_manager"]).then(({data})=>{if(data)setRepProfiles(data);});}
  },[]);
  // Sub leaderboard
  const subMap={};
  subRatings.forEach(r=>{const k=r.sub_id;if(!subMap[k])subMap[k]={name:r.sub?.full_name||"Unknown",trade:r.sub?.trade||"",sum:0,cnt:0};subMap[k].sum+=r.stars;subMap[k].cnt++;});
  const subLeaderboard=Object.values(subMap).map(s=>({...s,avg:s.sum/s.cnt})).sort((a,b)=>b.avg-a.avg||b.cnt-a.cnt).slice(0,8);
  // Daily log hours by job
  const logByJob={};
  logStats.forEach(l=>{const k=l.job_id;if(!logByJob[k])logByJob[k]={address:l.job?.address||l.job_id,hours:0,crew:0,logs:0};logByJob[k].hours+=Number(l.hours_worked||0);logByJob[k].crew+=Number(l.crew_count||0);logByJob[k].logs++;});
  const logRows=Object.values(logByJob).sort((a,b)=>b.hours-a.hours).slice(0,8);
  const totalHours=logStats.reduce((a,l)=>a+Number(l.hours_worked||0),0);

  const totalContract=myJobs.reduce((a,j)=>a+Number(j.contract_value||0),0);
  const totalCOs=myJobs.reduce((a,j)=>a+Number(j.co_total||0),0);
  const totalRevenue=totalContract+totalCOs;
  const completedRevenue=complete.reduce((a,j)=>a+Number(j.contract_value||0)+Number(j.co_total||0),0);
  const pipelineValue=bids.reduce((a,j)=>a+Number(j.contract_value||0),0);
  const activeValue=inProgress.reduce((a,j)=>a+Number(j.contract_value||0),0);
  const totalCollected=payments.reduce((a,p)=>a+Number(p.amount||0),0);
  const totalOutstanding=totalRevenue-totalCollected;

  // Jobs by rep (owner view)
  const byRep={};
  jobs.forEach(j=>{
    const r=j.assigned_rep||"Unassigned";
    if(!byRep[r])byRep[r]={name:r,total:0,active:0,complete:0,value:0,collected:0,commission_pct:0,commission_dollar:0};
    byRep[r].total++;
    if(!["complete","on_hold"].includes(j.status))byRep[r].active++;
    if(j.status==="complete")byRep[r].complete++;
    byRep[r].value+=Number(j.contract_value||0);
  });
  // Apply commission rates from profiles
  repProfiles.forEach(p=>{
    const key=p.full_name||p.email||"";
    if(byRep[key]){byRep[key].commission_pct=Number(p.commission_pct||0);byRep[key].commission_dollar=Number(p.commission_dollar||0);}
  });
  payments.forEach(p=>{
    const j=jobs.find(jj=>jj.id===p.job_id);
    if(j){const r=j.assigned_rep||"Unassigned";if(byRep[r])byRep[r].collected+=Number(p.amount||0);}
  });
  const repRows=Object.entries(byRep).sort((a,b)=>b[1].value-a[1].value);

  // Status breakdown
  const statusBreakdown=STATS.map(s=>({...s,count:myJobs.filter(j=>j.status===s.id).length,value:myJobs.filter(j=>j.status===s.id).reduce((a,j)=>a+Number(j.contract_value||0),0)})).filter(s=>s.count>0);

  // Monthly revenue (last 6 months)
  const now=new Date();
  const months=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,1);return{label:d.toLocaleDateString("en-US",{month:"short",year:"2-digit"}),year:d.getFullYear(),month:d.getMonth()};});
  const monthlyData=months.map(m=>({
    ...m,
    contracted:myJobs.filter(j=>{const d=new Date(j.created);return d.getFullYear()===m.year&&d.getMonth()===m.month;}).reduce((a,j)=>a+Number(j.contract_value||0),0),
    collected:payments.filter(p=>{const d=new Date(p.created_at);return d.getFullYear()===m.year&&d.getMonth()===m.month;}).reduce((a,p)=>a+Number(p.amount||0),0),
  }));
  const maxMonthly=Math.max(...monthlyData.map(m=>Math.max(m.contracted,m.collected)),1);

  // My commission (rep view)
  const myCommPct=Number(repProfiles.find(p=>p.id===profile?.id)?.commission_pct||0);
  const myCommDollar=Number(repProfiles.find(p=>p.id===profile?.id)?.commission_dollar||0);
  const myCollected=payments.filter(p=>{const j=myJobs.find(jj=>jj.id===p.job_id);return!!j;}).reduce((a,p)=>a+Number(p.amount||0),0);
  const myCommEarned=myCommDollar>0?(myJobs.filter(j=>j.status==="complete").length*myCommDollar):(myCollected*(myCommPct/100));
  const myCommPending=myCommDollar>0?((myJobs.filter(j=>["signed","demo","framing","rough_mep","drywall","finish","punch"].includes(j.status)).length)*myCommDollar):(totalOutstanding*(myCommPct/100));

  const Stat=({label,value,sub,color})=>(
    <div style={{background:"#fff",border:"1px solid #E8E4DC",padding:"18px 20px"}}>
      <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>{label}</div>
      <div style={{fontFamily:"'DM Serif Display',serif",fontSize:24,color:color||"#0A1F44",marginBottom:sub?4:0}}>{value}</div>
      {sub&&<div style={{fontSize:12,color:"#9CA3AF"}}>{sub}</div>}
    </div>
  );

  const REPORT_TABS=isOwner
    ?[{id:"overview",lb:"Overview"},{id:"revenue",lb:"Revenue"},{id:"commissions",lb:"Commissions"},{id:"labor",lb:"Labor"}]
    :[{id:"overview",lb:"Overview"},{id:"commissions",lb:"My Commission"}];

  return(
    <div style={{padding:20,maxWidth:900}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div><div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:"#0A1F44"}}>Reports</div>
        {!isOwner&&<div style={{fontSize:12,color:"#9CA3AF",marginTop:2}}>Your projects only</div>}</div>
        <button className="btn btn-ghost" style={{fontSize:12}} onClick={()=>{
          const rows=[["Address","Client","Status","Contract","CO Total","Collected","Rep","Target"].join(","),...myJobs.map(j=>{const col=payments.filter(p=>p.job_id===j.id).reduce((a,p)=>a+Number(p.amount||0),0);return[`"${j.address||""}"`,`"${j.client_name||""}"`,j.status||"",j.contract_value||0,j.co_total||0,col,`"${j.assigned_rep||""}"`,j.target_completion||""].join(",");})];
          const blob=new Blob([rows.join("\n")],{type:"text/csv"});
          const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`avenstone-report-${new Date().toISOString().slice(0,10)}.csv`;a.click();
        }}>⬇ Export CSV</button>
      </div>

      {/* Report tabs */}
      <div style={{display:"flex",borderBottom:"1px solid #E8E4DC",marginBottom:20}}>
        {REPORT_TABS.map(t=><button key={t.id} onClick={()=>setReportTab(t.id)} style={{padding:"8px 16px",border:"none",background:"transparent",fontWeight:600,fontSize:12,cursor:"pointer",borderBottom:`2px solid ${reportTab===t.id?"#C9A84C":"transparent"}`,color:reportTab===t.id?"#0A1F44":"#9CA3AF"}}>{t.lb}</button>)}
      </div>

      {reportTab==="overview"&&<>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12,marginBottom:24}}>
          <Stat label="Total Contracted" value={f$(totalRevenue)} sub={totalCOs>0?`incl. ${f$(totalCOs)} COs`:null}/>
          <Stat label="Collected" value={f$(totalCollected)} sub="payments received" color="#22c55e"/>
          <Stat label="Outstanding" value={f$(Math.max(totalOutstanding,0))} sub="not yet collected" color="#f59e0b"/>
          <Stat label="Completed" value={f$(completedRevenue)} sub={`${complete.length} jobs`} color="#22c55e"/>
          <Stat label="Pipeline" value={f$(pipelineValue)} sub={`${bids.length} bids out`} color="#6366f1"/>
          <Stat label="Avg Job Value" value={myJobs.length?f$(Math.round(totalContract/myJobs.length)):f$(0)} sub="contract value"/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
          <div style={{background:"#fff",border:"1px solid #E8E4DC",padding:20}}>
            <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>By Status</div>
            {statusBreakdown.map(s=>(
              <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:s.c,flexShrink:0}}/>
                <div style={{flex:1,fontSize:13,color:"#374151"}}>{s.lb}</div>
                <div style={{fontSize:12,fontWeight:700,color:"#0A1F44",minWidth:20,textAlign:"right"}}>{s.count}</div>
                {s.value>0&&<div style={{fontSize:11,color:"#9CA3AF",minWidth:70,textAlign:"right"}}>{f$(s.value)}</div>}
              </div>
            ))}
            {!statusBreakdown.length&&<div style={{fontSize:13,color:"#9CA3AF",textAlign:"center",padding:20}}>No jobs yet</div>}
          </div>
          {complete.length>0&&<div style={{background:"#fff",border:"1px solid #E8E4DC",padding:20}}>
            <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>Completed Jobs</div>
            {complete.slice(0,8).map(j=>{const col=payments.filter(p=>p.job_id===j.id).reduce((a,p)=>a+Number(p.amount||0),0);const tot=Number(j.contract_value||0)+Number(j.co_total||0);return(
              <div key={j.id} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 0",borderBottom:"1px solid #F3F0E8"}}>
                <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,color:"#0A1F44",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{j.address}</div>{j.assigned_rep&&<div style={{fontSize:11,color:"#9CA3AF"}}>{j.assigned_rep}</div>}</div>
                <div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:13,fontWeight:700,color:"#22c55e"}}>{f$(tot)}</div>{col<tot&&<div style={{fontSize:10,color:"#f59e0b"}}>{f$(tot-col)} outstanding</div>}</div>
              </div>
            );})}
          </div>}
        </div>
      </>}

      {reportTab==="revenue"&&isOwner&&<>
        <div style={{background:"#fff",border:"1px solid #E8E4DC",padding:20,marginBottom:20}}>
          <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:16}}>Monthly — Contracted vs Collected</div>
          <div style={{display:"flex",alignItems:"flex-end",gap:8,height:140}}>
            {monthlyData.map(m=>(
              <div key={m.label} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <div style={{fontSize:9,color:"#9CA3AF",fontWeight:600,textAlign:"center"}}>{m.contracted>0?f$(m.contracted):""}</div>
                <div style={{width:"100%",display:"flex",gap:2,alignItems:"flex-end",height:100}}>
                  <div style={{flex:1,background:"#0A1F44",borderRadius:"2px 2px 0 0",height:`${Math.max((m.contracted/maxMonthly)*100,m.contracted>0?4:0)}px`,transition:"height 0.3s"}}/>
                  <div style={{flex:1,background:"#22c55e",borderRadius:"2px 2px 0 0",height:`${Math.max((m.collected/maxMonthly)*100,m.collected>0?4:0)}px`,transition:"height 0.3s"}}/>
                </div>
                <div style={{fontSize:9,color:"#9CA3AF"}}>{m.label}</div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:16,marginTop:12,fontSize:11,color:"#9CA3AF"}}>
            <span><span style={{display:"inline-block",width:10,height:10,background:"#0A1F44",borderRadius:2,marginRight:4}}/>Contracted</span>
            <span><span style={{display:"inline-block",width:10,height:10,background:"#22c55e",borderRadius:2,marginRight:4}}/>Collected</span>
          </div>
        </div>
        <div style={{background:"#fff",border:"1px solid #E8E4DC",padding:20}}>
          <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>Revenue by Rep</div>
          {repRows.map(([rep,d])=>(
            <div key={rep} style={{marginBottom:14,paddingBottom:14,borderBottom:"1px solid #F3F0E8"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <div style={{fontSize:13,fontWeight:600,color:"#0A1F44"}}>{rep}</div>
                <div style={{textAlign:"right"}}><div style={{fontSize:13,fontWeight:700,color:"#0A1F44"}}>{f$(d.value)}</div><div style={{fontSize:11,color:"#22c55e"}}>{f$(d.collected)} collected</div></div>
              </div>
              <div style={{display:"flex",gap:12,fontSize:11,color:"#9CA3AF"}}>
                <span>{d.total} jobs</span><span style={{color:"#6366f1"}}>{d.active} active</span><span style={{color:"#22c55e"}}>{d.complete} complete</span>
              </div>
            </div>
          ))}
        </div>
      </>}

      {reportTab==="commissions"&&<>
        {isOwner&&<div style={{background:"#fff",border:"1px solid #E8E4DC",padding:20,marginBottom:20}}>
          <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>Commission Rates — set per rep in Team settings</div>
          {repRows.map(([rep,d])=>{
            const commPct=d.commission_pct||0;
            const commDollar=d.commission_dollar||0;
            const earned=commDollar>0?(d.complete*commDollar):(d.collected*(commPct/100));
            const pending=commDollar>0?(d.active*commDollar):((d.value-d.collected)*(commPct/100));
            const rateLabel=commDollar>0?`${f$(commDollar)}/job flat`:commPct>0?`${commPct}% of collected`:"No rate set";
            return(
              <div key={rep} style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,paddingBottom:12,borderBottom:"1px solid #F3F0E8"}}>
                <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:"#0A1F44"}}>{rep}</div><div style={{fontSize:11,color:"#9CA3AF"}}>{rateLabel}</div></div>
                <div style={{textAlign:"right"}}><div style={{fontSize:13,fontWeight:700,color:"#22c55e"}}>{f$(earned)} earned</div><div style={{fontSize:11,color:"#f59e0b"}}>{f$(Math.max(pending,0))} pending</div></div>
              </div>
            );
          })}
          {!repRows.length&&<div style={{fontSize:13,color:"#9CA3AF",textAlign:"center",padding:20}}>No reps yet</div>}
        </div>}
        {!isOwner&&<>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
            <Stat label="Commission Earned" value={f$(myCommEarned)} sub={myCommPct>0?`${myCommPct}% of collected`:(myCommDollar>0?`${f$(myCommDollar)}/sale`:"")} color="#22c55e"/>
            <Stat label="Commission Pending" value={f$(myCommPending)} sub="on active jobs" color="#f59e0b"/>
          </div>
          <div style={{background:"#fff",border:"1px solid #E8E4DC",padding:20}}>
            <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>My Jobs</div>
            {myJobs.map(j=>{const col=payments.filter(p=>p.job_id===j.id).reduce((a,p)=>a+Number(p.amount||0),0);const comm=myCommDollar>0?(j.status==="complete"?myCommDollar:0):(col*(myCommPct/100));return(
              <div key={j.id} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 0",borderBottom:"1px solid #F3F0E8"}}>
                <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,color:"#0A1F44",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{j.address}</div><div style={{fontSize:11,color:"#9CA3AF"}}>{j.status}</div></div>
                <div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:12,color:"#374151"}}>{f$(Number(j.contract_value||0))}</div>{comm>0&&<div style={{fontSize:11,color:"#22c55e",fontWeight:600}}>{f$(comm)} commission</div>}</div>
              </div>
            );})}
          </div>
        </>}
      </>}

      {reportTab==="labor"&&isOwner&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
          <div style={{background:"#fff",border:"1px solid #E8E4DC",padding:20}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1}}>Labor Hours by Job</div>
              {totalHours>0&&<div style={{fontSize:12,fontWeight:700,color:"#0A1F44"}}>{totalHours.toLocaleString()} total</div>}
            </div>
            {logRows.length===0&&<div style={{fontSize:13,color:"#9CA3AF",textAlign:"center",padding:20}}>No daily logs yet</div>}
            {logRows.map((r,i)=>(
              <div key={i} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,fontWeight:600,color:"#374151",marginBottom:3}}>
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1,marginRight:8}}>{r.address}</span>
                  <span style={{flexShrink:0,color:"#0A1F44"}}>{r.hours} hrs</span>
                </div>
                <div style={{background:"#F7F5F0",height:6,borderRadius:3}}>
                  <div style={{background:"#C9A84C",height:6,borderRadius:3,width:`${Math.min((r.hours/Math.max(...logRows.map(x=>x.hours),1))*100,100)}%`,transition:"width 0.4s"}}/>
                </div>

function SetPasswordScr({onDone}){
  const[pw,setPw]=useState("");
  const[pw2,setPw2]=useState("");
  const[saving,setSaving]=useState(false);
  const[err,setErr]=useState("");
  const save=async()=>{
    if(pw.length<8){setErr("Password must be at least 8 characters.");return;}
    if(pw!==pw2){setErr("Passwords don't match.");return;}
    setSaving(true);setErr("");
    const{error}=await window.SB.auth.updateUser({password:pw});
    if(error){setErr(error.message);setSaving(false);return;}
    onDone();
  };
  return(
    <div style={{minHeight:"100dvh",background:"#F7F5F0",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:"#fff",border:"1px solid #E8E4DC",padding:40,maxWidth:400,width:"100%"}}>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#0A1F44",marginBottom:4}}>Set your password</div>
        <div style={{fontSize:13,color:"#9CA3AF",marginBottom:24,lineHeight:1.6}}>Choose a password to secure your Avenstone account.</div>
        {err&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",color:"#DC2626",padding:"10px 12px",fontSize:13,marginBottom:16,borderRadius:4}}>{err}</div>}
        <div className="fg"><label className="flbl">New Password</label><input className="finp" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="At least 8 characters"/></div>
        <div className="fg"><label className="flbl">Confirm Password</label><input className="finp" type="password" value={pw2} onChange={e=>setPw2(e.target.value)} placeholder="Repeat password" onKeyDown={e=>{if(e.key==="Enter")save();}}/></div>
        <button className={`btn ${pw&&pw2?"btn-navy":"btn-ghost"}`} style={{width:"100%",marginTop:8}} onClick={save} disabled={saving||!pw||!pw2}>{saving?"Saving...":"Set Password & Continue →"}</button>
      </div>
    </div>
  );
}

function App(){
  const[session,setSession]=useState(null);
  const[profile,setProfile]=useState(null);
  const[authLoading,setAuthLoading]=useState(true);
  const[pg,setPg]=useState("dashboard");
  const[jobs,setJobs]=useState(()=>ll("av_j",[]));
  const[notifs,setNotifs]=useState([]);
  const[showNotif,setShowNotif]=useState(false);
  const[showSettings,setShowSettings]=useState(false);
  const[pendingJobId,setPendingJobId]=useState(null);
  const[pendingNew,setPendingNew]=useState(false);

  useEffect(()=>{
    // Check for an existing session on first load
    window.SB.auth.getSession().then(({data:{session:s}})=>{
      setSession(s);
      if(s)loadProfile(s.user.id);
      else setAuthLoading(false);
    });
    // Keep auth state in sync (login, logout, token refresh, magic link callback)
    const{data:{subscription}}=window.SB.auth.onAuthStateChange((_,s)=>{
      setSession(s);
      if(s)loadProfile(s.user.id);
      else{setProfile(null);setAuthLoading(false);}
    });
    return()=>subscription.unsubscribe();
  },[]);

  const loadProfile=async uid=>{
    const{data}=await window.SB.from("profiles").select("*").eq("id",uid).single();
    setProfile(data);
    window.AV_TENANT=data?.tenant_id;
    window.AV_USER_ID=uid;
    sbLoadNotifs().then(d=>setNotifs(d));
    setAuthLoading(false);
  };

  const registerPush=async uid=>{
    if(!("serviceWorker" in navigator)||!("PushManager" in window))return;
    try{
      const reg=await navigator.serviceWorker.register("/sw.js");
      await navigator.serviceWorker.ready;
      // Ask permission
      const perm=await Notification.requestPermission();
      if(perm!=="granted")return;
      const VAPID_PUBLIC="BOwPGVdaON00Aqor0hyG7HLR6nx9VX3YA1FhlrwahMiBnBhAqTk_zPUu6BfuQ0F0aRh70r7ru0uxrDR4Is5DVXI";
      let sub=await reg.pushManager.getSubscription();
      if(!sub){
        sub=await reg.pushManager.subscribe({
          userVisibleOnly:true,
          applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)
        });
      }
      const {endpoint,keys}=sub.toJSON();
      await window.SB.from("push_subscriptions").upsert({
        user_id:uid,
        endpoint,
        p256dh:keys.p256dh,
        auth:keys.auth
      },{onConflict:"user_id,endpoint"});
    }catch(e){console.warn("Push registration failed:",e);}
  };

  function urlBase64ToUint8Array(base64String){
    const padding="=".repeat((4-base64String.length%4)%4);
    const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
    const raw=atob(base64);
    return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
  }

  useEffect(()=>{window.AV_JOBS=jobs;},[jobs]);
  const saveJob=j=>{const u=[j,...jobs];setJobs(u);ls("av_j",u);sbSave(j);};
  const signOut=async()=>{await window.SB.auth.signOut();ls("av_j",[]);setJobs([]);setNotifs([]);};

  // Real-time: push new notifications into state as they arrive
  useEffect(()=>{
    if(!profile?.id)return;
    const ch=window.SB.channel("notif-"+profile.id)
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:`user_id=eq.${profile.id}`},
        payload=>setNotifs(p=>[payload.new,...p]))
      .subscribe();
    return()=>window.SB.removeChannel(ch);
  },[profile?.id]);

  const unreadCount=notifs.filter(n=>!n.read).length;
  const markAllNotifsRead=async()=>{
    const ids=notifs.filter(n=>!n.read).map(n=>n.id);
    if(!ids.length)return;
    await sbMarkNotifsRead(ids);
    setNotifs(p=>p.map(n=>({...n,read:true})));
  };
  const onClickNotif=async n=>{
    if(!n.read){await sbMarkNotifsRead([n.id]);setNotifs(p=>p.map(x=>x.id===n.id?{...x,read:true}:x));}
    if(n.job_id){setPendingJobId(n.job_id);setPg("jobs");}
    setShowNotif(false);
  };

  // Auth loading — full-screen spinner on navy background
  if(authLoading)return(
    <div style={{minHeight:"100dvh",background:"#0A1F44",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <img src={L} alt="Avenstone" style={{width:64,height:64,objectFit:"contain",opacity:0.7}}/>
      <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",letterSpacing:3,textTransform:"uppercase"}}>Loading</div>
    </div>
  );

  if(window.AV_STATUS_TOKEN)return <StatusPage token={window.AV_STATUS_TOKEN}/>;
  if(!session)return <LoginScr/>;

  // Invite or password reset — force password setup before entering app
  // AV_INVITE_TYPE captured before createClient clears the hash
  const urlType=window.AV_INVITE_TYPE;
  if((urlType==="invite"||urlType==="recovery")&&session){
    return <SetPasswordScr onDone={()=>{window.AV_INVITE_TYPE=null;window.history.replaceState(null,"",window.location.pathname);}}/>;
  }

  // Sub portal — assigned jobs, photos, messaging
  if(profile?.role==="sub")return <SubPortal profile={profile} signOut={signOut}/>;

  // Client portal
  if(profile?.role==="client")return <ClientPortal profile={profile} signOut={signOut}/>;

  const isOwnerOrRep=["owner","sales_rep"].includes(profile?.role);

  const NAV=[
    {id:"dashboard",lb:"Dashboard",ic:"grid",sec:"Main"},
    {id:"jobs",lb:"Projects",ic:"home",sec:"Main",badge:jobs.filter(j=>!["complete","on_hold"].includes(j.status)).length},
    {id:"calendar",lb:"Calendar",ic:"clip",sec:"Main"},
    ...(isOwnerOrRep?[{id:"pipeline",lb:"Pipeline",ic:"grid",sec:"Sales"},{id:"reports",lb:"Reports",ic:"box",sec:"Sales"}]:[]),
    ...(isStaff?[{id:"subs",lb:"Subs",ic:"home",sec:"People"}]:[]),
    ...(["owner"].includes(profile?.role)?[{id:"team",lb:"Team",ic:"home",sec:"People"}]:[]),
  ];

  return(
    <><div className="app">
      <div className="sidebar">
        <div className="sb-logo" onClick={()=>setPg("dashboard")} style={{cursor:"pointer"}}><img src={L} alt="Avenstone"/></div>

          {NAV.reduce((acc,item,i)=>{if(i===0||item.sec!==NAV[i-1].sec)acc.push({type:"s",lb:item.sec,k:`s${i}`});acc.push(item);return acc;},[]).map(item=>
            item.type==="s"
              ?<div key={item.k} className="sb-sec">{item.lb}</div>
              :<div key={item.id} className={`sb-item${pg===item.id?" on":""}`} onClick={()=>setPg(item.id)}>
                <span style={{width:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{Ic[item.ic]||Ic.grid}</span>

                {item.badge>0&&<span className="sb-badge">{item.badge}</span>}

        </nav>

            <div className="av">{initial}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,color:"#fff",fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{profile?.full_name||"User"}</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.35)"}}>{roleLabel}</div>
            </div>
            <button onClick={e=>{e.stopPropagation();signOut();}} title="Sign out" style={{background:"transparent",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.3)",padding:"4px",display:"flex",alignItems:"center",flexShrink:0,transition:"color 0.15s"}} onMouseEnter={e=>e.currentTarget.style.color="#fff"} onMouseLeave={e=>e.currentTarget.style.color="rgba(255,255,255,0.3)"}>
              <span style={{width:16,height:16,display:"flex"}}>{Ic.logout}</span>
            </button>
          </div>
        </div>
      </div>
      <div className="main">
        <div className="mob-hdr">
          <img src={L} alt="Avenstone" style={{width:44,height:44,objectFit:"contain",cursor:"pointer"}} onClick={()=>setPg("dashboard")}/>
          <div style={{flex:1}}><div style={{fontSize:8,color:"#C9A84C",letterSpacing:4,textTransform:"uppercase"}}>Avenstone Group</div><div style={{fontSize:13,fontWeight:600,color:"#fff",letterSpacing:0.5}}>Field Estimator</div></div>
          <button onClick={()=>setShowNotif(true)} style={{position:"relative",background:"transparent",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.6)",padding:4,display:"flex",alignItems:"center"}}>
            <span style={{width:20,height:20,display:"flex"}}>{Ic.bell}</span>
            {unreadCount>0&&<span style={{position:"absolute",top:0,right:0,background:"#C9A84C",color:"#0A1F44",width:16,height:16,borderRadius:"50%",fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>{unreadCount>9?"9+":unreadCount}</span>}
          </button>
          <button onClick={()=>setShowSettings(true)} title="Profile" style={{width:32,height:32,background:"rgba(255,255,255,0.12)",border:"none",borderRadius:"50%",cursor:"pointer",color:"#fff",fontSize:13,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            {(profile?.full_name||"U")[0].toUpperCase()}
          </button>
        </div>
        <div className="top-bar">
          <div style={{fontSize:13,color:"#9CA3AF"}}><strong style={{color:"#0A1F44"}}>{NAV.find(n=>n.id===pg)?.lb||"Dashboard"}</strong>&nbsp;·&nbsp;{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            {isOwnerOrRep&&<button className="btn btn-navy" onClick={()=>{setPg("jobs");setPendingNew(true);}}>+ New Project</button>}
            <button onClick={()=>setShowNotif(true)} title="Notifications" style={{position:"relative",background:"transparent",border:"1px solid #E8E4DC",color:"#6B7280",width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,transition:"all 0.15s"}} onMouseEnter={e=>e.currentTarget.style.borderColor="#C9A84C"} onMouseLeave={e=>e.currentTarget.style.borderColor="#E8E4DC"}>
              <span style={{width:16,height:16,display:"flex"}}>{Ic.bell}</span>
              {unreadCount>0&&<span style={{position:"absolute",top:-6,right:-6,background:"#C9A84C",color:"#0A1F44",width:18,height:18,borderRadius:"50%",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>{unreadCount>9?"9+":unreadCount}</span>}
            </button>
          </div>
        </div>
        <div className="pg-wrap">
          {pg==="dashboard"&&<Dash nav={setPg} jobs={jobs} profile={profile}/>}
          {pg==="jobs"&&<JobsScr jobs={jobs} setJobs={setJobs} onBack={()=>setPg("dashboard")} pendingJobId={pendingJobId} clearPendingJobId={()=>setPendingJobId(null)} profile={profile} openNew={pendingNew} clearOpenNew={()=>setPendingNew(false)}/>}
          {pg==="intake"&&isOwnerOrRep&&<FormScr title="Project Intake" secs={IQ} rules={IR} ftype="intake" onBack={()=>setPg("dashboard")} onSave={saveJob}/>}
          {pg==="bid"&&isOwnerOrRep&&<FormScr title="Bid and Proposal" secs={BQ} rules={BR} ftype="bid" onBack={()=>setPg("dashboard")}/>}
          {pg==="takeoff"&&isStaff&&<TkOf onBack={()=>setPg("dashboard")}/>}
          {pg==="subs"&&isStaff&&<SubDir profile={profile}/>}
          {pg==="team"&&profile?.role==="owner"&&<UserMgmt/>}
          {pg==="reports"&&isOwnerOrRep&&<Reports jobs={jobs} profile={profile}/>}
          {pg==="calendar"&&isOwnerOrRep&&<CalScr jobs={jobs} profile={profile} onSelectJob={id=>{setPendingJobId(id);setPg("jobs");}}/>}
          {pg==="pipeline"&&isOwnerOrRep&&<div style={{padding:"16px 20px"}}>
            <div style={{marginBottom:16}}><div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:"#0A1F44"}}>Lead Pipeline</div><div style={{fontSize:13,color:"#9CA3AF",marginTop:2}}>Drag jobs between columns to update status</div></div>
            <Pipeline jobs={jobs} onStatusChange={(jid,status)=>{const u=jobs.map(j=>j.id===jid?{...j,status}:j);setJobs(u);ls("av_j",u);sbUpd(jid,{status});}} onOpenJob={j=>{setPg("jobs");setPendingJobId(j.id);}}/>
          </div>}
        </div>
        <div className="bot-nav">
          {[
            {id:"dashboard",ic:"grid",lb:"Home"},
            {id:"jobs",ic:"home",lb:"Projects"},
            ...(isStaff?[{id:"subs",ic:"home",lb:"Subs"}]:[]),
            ...(isOwnerOrRep?[{id:"reports",ic:"box",lb:"Reports"}]:[]),
          ].map(t=>(
            <button key={t.id} className={`bn-item${pg===t.id?" on":""}`} onClick={()=>setPg(t.id)}>
              <span style={{width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",color:pg===t.id?"#C9A84C":"#9CA3AF"}}>{Ic[t.ic]||Ic.grid}</span>
              <span className="bn-lbl" style={{color:pg===t.id?"#C9A84C":"#9CA3AF"}}>{t.lb}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
    {showNotif&&<NotifPanel notifs={notifs} onClose={()=>setShowNotif(false)} onMarkAllRead={markAllNotifsRead} onClickNotif={onClickNotif}/>}
    {showSettings&&<SettingsModal profile={profile} setProfile={setProfile} onClose={()=>setShowSettings(false)}/>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
