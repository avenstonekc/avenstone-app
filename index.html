*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#F7F5F0;font-family:'DM Sans',sans-serif;color:#0A1F44;overscroll-behavior:none}
#root{height:100dvh}
select option{background:#fff;color:#0A1F44}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#F7F5F0}::-webkit-scrollbar-thumb{background:#D1C9B8;border-radius:2px}
.app{display:flex;height:100dvh;overflow:hidden}
/* DESKTOP */
@media(min-width:768px){
  .sidebar{width:240px;background:#0A1F44;flex-shrink:0;display:flex;flex-direction:column}
  .mob-hdr{display:none}
  .top-bar{background:#fff;border-bottom:1px solid #E8E4DC;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .pg-wrap{flex:1;overflow-y:auto;padding:32px}
  .bot-nav{display:none}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .stat-grid{grid-template-columns:repeat(4,1fr)!important}
  .act-grid{grid-template-columns:repeat(4,1fr)!important}
}
/* MOBILE */
@media(max-width:767px){
  .sidebar{display:none}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .top-bar{display:none}
  .mob-hdr{background:#0A1F44;border-bottom:3px solid #C9A84C;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top))}
  .pg-wrap{flex:1;overflow-y:auto;padding:16px}
  .bot-nav{background:#fff;border-top:1px solid #E8E4DC;display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;cursor:pointer;border-top:2px solid transparent;background:transparent;border-left:none;border-right:none;border-bottom:none}
  .bn-item.on{border-top-color:#C9A84C}
  .bn-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:600;font-family:'DM Sans',sans-serif}
  .stat-grid{grid-template-columns:1fr 1fr!important}
  .act-grid{grid-template-columns:1fr 1fr!important}
}
/* SIDEBAR */
.sb-logo{padding:28px 24px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:center}
.sb-logo img{width:90px;height:90px;object-fit:contain}
.sb-nav{padding:16px 0;flex:1}
.sb-sec{font-size:10px;color:rgba(255,255,255,0.25);letter-spacing:2px;text-transform:uppercase;padding:16px 24px 8px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:12px;padding:11px 24px;cursor:pointer;color:rgba(255,255,255,0.45);font-size:13px;font-weight:500;transition:all 0.2s;border-right:3px solid transparent}
.sb-item:hover{color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.04)}
.sb-item.on{color:#fff;background:rgba(201,168,76,0.15);border-right-color:#C9A84C}
.sb-item svg{width:16px;height:16px;flex-shrink:0}
.sb-badge{margin-left:auto;background:rgba(201,168,76,0.2);color:#C9A84C;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
.sb-foot{padding:20px 24px;border-top:1px solid rgba(255,255,255,0.08)}
.av-row{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;background:#C9A84C;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0A1F44;flex-shrink:0}
/* BUTTONS */
.btn{border:none;padding:9px 20px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
.btn-navy{background:#0A1F44;color:#fff}.btn-navy:hover{background:#0f2d5e}
.btn-gold{background:#C9A84C;color:#0A1F44}.btn-gold:hover{background:#d4af5a}
.btn-outline{background:transparent;border:1.5px solid #C9A84C;color:#C9A84C}
.btn-ghost{background:transparent;border:1px solid #E8E4DC;color:#6B7280}.btn-ghost:hover{background:#F7F5F0}
.btn-danger{background:transparent;border:1px solid rgba(239,68,68,0.3);color:#ef4444}
/* CARDS */
.card{background:#fff;border:1px solid #E8E4DC}
/* STATS */
.stat-grid{display:grid;gap:16px;margin-bottom:28px}
.stat{background:#fff;border:1px solid #E8E4DC;padding:22px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#C9A84C,transparent)}
.stat-lbl{font-size:10px;color:#9CA3AF;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;font-weight:600}
.stat-val{font-family:'DM Serif Display',serif;font-size:36px;color:#0A1F44;line-height:1}
.stat-val.gold{color:#C9A84C}
/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10px;color:#9CA3AF;letter-spacing:1.5px;text-transform:uppercase;padding:12px 24px;border-bottom:1px solid #E8E4DC;font-weight:600}
.tbl td{padding:15px 24px;border-bottom:1px solid #F3F0E8;font-size:13px;color:#374151;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#FAFAF7;cursor:pointer}
.cell-a{font-weight:600;color:#0A1F44;font-size:14px}
.cell-b{font-size:11px;color:#9CA3AF;margin-top:3px}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.bdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.tag{background:#F3F0E8;color:#6B7280;padding:3px 10px;font-size:11px;font-weight:500;border-radius:2px}
/* FORMS */
.fg{margin-bottom:18px}
.flbl{font-size:11px;color:#6B7280;text-transform:uppercase;letter-spacing:1px;font-weight:600;display:block;margin-bottom:6px}
.finp{width:100%;background:#fff;border:1.5px solid #E8E4DC;color:#0A1F44;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s;box-sizing:border-box}
.finp:focus{border-color:#C9A84C}
.finp.ok{border-color:rgba(10,31,68,0.2)}
.fta{resize:vertical;line-height:1.7;min-height:100px}
.freq{color:#ef4444;margin-right:4px}
/* JOB CARDS */
.jcard{background:#fff;border:1px solid #E8E4DC;border-left:4px solid;padding:16px;margin-bottom:12px;cursor:pointer;transition:box-shadow 0.15s}
.jcard:hover{box-shadow:0 4px 16px rgba(10,31,68,0.08)}
/* TABS */
.tabbar{display:flex;flex-wrap:wrap;background:#fff;flex-shrink:0;border-bottom:1px solid #E8E4DC}
.tab{flex:0 0 20%;padding:10px 4px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;color:#9CA3AF;letter-spacing:0.5px;text-transform:uppercase;border-bottom:2px solid transparent;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab.on{color:#0A1F44;border-bottom-color:#C9A84C}
.tab svg{width:16px;height:16px}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(10,31,68,0.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:768px){.overlay{align-items:center}}
.modal{background:#fff;border-top:3px solid #C9A84C;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;padding:24px}
@media(min-width:768px){.modal{border:1px solid #E8E4DC;border-top:3px solid #C9A84C}}
.modal-title{font-family:'DM Serif Display',serif;font-size:20px;color:#0A1F44;margin-bottom:20px}
/* MISC */
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sec-hd h2{font-family:'DM Serif Display',serif;font-size:20px;color:#0A1F44}
.empty{text-align:center;padding:48px 24px;color:#9CA3AF}
.empty svg{width:40px;height:40px;opacity:0.3;margin-bottom:12px}
.empty-t{font-family:'DM Serif Display',serif;font-size:18px;color:#374151;margin-bottom:6px}
.filbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:20px}
.fil{background:#fff;border:1px solid #E8E4DC;color:#9CA3AF;padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;letter-spacing:0.5px;text-transform:uppercase;flex-shrink:0;transition:all 0.15s}
.fil.on{background:#0A1F44;border-color:#0A1F44;color:#fff}
.st-opt{width:100%;background:transparent;border:1px solid #E8E4DC;color:#374151;padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;margin-bottom:8px;transition:all 0.15s}
.st-opt:hover{background:#F7F5F0}
.st-opt.on{border-color:#C9A84C;background:rgba(201,168,76,0.05);color:#0A1F44;font-weight:600}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.ii{background:#F7F5F0;padding:12px 14px}
.ii-l{font-size:10px;color:#9CA3AF;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:4px}
.ii-v{font-size:13px;color:#0A1F44;font-weight:500}
.mc-wrap{display:flex;flex-wrap:wrap;gap:8px}
.mc{background:#fff;border:1.5px solid #E8E4DC;color:#6B7280;padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;font-weight:500;transition:all 0.15s}
.mc.on{background:#0A1F44;border-color:#0A1F44;color:#fff;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:768px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pcell{position:relative;padding-bottom:100%;background:#F3F0E8;border:1px solid #E8E4DC;overflow:hidden}
.pcell img,.pcell video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pdel{position:absolute;top:6px;right:6px;background:rgba(239,68,68,0.85);border:none;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px}
.upbar{background:#F7F5F0;border:1px solid #E8E4DC;padding:12px 16px;margin-bottom:12px}
.uptr{background:#E8E4DC;height:4px;border-radius:2px;margin-top:8px}
.upfl{background:#C9A84C;height:4px;border-radius:2px;transition:width 0.3s}
.co-item{background:#FAFAF7;border:1px solid #E8E4DC;border-left:4px solid;padding:16px;margin-bottom:10px}
.co-num{font-size:11px;font-weight:700;color:#C9A84C;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.co-desc{font-size:14px;font-weight:600;color:#0A1F44;margin-bottom:4px}
.co-reason{font-size:12px;color:#9CA3AF}
.note-item{background:#fff;border:1px solid #E8E4DC;border-left:3px solid #C9A84C;padding:14px 16px;margin-bottom:10px}
.cbar{display:flex;background:rgba(255,255,255,0.08);margin-top:10px}
.cc{flex:1;padding:10px 14px;border-right:1px solid rgba(255,255,255,0.1);text-align:center}
.cc:last-child{border-right:none}
.cc-l{font-size:9px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:3px}
.cc-v{font-family:'DM Serif Display',serif;font-size:16px}
/* DOCUMENTS */
.doc-item{background:#fff;border:1px solid #E8E4DC;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.doc-type{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 7px;flex-shrink:0}
.doc-name{font-size:13px;font-weight:600;color:#0A1F44;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta{font-size:11px;color:#9CA3AF;margin-top:2px}
.doc-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
/* AUTH */
.auth-wrap{min-height:100dvh;background:#0A1F44;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:#fff;border-top:4px solid #C9A84C;width:100%;max-width:420px;padding:40px}
.auth-logo{display:flex;justify-content:center;margin-bottom:32px}
.auth-logo img{width:80px;height:80px;object-fit:contain}
.auth-err{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:10px 14px;font-size:13px;margin-bottom:16px}
.auth-link{background:none;border:none;color:#C9A84C;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
.auth-foot{text-align:center;margin-top:20px;font-size:12px;color:#9CA3AF}
.auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#9CA3AF;font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:#E8E4DC}

// ── PHASE SCHEDULE HELPERS ────────────────────────────────────────────────────
const DEFAULT_PHASES=["Demo","Framing","Rough MEP","Insulation","Drywall","Paint","Flooring","Trim","Fixtures","Punch List"];

// Builds a Google Calendar "add event" URL; returns null when dates are missing
const gcalUrl=(ph,addr)=>{
  if(!ph.start_date||!ph.end_date)return null;
  const s=ph.start_date.replace(/-/g,"");
  const ed=new Date(ph.end_date);ed.setDate(ed.getDate()+1);
  const e=ed.toISOString().slice(0,10).replace(/-/g,"");
  return`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ph.phase_name+" \u2014 "+addr)}&dates=${s}/${e}&details=${encodeURIComponent("Avenstone project phase: "+ph.phase_name)}`;
};
const sbLoadPhases=async jid=>{
  const{data}=await window.SB.from("job_phases").select("*").eq("job_id",jid).order("phase_order",{ascending:true});

};
const sbSavePhase=async ph=>{

const sbUploadDoc=async(jid,file,fileType)=>{
  try{
    const ext=file.name.split(".").pop()||"bin";
    const path=`${jid}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const{error:ue}=await window.SB.storage.from("job-documents").upload(path,file,{contentType:file.type,upsert:false});
    if(ue){
      // Bucket may not exist yet — surface error clearly
      console.error("Doc upload error:",ue);
      return{error:ue.message||"Upload failed"};
    }
    const{data:ud}=window.SB.storage.from("job-documents").getPublicUrl(path);
    // Auto-increment version if a doc with same name exists
    const{data:existing}=await window.SB.from("job_documents").select("version").eq("job_id",jid).eq("name",file.name).order("version",{ascending:false}).limit(1);
    const version=(existing&&existing.length?existing[0].version:0)+1;
    const row={job_id:jid,tenant_id:window.AV_TENANT,name:file.name,file_url:ud.publicUrl,file_type:fileType||"other",version,client_visible:false};
    const{data:inserted,error:ie}=await window.SB.from("job_documents").insert(row).select().single();
    if(ie)return{error:ie.message||"Save failed"};
    return{doc:inserted};
  }catch(e){return{error:e.message||"Unknown error"};}
};

const sbDelDoc=async doc=>{
  try{
    const path=doc.file_url?.split("/job-documents/")[1];
    if(path)await window.SB.storage.from("job-documents").remove([path]);
    await window.SB.from("job_documents").delete().eq("id",doc.id);
  }catch(e){console.error(e);}
};

const buildGenericPDF=({docType,job,bodyText,signaturePng})=>{
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"pt",format:"letter"});
  const navy=[10,31,68];const gold=[201,168,76];const gray=[107,114,128];
  const W=612;const M=48;const CW=W-M*2;
  // Header
  doc.setFillColor(...navy);doc.rect(0,0,W,80,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(20);doc.setTextColor(...gold);
  doc.text("AVENSTONE GROUP",M,34);
  doc.setFontSize(9);doc.setFont("helvetica","normal");doc.setTextColor(...gold);
  doc.text(docType,M,50);
  doc.setTextColor(200,200,200);doc.setFontSize(9);
  doc.text("avenstonekc.com  \u00b7  Kansas City, MO",W-M,34,{align:"right"});
  let y=100;
  // Job info
  doc.setFontSize(11);doc.setFont("helvetica","bold");doc.setTextColor(...navy);
  doc.text(job.address||"",M,y);y+=16;
  if(job.client_name){doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(...gray);doc.text(`Client: ${job.client_name}`,M,y);y+=14;}
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(...gray);
  doc.text(`Date: ${new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})}`,M,y);y+=24;
  doc.setDrawColor(...gold);doc.setLineWidth(1.5);doc.line(M,y,W-M,y);y+=20;
  // Body text
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(55,65,81);
  const lines=doc.splitTextToSize(bodyText,CW);
  lines.forEach(line=>{if(y>710){doc.addPage();y=60;}doc.text(line,M,y);y+=13;});
  // Signature image
  if(signaturePng){
    y+=20;
    if(y>660){doc.addPage();y=60;}
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...navy);
    doc.text("Signed:",M,y);y+=8;
    try{doc.addImage(signaturePng,"PNG",M,y,200,60);}catch(e){}
    y+=70;
    doc.setDrawColor(200,200,200);doc.setLineWidth(0.5);doc.line(M,y,M+200,y);
    y+=12;doc.setFontSize(8);doc.setTextColor(...gray);doc.text("Client Signature",M,y);
  }
  // Footer all pages
  const pages=doc.getNumberOfPages();
  const now=new Date().toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    doc.setFillColor(...navy);doc.rect(0,772,W,40,"F");
    doc.setFontSize(8);doc.setTextColor(...gold);doc.setFont("helvetica","bold");
    doc.text("AVENSTONE GROUP LLC",M,788);
    doc.setTextColor(180,180,180);doc.setFont("helvetica","normal");
    doc.text(`Page ${i} of ${pages}`,W/2,788,{align:"center"});
    doc.text(now,W-M,788,{align:"right"});
  }
  return doc;
};

// ─── SIGNATURE PAD ───────────────────────────────────────────────────────────
function SignaturePad({onSave,onCancel,label="Draw your signature below"}){
  const cvs=useRef(null);
  const[drawing,setDrawing]=useState(false);
  const[empty,setEmpty]=useState(true);
  const getXY=(e,el)=>{const r=el.getBoundingClientRect();if(e.touches){return[e.touches[0].clientX-r.left,e.touches[0].clientY-r.top];}return[e.clientX-r.left,e.clientY-r.top];};
  const down=e=>{e.preventDefault();const c=cvs.current;const ctx=c.getContext("2d");const[x,y]=getXY(e,c);ctx.beginPath();ctx.moveTo(x,y);setDrawing(true);setEmpty(false);};
  const move=e=>{if(!drawing)return;e.preventDefault();const c=cvs.current;const ctx=c.getContext("2d");ctx.strokeStyle="#0A1F44";ctx.lineWidth=2;ctx.lineCap="round";ctx.lineJoin="round";const[x,y]=getXY(e,c);ctx.lineTo(x,y);ctx.stroke();};
  const up=e=>{setDrawing(false);};
  const clear=()=>{const c=cvs.current;c.getContext("2d").clearRect(0,0,c.width,c.height);setEmpty(true);};
  const save=()=>{if(empty)return;const png=cvs.current.toDataURL("image/png");onSave(png);};
  return(
    <div style={{background:"#fff",border:"1px solid #E8E4DC",borderRadius:6,padding:16}}>
      <div style={{fontSize:12,fontWeight:600,color:"#0A1F44",marginBottom:8}}>{label}</div>
      <canvas ref={cvs} width={460} height={140}
        style={{display:"block",border:"2px solid #C9A84C",borderRadius:4,cursor:"crosshair",touchAction:"none",maxWidth:"100%",background:"#FAFAF8"}}
        onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up}
        onTouchStart={down} onTouchMove={move} onTouchEnd={up}
      />
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <button className="btn btn-ghost" style={{flex:1}} onClick={clear}>Clear</button>
        {onCancel&&<button className="btn btn-ghost" style={{flex:1}} onClick={onCancel}>Cancel</button>}
        <button className={`btn ${empty?"btn-ghost":"btn-gold"}`} style={{flex:2}} onClick={save} disabled={empty}>Sign & Submit</button>
      </div>
    </div>
  );
}

function ContractModal({job,onClose,onSent}){

  const[sending,setSending]=useState(false);
  const[sent,setSent]=useState(false);
  const[err,setErr]=useState("");
  const send=async()=>{
    if(!clientEmail.trim()){setErr("Client email is required.");return;}
    setSending(true);setErr("");
    // Build PDF with contract text (no signature yet — client will sign)
    const doc=buildGenericPDF({docType:"CONTRACT",job:{...job,client_name:clientName,client_email:clientEmail},bodyText:contractText,signaturePng:null});

    const res=await sbSendContractEmail({...job,client_name:clientName,client_email:clientEmail},"contract",blob);

          </div>
        </div>
      )}

  );

function ClientSignContractModal({job,onClose,onSigned}){

  const[saving,setSaving]=useState(false);
  const contractText=DEFAULT_CONTRACT_TEXT(job);

    setSigPng(png);setSaving(true);
    // Build signed PDF
    const doc=buildGenericPDF({docType:"CONTRACT",job,bodyText:contractText,signaturePng:png});

    // Upload to job-documents — visible to both client and rep

function Fld({q,v,set}){

  return(
    <div className="fg">
      <label className="flbl">{q.req&&<span className="freq">*</span>}{q.lb}</label>
      {q.why&&<div style={{fontSize:11,color:"#9CA3AF",marginBottom:6,fontStyle:"italic"}}>{q.why}</div>}
      {q.t==="text"&&<input className={`finp${filled?" ok":""}`} value={v||""} onChange={e=>set(e.target.value)} placeholder={q.ph}/>}
      {q.t==="sel"&&<select className={`finp${filled?" ok":""}`} style={selStyle} value={v||""} onChange={e=>set(e.target.value)}><option value="">— Select —</option>{q.opts.map(o=><option key={o} value={o}>{o}</option>)}</select>}
      {q.t==="ta"&&<textarea className={`finp fta${filled?" ok":""}`} value={v||""} onChange={e=>set(e.target.value)} placeholder={q.ph}/>}
      {q.t==="mc"&&<div className="mc-wrap">{q.opts.map(o=>{const on=Array.isArray(v)&&v.includes(o);return<button key={o} className={`mc${on?" on":""}`} onClick={()=>{const c=Array.isArray(v)?v:[];set(on?c.filter(x=>x!==o):[...c,o]);}}>{on&&<span style={{marginRight:4}}>✓</span>}{o}</button>;})}</div>}
      {q.t==="jp"&&<select className={`finp${filled?" ok":""}`} style={selStyle} value={v||""} onChange={e=>set(e.target.value)}><option value="">— No job linked —</option>{(window.AV_JOBS||[]).filter(j=>!["complete"].includes(j.status)).map(j=><option key={j.id} value={j.id}>{j.address}{j.client_name?" — "+j.client_name:""}</option>)}</select>}
    </div>
  );
}

function FormScr({title,secs,rules,ftype,onBack,onSave}){
  const[ans,setAns]=useState({});
  const[tab,setTab]=useState(0);
  const[showV,setShowV]=useState(false);
  const[st,setSt]=useState("idle");
  const setA=(id,val)=>setAns(p=>({...p,[id]:val}));
  const tA=secs.reduce((a,s)=>a+s.qs.filter(q=>ans[q.id]&&ans[q.id]!=="").length,0);
  const tQ=secs.reduce((a,s)=>a+s.qs.length,0);
  const pct=Math.round((tA/tQ)*100);
  const errs=rules.filter(r=>r.f(ans));
  const ok=errs.length===0;
  const build=()=>({_meta:{form_type:ftype,exported:new Date().toISOString(),instructions:["Generate a professional Avenstone bid document.","Never mention Claude or AI.","Include: header, scope by trade, pricing table, timeline, payment terms, 1-year warranty, signature block."]},answers:Object.fromEntries(secs.map(s=>[s.id,{label:s.lb,data:Object.fromEntries(s.qs.map(q=>[q.id,ans[q.id]||null]))}]))});
  const submit=async()=>{
    const json=JSON.stringify(build(),null,2);
    setShowV(false);setSt("sub");
    try{
      await navigator.clipboard.writeText(json);
      if(ftype==="intake"&&onSave){onSave({id:Date.now().toString(),address:ans.address||"New Job",status:"lead",created:new Date().toISOString(),scope:ans.scope_type||"",sqft:ans.total_sqft||"",photos:[],activity:[],change_orders:[],client_name:"",client_phone:"",client_email:"",assigned_rep:"",assigned_subs:"",contract_value:0,co_total:0,target_completion:"",ans});}
      if(ftype==="bid"&&ans.linked_job_id){try{const nums=(ans.line_items||"").match(/=\s*\$?([\d,]+)/g)||[];const sum=nums.reduce((a,m)=>a+Number(m.replace(/[^\d]/g,"")),0);if(sum>0){await sbUpd(ans.linked_job_id,{contract_value:sum,status:"bid_sent"});if(window.AV_JOBS)window.AV_JOBS=window.AV_JOBS.map(j=>j.id===ans.linked_job_id?{...j,contract_value:sum,status:"bid_sent"}:j);}}catch(e){}}
      setSt("ok");
    }catch(e){setSt("err");setTimeout(()=>setSt("idle"),3000);}
  };
  const go=()=>{if(!ok){setShowV(true);return;}submit();};
  const sec=secs[tab];
  if(st==="ok")return(
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,textAlign:"center",background:"#F7F5F0"}}>
      <div style={{width:64,height:64,background:"#0A1F44",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px",color:"#C9A84C"}}>{Ic.check}</div>
      <div style={{fontFamily:"'DM Serif Display',serif",fontSize:28,color:"#0A1F44",marginBottom:8}}>Submitted</div>
      <div style={{fontSize:14,color:"#9CA3AF",maxWidth:300,lineHeight:1.8,marginBottom:24}}>{ftype==="intake"?"Job saved to Projects. Intake JSON copied to clipboard.":"Bid JSON copied. Upload to Claude with your floor plan to generate the document."}{ftype==="bid"&&ans.linked_job_id?" Job contract value updated.":""}</div>
      <button className="btn btn-navy" onClick={onBack}>Back to Dashboard</button>
    </div>
  );
  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:"#F7F5F0"}}>
      {ProposalModal}
      <div style={{background:"#fff",borderBottom:"1px solid #E8E4DC",padding:"16px 24px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
        <button style={{background:"transparent",border:"none",cursor:"pointer",color:"#9CA3AF",width:24,height:24,display:"flex",alignItems:"center"}} onClick={onBack}>{Ic.back}</button>
        <div style={{flex:1}}><div style={{fontFamily:"'DM Serif Display',serif",fontSize:18,color:"#0A1F44"}}>{title}</div>{(ans.address||ans.property_address)&&<div style={{fontSize:12,color:"#9CA3AF",marginTop:1}}>{ans.address||ans.property_address}</div>}</div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {!ok&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",color:"#ef4444",fontSize:11,padding:"4px 10px",cursor:"pointer",fontWeight:600}} onClick={()=>setShowV(true)}>{errs.length} issue{errs.length>1?"s":""}</div>}
          <div style={{fontSize:12,color:"#9CA3AF"}}>{pct}%</div>
          <button className={`btn ${ok?"btn-gold":"btn-ghost"}`} onClick={go}>{st==="sub"?"Saving...":ok?"Submit":"Fix Issues"}</button>
        </div>
      </div>
      <div style={{height:2,background:"#E8E4DC",flexShrink:0}}><div style={{height:2,background:"#C9A84C",width:`${pct}%`,transition:"width 0.4s"}}/></div>
      <div style={{display:"flex",overflowX:"auto",background:"#fff",borderBottom:"1px solid #E8E4DC",flexShrink:0}}>
        {secs.map((s,i)=>{const on=tab===i;return<button key={s.id} onClick={()=>setTab(i)} style={{background:on?"#F7F5F0":"transparent",border:"none",borderBottom:`2px solid ${on?"#C9A84C":"transparent"}`,padding:"12px 16px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontSize:11,color:on?"#0A1F44":"#9CA3AF",letterSpacing:0.5,whiteSpace:"nowrap",fontWeight:on?600:400,display:"flex",alignItems:"center",gap:6,textTransform:"uppercase"}}><span style={{width:14,height:14,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,opacity:on?1:0.5}}>{Ic[s.ic]||Ic.clip}</span>{s.lb}</button>;})}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:24}}>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:"#0A1F44",marginBottom:20,paddingBottom:16,borderBottom:"1px solid #E8E4DC"}}>{sec.lb}</div>
        {sec.qs.map(q=><Fld key={q.id} q={q} v={ans[q.id]} set={val=>setA(q.id,val)}/>)}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:16,paddingTop:16,borderTop:"1px solid #E8E4DC"}}>
          <button className="btn btn-ghost" onClick={()=>setTab(Math.max(0,tab-1))} disabled={tab===0} style={{opacity:tab===0?0.3:1}}>← Back</button>
          {tab<secs.length-1?<button className="btn btn-navy" onClick={()=>setTab(tab+1)}>Next →</button>:<button className={`btn ${ok?"btn-gold":"btn-ghost"}`} onClick={go}>{ok?"Submit":"Fix Issues"}</button>}
        </div>
      </div>
      {showV&&<div className="overlay" onClick={()=>setShowV(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-title">Fix before submitting</div>{errs.map((e,i)=><div key={i} style={{background:"#FEF2F2",border:"1px solid #FECACA",padding:"10px 14px",marginBottom:8,fontSize:13,color:"#DC2626",fontWeight:500}}>{e.m}</div>)}<div style={{marginTop:16,textAlign:"right"}}><button className="btn btn-ghost" onClick={()=>setShowV(false)}>Go Back</button></div></div></div>}
    </div>
  );
}

function JobsScr({jobs,setJobs,onBack,pendingJobId,clearPendingJobId,profile,openNew,clearOpenNew}){
  const[sel,setSel]=useState(null);
  const[showNew,setShowNew]=useState(false);
  const[newA,setNewA]=useState("");
  const[fil,setFil]=useState("all");
  const[search,setSearch]=useState("");
  const[loading,setLoading]=useState(false);
  useEffect(()=>{setLoading(true);const repFilter=profile?.role==="sales_rep"?profile.full_name:null;sbLoad(repFilter).then(d=>{if(d){setJobs(d);ls("av_j",d);}setLoading(false);});},[]);
  useEffect(()=>{
    if(pendingJobId&&!loading){setSel(pendingJobId);clearPendingJobId();}
  },[pendingJobId,loading]);
  useEffect(()=>{if(openNew){setShowNew(true);clearOpenNew&&clearOpenNew();}},[openNew]);
  const upd=(id,ch)=>{const u=jobs.map(j=>j.id===id?{...j,...ch}:j);setJobs(u);ls("av_j",u);sbUpd(id,ch);};
  const add=()=>{if(!newA.trim())return;const j={id:Date.now().toString(),address:newA.trim(),status:"lead",created:new Date().toISOString(),scope:"",sqft:"",photos:[],activity:[],change_orders:[],client_name:"",client_phone:"",client_email:"",assigned_rep:"",assigned_subs:"",contract_value:0,co_total:0,target_completion:""};const u=[j,...jobs];setJobs(u);ls("av_j",u);sbSave(j);setNewA("");setShowNew(false);setSel(j.id);};
  const del=id=>{if(!window.confirm("Delete this job?"))return;const u=jobs.filter(j=>j.id!==id);setJobs(u);ls("av_j",u);sbDel(id);setSel(null);};
  const selJ=jobs.find(j=>j.id===sel);
  if(selJ)return<JobDetBoundary back={()=>setSel(null)}><JobDet job={selJ} upd={ch=>upd(selJ.id,ch)} del={()=>del(selJ.id)} back={()=>setSel(null)} profile={profile}/></JobDetBoundary>;
  const q=search.toLowerCase().trim();
  const filtered=(fil==="all"?jobs:jobs.filter(j=>j.status===fil)).filter(j=>!q||(j.address||"").toLowerCase().includes(q)||(j.client_name||"").toLowerCase().includes(q)||(j.assigned_rep||"").toLowerCase().includes(q));
  const mob=isMob();
  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:"#F7F5F0"}}>
      <div style={{background:"#fff",borderBottom:"1px solid #E8E4DC",padding:"16px 24px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
        <button style={{background:"transparent",border:"none",cursor:"pointer",color:"#9CA3AF",width:24,height:24,display:"flex",alignItems:"center"}} onClick={onBack}>{Ic.back}</button>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:"#0A1F44",flex:1}}>Projects</div>
        <div style={{position:"relative",flex:"0 1 220px"}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search projects..." style={{width:"100%",border:"1px solid #E8E4DC",borderRadius:4,padding:"6px 10px 6px 28px",fontSize:12,color:"#374151",outline:"none",boxSizing:"border-box",background:"#F7F5F0"}}/>
          <span style={{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",color:"#9CA3AF",fontSize:13,pointerEvents:"none"}}>⌕</span>
          {search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"transparent",border:"none",color:"#9CA3AF",cursor:"pointer",fontSize:14,lineHeight:1}}>✕</button>}
        </div>
        <span style={{fontSize:12,color:"#9CA3AF",marginRight:8}}>{filtered.length}{search||fil!=="all"?` / ${jobs.length}`:""} jobs</span>
        <button className="btn btn-navy" style={{display:"flex",alignItems:"center",gap:6}} onClick={()=>setShowNew(true)}><span style={{width:14,height:14}}>{Ic.plus}</span>New</button>
      </div>
      <div style={{background:"#fff",borderBottom:"1px solid #E8E4DC",padding:"10px 24px",flexShrink:0}}>
        <div className="filbar">
          <button className={`fil${fil==="all"?" on":""}`} onClick={()=>setFil("all")}>All ({jobs.length})</button>
          {STATS.map(s=>{const cnt=jobs.filter(j=>j.status===s.id).length;if(!cnt)return null;return<button key={s.id} className={`fil${fil===s.id?" on":""}`} onClick={()=>setFil(s.id)}>{s.lb} ({cnt})</button>;})}
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:mob?"12px":"24px"}}>
        {loading&&<div style={{textAlign:"center",padding:"48px",color:"#9CA3AF",fontSize:14}}>Loading projects...</div>}
        {!loading&&!filtered.length&&<div className="empty">{Ic.home}<div className="empty-t">{search?"No matches":"No projects yet"}</div><div>{search?`No projects match "${search}"`:"Tap New to add your first project"}</div></div>}
        {!loading&&filtered.length>0&&!mob&&<div className="card"><table className="tbl"><thead><tr><th>Property</th><th>Status</th><th>Contract</th><th>Rep</th><th>Target</th></tr></thead><tbody>{filtered.map(j=>{const rev=Number(j.contract_value||0)+Number(j.co_total||0);return<tr key={j.id} onClick={()=>setSel(j.id)}><td><div className="cell-a">{j.address}</div>{j.client_name&&<div className="cell-b">{j.client_name}{j.client_phone?" · "+j.client_phone:""}</div>}</td><td><span className="badge" style={{background:sc(j.status)+"15",color:sc(j.status)}}><span className="bdot" style={{background:sc(j.status)}}/>{sl(j.status)}</span></td><td>{rev>0?<span style={{fontWeight:700,color:"#0A1F44"}}>{f$(rev)}</span>:<span style={{color:"#9CA3AF",fontSize:12}}>—</span>}</td><td>{j.assigned_rep?<span className="tag">{j.assigned_rep}</span>:<span style={{color:"#9CA3AF",fontSize:12}}>—</span>}</td><td style={{color:"#9CA3AF",fontSize:12}}>{j.target_completion||"—"}</td></tr>;})}</tbody></table></div>}
        {!loading&&filtered.length>0&&mob&&filtered.map(j=>{const rev=Number(j.contract_value||0)+Number(j.co_total||0);return<div key={j.id} className="jcard" style={{borderLeftColor:sc(j.status)}} onClick={()=>setSel(j.id)}><div style={{fontWeight:600,fontSize:15,color:"#0A1F44",marginBottom:3}}>{j.address}</div>{j.client_name&&<div style={{fontSize:12,color:"#C9A84C",fontWeight:500,marginBottom:10}}>{j.client_name}</div>}<div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}><span className="badge" style={{background:sc(j.status)+"15",color:sc(j.status)}}><span className="bdot" style={{background:sc(j.status)}}/>{sl(j.status)}</span>{rev>0&&<span style={{fontWeight:700,fontSize:14,color:"#0A1F44"}}>{f$(rev)}</span>}{j.photos?.length>0&&<span style={{fontSize:11,color:"#9CA3AF"}}>{j.photos.length} photos</span>}{j.assigned_rep&&<span className="tag">{j.assigned_rep}</span>}</div></div>;})}
      </div>
      {showNew&&<div className="overlay" onClick={()=>setShowNew(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-title">New Project</div><div className="fg"><label className="flbl">Property Address</label><input className="finp" value={newA} onChange={e=>setNewA(e.target.value)} placeholder="123 Main St, Kansas City MO" onKeyDown={e=>e.key==="Enter"&&add()} autoFocus/></div><div style={{display:"flex",gap:10,marginTop:8}}><button className="btn btn-ghost" style={{flex:1}} onClick={()=>setShowNew(false)}>Cancel</button><button className={`btn ${newA.trim()?"btn-navy":"btn-ghost"}`} style={{flex:1}} onClick={add}>Add Project</button></div></div></div>}
    </div>
  );
}

        </div>
        {sent?(
          <div style={{fontSize:12,color:"#22c55e",fontWeight:600}}>✓ Link sent!</div>
        ):(
          <button className="btn btn-ghost" style={{fontSize:11,padding:"6px 14px",flexShrink:0,whiteSpace:"nowrap"}} onClick={send} disabled={sending}>{sending?"Sending...":"Send Client Link"}</button>
        )}
      </div>
      {err&&<div style={{fontSize:11,color:"#ef4444",marginTop:6}}>{err}</div>}
    </div>
  );
}

function StatusLinkButton({token}){
  const[copied,setCopied]=useState(false);
  const url=`https://avenstone-app.vercel.app/?st=${token}`;
  const copy=()=>{
    navigator.clipboard.writeText(url).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);}).catch(()=>{});
  };
  return(
    <div style={{gridColumn:"1/-1",background:"#F7F5F0",border:"1px solid #E8E4DC",padding:"12px 14px",marginTop:4}}>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12,fontWeight:600,color:"#0A1F44"}}>Realtor Status Link</div>
          <div style={{fontSize:11,color:"#9CA3AF",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{url}</div>
        </div>
        <button className="btn btn-ghost" style={{fontSize:11,padding:"6px 14px",flexShrink:0,whiteSpace:"nowrap"}} onClick={copy}>
          {copied?"✓ Copied!":"Copy Link"}
        </button>
      </div>
    </div>
  );
}

function ClientPortal({profile,signOut}){
  const[jobs,setJobs]=useState([]);
  const[loading,setLoading]=useState(true);
  const[sel,setSel]=useState(null);
  const[tab,setTab]=useState("overview");
  const[phases,setPhases]=useState([]);
  const[photos,setPhotos]=useState([]);
  const[docs,setDocs]=useState([]);
  const[payments,setPayments]=useState([]);
  const[msgs,setMsgs]=useState([]);
  const[jobSubs,setJobSubs]=useState([]);
  const[loaded,setLoaded]=useState({phases:false,photos:false,docs:false,payments:false,msgs:false,subs:false});
  const[msgTxt,setMsgTxt]=useState("");
  const[sendingMsg,setSendingMsg]=useState(false);
  const[showSignContract,setShowSignContract]=useState(false);
  const[crForm,setCrForm]=useState({description:"",reason:""});
  const[crSaving,setCrSaving]=useState(false);
  const[crDone,setCrDone]=useState(false);
  const[ratings,setRatings]=useState({});
  const[ratingSaving,setRatingSaving]=useState(false);
  const[ratingDone,setRatingDone]=useState({});
  const[clbIdx,setClbIdx]=useState(null);
  const msgsEndRef=useRef();

  useEffect(()=>{
    if(!profile?.id)return;
    window.SB.from("jobs").select("*").or(`client_user_id.eq.${profile.id},client_email.eq.${profile.email}`).then(({data})=>{setJobs(data||[]);setLoading(false);});
  },[profile?.id]);

  const job=sel?jobs.find(j=>j.id===sel):null;

  useEffect(()=>{
    if(!job)return;
    if(!loaded.phases){sbLoadPhases(job.id).then(d=>{setPhases(d);setLoaded(p=>({...p,phases:true}));});}
    if(!loaded.subs){window.SB.from("job_subs").select("*,profile:profiles(id,full_name,email,trade)").eq("job_id",job.id).then(({data})=>{setJobSubs(data||[]);setLoaded(p=>({...p,subs:true}));});}
  },[job?.id]);

  useEffect(()=>{
    if(!job||tab!=="photos"||loaded.photos)return;
    window.SB.from("photos").select("*").eq("job_id",job.id).order("created_at",{ascending:true}).then(({data})=>{setPhotos(data||[]);setLoaded(p=>({...p,photos:true}));});
  },[job?.id,tab]);

  useEffect(()=>{
    if(!job||tab!=="docs"||loaded.docs)return;
    window.SB.from("job_documents").select("*").eq("job_id",job.id).eq("client_visible",true).order("created_at",{ascending:false}).then(({data})=>{setDocs(data||[]);setLoaded(p=>({...p,docs:true}));});
  },[job?.id,tab]);

  useEffect(()=>{
    if(!job||tab!=="payments"||loaded.payments)return;
    window.SB.from("payments").select("*").eq("job_id",job.id).order("created_at",{ascending:false}).then(({data})=>{setPayments(data||[]);setLoaded(p=>({...p,payments:true}));});
  },[job?.id,tab]);

  useEffect(()=>{
    if(!job||tab!=="msgs"||loaded.msgs)return;
    sbLoadMessages(job.id).then(d=>{setMsgs(d);setLoaded(p=>({...p,msgs:true}));});
  },[job?.id,tab]);

  useEffect(()=>{if(msgs.length&&msgsEndRef.current)msgsEndRef.current.scrollIntoView({behavior:"smooth"});},[msgs]);

  const openJob=(id)=>{setSel(id);setTab("overview");setLoaded({phases:false,photos:false,docs:false,payments:false,msgs:false,subs:false});setPhases([]);setPhotos([]);setDocs([]);setPayments([]);setMsgs([]);setJobSubs([]);setRatings({});setRatingDone({});};

  const sendMsg=async()=>{
    if(!msgTxt.trim()||!job)return;setSendingMsg(true);
    const m=await sbPostMessage(job.id,msgTxt.trim());
    if(m){setMsgs(p=>[...p,m]);sbNotify("job_message",`Client message on ${job.address}`,msgTxt.trim().slice(0,120),job.id,window.AV_USER_ID);setMsgTxt("");}
    setSendingMsg(false);
  };

  const submitRating=async(sub)=>{
    const r=ratings[sub.id];if(!r?.stars)return;
    setRatingSaving(true);
    await sbSubmitRating(sub.id,r.stars,r.comment||"",job.id);
    setRatingDone(p=>({...p,[sub.id]:true}));
    setRatingSaving(false);
  };

  const CLIENT_TABS=[
    {id:"overview",lb:"Overview",ic:"info"},
    {id:"schedule",lb:"Schedule",ic:"sched"},
    {id:"photos",lb:"Photos",ic:"cam"},
    {id:"docs",lb:"Documents",ic:"folder"},
    {id:"payments",lb:"Payments",ic:"doc"},
    {id:"msgs",lb:"Messages",ic:"note"},
    {id:"request",lb:"Change Request",ic:"warn"},
  ];

  if(loading)return <div style={{minHeight:"100dvh",background:"#0A1F44",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{fontSize:11,color:"rgba(255,255,255,0.35)",letterSpacing:3,textTransform:"uppercase"}}>Loading</div></div>;
  if(!jobs.length)return <div style={{minHeight:"100dvh",background:"#F7F5F0",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,padding:24,textAlign:"center"}}><div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#0A1F44"}}>No projects found</div><div style={{fontSize:14,color:"#9CA3AF",maxWidth:320,lineHeight:1.7}}>Your contractor hasn't linked your account to a project yet.</div><button className="btn btn-ghost" style={{marginTop:8}} onClick={signOut}>Sign Out</button></div>;

  return(
    <div style={{minHeight:"100dvh",background:"#F7F5F0"}}>
      <div style={{background:"#0A1F44",padding:"16px 20px",display:"flex",alignItems:"center",gap:12}}>
        <div style={{flex:1}}>
          <div style={{fontSize:9,color:"#C9A84C",letterSpacing:4,textTransform:"uppercase",marginBottom:2}}>Avenstone Group</div>
          {!job?(
            <div style={{fontSize:15,fontWeight:600,color:"#fff"}}>My Projects</div>
          ):(
            <div>
              <button onClick={()=>setSel(null)} style={{background:"transparent",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.5)",fontSize:12,padding:0,marginBottom:2}}>← Back</button>
              <div style={{fontSize:15,fontWeight:600,color:"#fff"}}>{job.address}</div>
            </div>
          )}
        </div>
        <button onClick={signOut} style={{background:"transparent",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.35)",padding:4}}><span style={{width:16,height:16,display:"flex"}}>{Ic.logout}</span></button>
      </div>

      {!job&&<div style={{padding:16}}>
        {jobs.map(j=>(
          <div key={j.id} onClick={()=>openJob(j.id)} style={{background:"#fff",border:"1px solid #E8E4DC",borderLeft:`4px solid ${sc(j.status)}`,padding:16,marginBottom:10,cursor:"pointer"}}>
            <div style={{fontSize:15,fontWeight:600,color:"#0A1F44",marginBottom:6}}>{j.address}</div>
            <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{fontSize:10,background:sc(j.status)+"18",color:sc(j.status),padding:"3px 10px",fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>{sl(j.status)}</span>
              {j.target_completion&&<span style={{fontSize:12,color:"#9CA3AF"}}>Target: {j.target_completion}</span>}
              {Number(j.contract_value||0)>0&&<span style={{fontSize:12,fontWeight:600,color:"#0A1F44"}}>{f$(Number(j.contract_value||0))}</span>}
            </div>
          </div>
        ))}
      </div>}

      {job&&<>
        {!job.contract_signed&&<div style={{background:"#FEF9EC",borderBottom:"2px solid #C9A84C",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
          <div style={{fontSize:13,color:"#92400e",fontWeight:600}}>Your contract is ready to sign</div>
          <button className="btn btn-gold" style={{fontSize:12,padding:"7px 16px",flexShrink:0}} onClick={()=>setShowSignContract(true)}>Sign Now</button>
        </div>}
        {job.contract_signed&&<div style={{background:"#F0FDF4",borderBottom:"1px solid #BBF7D0",padding:"8px 16px",fontSize:12,color:"#16a34a",fontWeight:600}}>✓ Contract signed{job.contract_signed_at?` ${fD(job.contract_signed_at.slice(0,10))}`:""}</div>}
        <div className="tabbar" style={{overflowX:"auto",flexWrap:"nowrap"}}>{CLIENT_TABS.map(t=><button key={t.id} className={`tab${tab===t.id?" on":""}`} onClick={()=>setTab(t.id)} style={{whiteSpace:"nowrap"}}><span style={{width:16,height:16,display:"flex",alignItems:"center",justifyContent:"center"}}>{Ic[t.ic]||Ic.info}</span>{t.lb}</button>)}</div>
        <div style={{padding:16,maxWidth:720,margin:"0 auto"}}>

          {tab==="overview"&&<>
            <div style={{background:"#fff",border:"1px solid #E8E4DC",padding:20,marginBottom:16}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:12,marginBottom:loaded.phases&&phases.length?16:0}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>Current Status</div>
                  <span style={{fontSize:13,background:sc(job.status)+"18",color:sc(job.status),padding:"4px 14px",fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>{sl(job.status)}</span>
                </div>
                {job.target_completion&&<div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:11,color:"#9CA3AF",marginBottom:2}}>Target Completion</div>
                  <div style={{fontSize:13,fontWeight:600,color:"#0A1F44"}}>{job.target_completion}</div>
                </div>}
              </div>
              {loaded.phases&&phases.length>0&&(()=>{
                const done=phases.filter(p=>p.status==="complete").length;
                const pct=Math.round((done/phases.length)*100);
                const current=phases.find(p=>p.status==="in_progress")||phases.find(p=>p.status==="pending");
                return(
                  <div>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#9CA3AF",marginBottom:5}}>
                      <span>{current?`Currently: ${current.phase_name}`:`${done} of ${phases.length} phases done`}</span>
                      <span style={{fontWeight:700,color:pct===100?"#22c55e":"#0A1F44"}}>{pct}%</span>
                    </div>
                    <div style={{background:"#F3F0EB",height:10,borderRadius:5}}><div style={{background:pct===100?"#22c55e":"#C9A84C",height:10,borderRadius:5,width:`${pct}%`,transition:"width 0.4s"}}/></div>
                  </div>
                );
              })()}
            </div>

            {Number(job.contract_value||0)>0&&<div style={{background:"#fff",border:"1px solid #E8E4DC",padding:20,marginBottom:16}}>
              <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:14}}>Your Investment</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:12}}>
                <div><div style={{fontSize:11,color:"#9CA3AF",marginBottom:3}}>Contract Value</div><div style={{fontSize:17,fontWeight:700,color:"#0A1F44",fontFamily:"'DM Serif Display',serif"}}>{f$(Number(job.contract_value||0))}</div></div>
                {Number(job.co_total||0)>0&&<div><div style={{fontSize:11,color:"#9CA3AF",marginBottom:3}}>Approved Changes</div><div style={{fontSize:17,fontWeight:700,color:"#f59e0b",fontFamily:"'DM Serif Display',serif"}}>+{f$(Number(job.co_total||0))}</div></div>}
                <div><div style={{fontSize:11,color:"#9CA3AF",marginBottom:3}}>Total</div><div style={{fontSize:17,fontWeight:700,color:"#0A1F44",fontFamily:"'DM Serif Display',serif"}}>{f$(Number(job.contract_value||0)+Number(job.co_total||0))}</div></div>
              </div>
            </div>}

            {["complete","punch"].includes(job.status)&&loaded.subs&&jobSubs.length>0&&<div style={{background:"#fff",border:"1px solid #E8E4DC",padding:20,marginBottom:16}}>
              <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Rate Our Team</div>
              <div style={{fontSize:13,color:"#6B7280",marginBottom:16,lineHeight:1.6}}>Your feedback helps us keep standards high and rewards our best crew.</div>
              {jobSubs.map(js=>{
                const sub=js.profile||{};
                const r=ratings[sub.id]||{stars:0,comment:""};
                const done=ratingDone[sub.id];
                return(
                  <div key={js.id} style={{borderTop:"1px solid #F3F0EB",paddingTop:14,marginTop:14}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                      <div style={{width:36,height:36,background:"#0A1F4418",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:"#0A1F44",flexShrink:0}}>{(sub.full_name||"?")[0].toUpperCase()}</div>
                      <div><div style={{fontSize:13,fontWeight:600,color:"#0A1F44"}}>{sub.full_name||sub.email}</div>{sub.trade&&<div style={{fontSize:11,color:"#9CA3AF"}}>{sub.trade}</div>}</div>
                    </div>
                    {done?<div style={{fontSize:12,color:"#22c55e",fontWeight:600}}>✓ Review submitted — thank you!</div>:(
                      <>
                        <div style={{display:"flex",gap:2,marginBottom:10}}>{[1,2,3,4,5].map(s=><button key={s} onClick={()=>setRatings(p=>({...p,[sub.id]:{...r,stars:s}}))} style={{background:"none",border:"none",cursor:"pointer",fontSize:26,color:r.stars>=s?"#C9A84C":"#E8E4DC",padding:0,lineHeight:1}}>★</button>)}</div>
                        <textarea className="finp fta" rows={2} value={r.comment||""} onChange={e=>setRatings(p=>({...p,[sub.id]:{...r,comment:e.target.value}}))} placeholder="Optional comment..."/>
                        <button className={`btn ${r.stars?"btn-gold":"btn-ghost"}`} style={{marginTop:8,width:"100%"}} disabled={!r.stars||ratingSaving} onClick={()=>submitRating(sub)}>{ratingSaving?"Saving...":"Submit Review"}</button>
                      </>
                    )}
                  </div>
                );
              })}
            </div>}
          </>}

          {tab==="schedule"&&<ClientScheduleView jobId={job.id}/>}

          {tab==="photos"&&<div>
            {!loaded.photos&&<div style={{textAlign:"center",padding:32,color:"#9CA3AF"}}>Loading...</div>}
            {loaded.photos&&!photos.length&&<div className="empty">{Ic.cam}<div className="empty-t">No photos yet</div><div>Your contractor will upload progress photos here</div></div>}
            <div className="pgrid">{photos.map((p,i)=><div key={p.id} className="pcell" onClick={()=>setClbIdx(i)} style={{cursor:"pointer"}}><div style={{position:"absolute",inset:0}}><img src={p.url||p.data} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></div></div>)}</div>
            {clbIdx!==null&&<PhotoLightbox photos={photos} startIdx={clbIdx} onClose={()=>setClbIdx(null)}/>}
          </div>}

          {tab==="docs"&&<div>
            {!loaded.docs&&<div style={{textAlign:"center",padding:32,color:"#9CA3AF"}}>Loading...</div>}
            {loaded.docs&&!docs.length&&<div className="empty">{Ic.folder}<div className="empty-t">No documents yet</div><div>Signed contracts and shared documents will appear here</div></div>}
            {docs.map(d=>(
              <div key={d.id} style={{background:"#fff",border:"1px solid #E8E4DC",padding:"12px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:12}}>
                <div style={{width:36,height:36,background:"#0A1F4412",borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{width:18,height:18,color:"#0A1F44"}}>{Ic.doc}</span></div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:"#0A1F44",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</div>
                  <div style={{fontSize:11,color:"#9CA3AF",marginTop:2}}>{d.file_type}{d.created_at?` · ${fD(d.created_at.slice(0,10))}`:""}</div>
                </div>
                {d.file_url&&<a href={d.file_url} target="_blank" rel="noreferrer" style={{color:"#C9A84C",fontWeight:600,fontSize:12,textDecoration:"none",flexShrink:0}}>View →</a>}
              </div>
            ))}
          </div>}

          {tab==="payments"&&<div>
            {!loaded.payments&&<div style={{textAlign:"center",padding:32,color:"#9CA3AF"}}>Loading...</div>}
            {loaded.payments&&!payments.length&&<div className="empty">{Ic.doc}<div className="empty-t">No payment requests yet</div><div>Payment requests from your contractor will appear here</div></div>}
            {payments.map(p=>(
              <div key={p.id} style={{background:"#fff",border:"1px solid #E8E4DC",padding:16,marginBottom:10}}>
                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:p.status==="pending"&&p.stripe_checkout_url?12:0}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,fontWeight:700,color:"#0A1F44",marginBottom:3}}>{p.description}</div>
                    <div style={{fontSize:12,color:"#9CA3AF"}}>{p.payment_type}{p.created_at?` · ${fD(p.created_at.slice(0,10))}`:""}
                      {p.paid_at&&<span style={{color:"#22c55e"}}> · Paid {fD(p.paid_at.slice(0,10))}</span>}
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:"#0A1F44"}}>{f$(Number(p.amount))}</div>
                    <span style={{fontSize:11,fontWeight:600,padding:"2px 8px",borderRadius:12,background:p.status==="paid"?"#D1FAE5":"#FEF9EC",color:p.status==="paid"?"#065F46":"#92400E",textTransform:"uppercase"}}>{p.status}</span>
                  </div>
                </div>
                {p.status==="pending"&&(p.stripe_checkout_url
                  ?<a href={p.stripe_checkout_url} target="_blank" rel="noreferrer" style={{display:"block",background:"#0A1F44",color:"#C9A84C",padding:12,textAlign:"center",fontWeight:700,fontSize:14,textDecoration:"none",borderRadius:4}}>Pay Now →</a>
                  :<div style={{background:"#F7F5F0",border:"1px solid #E8E4DC",padding:"10px 14px",fontSize:12,color:"#6B7280",textAlign:"center"}}>Payment link sent to your email — check your inbox to pay securely.</div>
                )}
              </div>
            ))}
          </div>}

          {tab==="msgs"&&<div style={{display:"flex",flexDirection:"column",minHeight:400}}>
            {!loaded.msgs&&<div style={{textAlign:"center",padding:32,color:"#9CA3AF"}}>Loading...</div>}
            {loaded.msgs&&<>
              <div style={{flex:1,overflowY:"auto",paddingBottom:8}}>
                {!msgs.length&&<div className="empty">{Ic.note}<div className="empty-t">No messages yet</div><div>Send your contractor a message below</div></div>}
                {msgs.map(m=>{
                  const mine=m.sender_id===window.AV_USER_ID;
                  const nm=m.sender?.full_name||"Contractor";
                  return(
                    <div key={m.id} style={{display:"flex",flexDirection:"column",alignItems:mine?"flex-end":"flex-start",marginBottom:12}}>
                      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4}}>
                        <span style={{fontSize:11,color:"#9CA3AF",fontWeight:600}}>{mine?"You":nm}</span>
                        <span style={{fontSize:10,color:"#D1C9B8"}}>{fDT(m.created_at)}</span>
                      </div>
                      <div style={{maxWidth:"80%",background:mine?"#0A1F44":"#fff",color:mine?"#fff":"#374151",padding:"10px 14px",borderRadius:mine?"12px 12px 2px 12px":"12px 12px 12px 2px",fontSize:13,lineHeight:1.55,border:mine?"none":"1px solid #E8E4DC"}}>{m.content}</div>
                    </div>
                  );
                })}
                <div ref={msgsEndRef}/>
              </div>
              <div style={{borderTop:"1px solid #E8E4DC",paddingTop:12}}>
                <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
                  <textarea className="finp fta" value={msgTxt} onChange={e=>setMsgTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}}} placeholder="Message your contractor… (Enter to send)" rows={2} style={{flex:1,marginBottom:0,resize:"none"}}/>
                  <button className={`btn ${msgTxt.trim()?"btn-navy":"btn-ghost"}`} style={{padding:"10px 16px",flexShrink:0}} onClick={sendMsg} disabled={sendingMsg||!msgTxt.trim()}>{sendingMsg?"...":"Send"}</button>
                </div>
              </div>
            </>}
          </div>}

          {tab==="request"&&<div style={{maxWidth:500}}>
            <div style={{fontSize:11,fontWeight:600,color:"#9CA3AF",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Request a Change</div>
            <div style={{fontSize:13,color:"#6B7280",marginBottom:16,lineHeight:1.6}}>Submit a change request and your contractor will review it. Approved requests become official change orders.</div>
            {crDone?<div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",color:"#16a34a",padding:"14px 16px",borderRadius:4,fontSize:14,fontWeight:600,textAlign:"center",marginBottom:12}}>
              ✓ Submitted! Your contractor will review it shortly.
              <div style={{marginTop:10}}><button className="btn btn-ghost" style={{width:"100%"}} onClick={()=>{setCrDone(false);setCrForm({description:"",reason:""});}}>Submit Another</button></div>
            </div>:<>
              <div className="fg"><label className="flbl"><span className="freq">*</span>What change are you requesting?</label><textarea className="finp fta" rows={3} value={crForm.description} onChange={e=>setCrForm(p=>({...p,description:e.target.value}))} placeholder="e.g. Add a walk-in closet to master bedroom, upgrade countertops to quartz..."/></div>

const sbSubmitRating=async(subId,stars,comment,jobId)=>{
  const{data,error}=await window.SB.from("sub_ratings").upsert({tenant_id:window.AV_TENANT,sub_id:subId,rater_id:window.AV_USER_ID,job_id:jobId||null,stars,comment:comment||null},{onConflict:"tenant_id,sub_id,rater_id,job_id"}).select().single();

function StarRating({value=0,onChange,readonly=false,size=18}){
  const[hover,setHover]=useState(0);
  return(
    <div style={{display:"flex",gap:1}}>
      {[1,2,3,4,5].map(s=>(
        <span key={s} style={{fontSize:size,cursor:readonly?"default":"pointer",color:(hover||value)>=s?"#C9A84C":"#D1D5DB",lineHeight:1,userSelect:"none"}}
          onClick={()=>!readonly&&onChange&&onChange(s)}
          onMouseEnter={()=>!readonly&&setHover(s)}
          onMouseLeave={()=>!readonly&&setHover(0)}>★</span>
      ))}
    </div>
  );
}

function PhotoLightbox({photos,startIdx,onClose}){
  const[idx,setIdx]=useState(startIdx||0);
  const p=photos[idx];
  useEffect(()=>{
    const onKey=e=>{if(e.key==="ArrowRight")setIdx(i=>Math.min(i+1,photos.length-1));else if(e.key==="ArrowLeft")setIdx(i=>Math.max(i-1,0));else if(e.key==="Escape")onClose();};
    window.addEventListener("keydown",onKey);return()=>window.removeEventListener("keydown",onKey);
  },[photos.length,onClose]);
  if(!p)return null;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:9999,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}} onClick={onClose}>
      <button onClick={onClose} style={{position:"absolute",top:16,right:20,background:"transparent",border:"none",color:"#fff",fontSize:28,cursor:"pointer",lineHeight:1}}>✕</button>
      <div style={{position:"absolute",top:16,left:20,color:"rgba(255,255,255,0.5)",fontSize:13}}>{idx+1} / {photos.length}</div>
      <div style={{maxWidth:"90vw",maxHeight:"80vh",display:"flex",alignItems:"center",justifyContent:"center"}} onClick={e=>e.stopPropagation()}>
        {p.type==="video"
          ?<video src={p.url||p.data} controls style={{maxWidth:"90vw",maxHeight:"80vh",borderRadius:4}}/>
          :<img src={p.url||p.data} alt="" style={{maxWidth:"90vw",maxHeight:"80vh",objectFit:"contain",borderRadius:4}}/>}
      </div>
      {photos.length>1&&<>
        <button onClick={e=>{e.stopPropagation();setIdx(i=>Math.max(i-1,0));}} disabled={idx===0} style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",background:"rgba(255,255,255,0.12)",border:"none",color:"#fff",width:40,height:40,borderRadius:"50%",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",opacity:idx===0?0.3:1}}>‹</button>
        <button onClick={e=>{e.stopPropagation();setIdx(i=>Math.min(i+1,photos.length-1));}} disabled={idx===photos.length-1} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"rgba(255,255,255,0.12)",border:"none",color:"#fff",width:40,height:40,borderRadius:"50%",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",opacity:idx===photos.length-1?0.3:1}}>›</button>
        <div style={{position:"absolute",bottom:20,display:"flex",gap:6}}>
          {photos.map((_,i)=><div key={i} onClick={e=>{e.stopPropagation();setIdx(i);}} style={{width:i===idx?20:6,height:6,borderRadius:3,background:i===idx?"#C9A84C":"rgba(255,255,255,0.3)",cursor:"pointer",transition:"all 0.2s"}}/>)}
        </div>
      </>}
    </div>
  );
}

function SubJobView({job,back,profile}){
  const[tab,setTab]=useState("info");
  const[msgs,setMsgs]=useState([]);
  const[msgsLoaded,setMsgsLoaded]=useState(false);
  const[msgTxt,setMsgTxt]=useState("");
  const[sendingMsg,setSendingMsg]=useState(false);
  const[photos,setPhotos]=useState(job.photos||[]);
  const[upl,setUpl]=useState(false);
  const[uplPct,setUplPct]=useState(0);
  const pr=useRef();
  const msgsEndRef=useRef();
  const[logs,setLogs]=useState([]);
  const[logsLoaded,setLogsLoaded]=useState(false);
  const[showLogForm,setShowLogForm]=useState(false);
  const[logForm,setLogForm]=useState({log_date:new Date().toISOString().slice(0,10),weather:"Clear",crew_count:"",hours_worked:"",work_completed:"",materials_used:"",issues:""});
  const[logSaving,setLogSaving]=useState(false);
  const SUB_TABS=[{id:"info",lb:"Info",ic:"info"},{id:"photos",lb:"Photos",ic:"cam"},{id:"logs",lb:"Daily Log",ic:"clip"},{id:"msgs",lb:"Messages",ic:"note"}];
  useEffect(()=>{
    if(tab!=="msgs"||msgsLoaded)return;
    sbLoadMessages(job.id).then(d=>{setMsgs(d);setMsgsLoaded(true);});
  },[tab,msgsLoaded]);
  useEffect(()=>{
    if(tab!=="logs"||logsLoaded)return;
    sbLoadDailyLogs(job.id).then(d=>{setLogs(d);setLogsLoaded(true);});
  },[tab,logsLoaded]);
  const submitLog=async()=>{
    setLogSaving(true);
    const d=await sbSubmitDailyLog({job_id:job.id,log_date:logForm.log_date,weather:logForm.weather,crew_count:logForm.crew_count?Number(logForm.crew_count):null,hours_worked:logForm.hours_worked?Number(logForm.hours_worked):null,work_completed:logForm.work_completed||null,materials_used:logForm.materials_used||null,issues:logForm.issues||null});
    if(d){setLogs(p=>[d,...p]);sbNotify("daily_log_submitted",`Daily log — ${job.address}`,`${logForm.log_date}: ${(logForm.work_completed||"").slice(0,80)}`,job.id,window.AV_USER_ID);setShowLogForm(false);setLogForm({log_date:new Date().toISOString().slice(0,10),weather:"Clear",crew_count:"",hours_worked:"",work_completed:"",materials_used:"",issues:""});}
    setLogSaving(false);
  };
  useEffect(()=>{if(msgs.length&&msgsEndRef.current)msgsEndRef.current.scrollIntoView({behavior:"smooth"});},[msgs]);
  const sendMsg=async()=>{
    if(!msgTxt.trim())return;setSendingMsg(true);
    const m=await sbPostMessage(job.id,msgTxt.trim());
    if(m){setMsgs(p=>[...p,m]);sbNotify("job_message",`Message on ${job.address}`,msgTxt.trim().slice(0,120),job.id,window.AV_USER_ID);setMsgTxt("");}
    setSendingMsg(false);
  };
  const onFile=async e=>{
    const files=Array.from(e.target.files);if(!files.length)return;
    setUpl(true);setUplPct(0);const res=[];
    for(let i=0;i<files.length;i++){const p=await sbPhoto(job.id,files[i]);if(p)res.push(p);setUplPct(Math.round(((i+1)/files.length)*100));}
    if(res.length)setPhotos(p=>[...p,...res]);
    setUpl(false);setUplPct(0);
  };
  return(
    <div style={{minHeight:"100dvh",background:"#F7F5F0",display:"flex",flexDirection:"column"}}>
      <div style={{background:"#0A1F44",padding:"16px 20px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button onClick={back} style={{background:"transparent",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.6)",width:24,height:24,display:"flex",alignItems:"center"}}>{Ic.back}</button>
          <div><div style={{fontSize:9,color:"rgba(255,255,255,0.4)",letterSpacing:2,textTransform:"uppercase",marginBottom:2}}>Project</div><div style={{fontSize:15,fontWeight:600,color:"#fff"}}>{job.address}</div></div>
        </div>
      </div>
      <div className="tabbar">{SUB_TABS.map(t=><button key={t.id} className={`tab${tab===t.id?" on":""}`} onClick={()=>setTab(t.id)}><span style={{width:16,height:16,display:"flex",alignItems:"center",justifyContent:"center"}}>{Ic[t.ic]||Ic.info}</span>{t.lb}</button>)}</div>
      <div style={{flex:1,overflowY:"auto",padding:16}}>
        {tab==="info"&&<div className="ig">
          {[["Address",job.address],["Status",sl(job.status)],["Client",job.client_name],["Started",fD(job.created)]].filter(([,v])=>v).map(([lb,v])=><div className="ii" key={lb}><div className="ii-l">{lb}</div><div className="ii-v">{v}</div></div>)}
        </div>}
        {tab==="photos"&&<div>
          <div style={{marginBottom:16}}>
            <input ref={pr} type="file" accept="image/*,video/*" multiple onChange={onFile} style={{display:"none"}}/>
            <button className="btn btn-outline" style={{width:"100%",padding:12,display:"flex",alignItems:"center",justifyContent:"center",gap:8}} onClick={()=>pr.current.click()} disabled={upl}><span style={{width:16,height:16}}>{Ic.cam}</span>Upload Photos / Video</button>
          </div>
          {upl&&<div className="upbar"><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:11,color:"#6B7280",fontWeight:600,textTransform:"uppercase",letterSpacing:1}}>Uploading</span><span style={{fontSize:11,color:"#C9A84C",fontWeight:700}}>{uplPct}%</span></div><div className="uptr"><div className="upfl" style={{width:`${uplPct}%`}}/></div></div>}
          {!photos.length&&!upl&&<div className="empty">{Ic.cam}<div className="empty-t">No photos yet</div><div>Upload site photos above</div></div>}
          <div className="pgrid">{photos.map(p=><div key={p.id} className="pcell"><div style={{position:"absolute",inset:0}}>{p.type==="video"?<video src={p.url||p.data} controls style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<img src={p.url||p.data} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>}</div></div>)}</div>
        </div>}
        {tab==="msgs"&&<div style={{display:"flex",flexDirection:"column",minHeight:300}}>
          {!msgsLoaded&&<div style={{textAlign:"center",padding:32,color:"#9CA3AF",fontSize:13}}>Loading...</div>}
          {msgsLoaded&&<>
            <div style={{flex:1,overflowY:"auto",paddingBottom:8}}>
              {!msgs.length&&<div className="empty">{Ic.note}<div className="empty-t">No messages yet</div><div>Send a message to your contractor below</div></div>}
              {msgs.map(m=>{
                const mine=m.sender_id===window.AV_USER_ID;
                const nm=m.sender?.full_name||"Contractor";
                return(
                  <div key={m.id} style={{display:"flex",flexDirection:"column",alignItems:mine?"flex-end":"flex-start",marginBottom:12}}>
                    <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4}}>
                      <span style={{fontSize:11,color:"#9CA3AF",fontWeight:600}}>{mine?"You":nm}</span>
                      <span style={{fontSize:10,color:"#D1C9B8"}}>{fDT(m.created_at)}</span>
                    </div>
                    <div style={{maxWidth:"80%",background:mine?"#0A1F44":"#fff",color:mine?"#fff":"#374151",padding:"10px 14px",borderRadius:mine?"12px 12px 2px 12px":"12px 12px 12px 2px",fontSize:13,lineHeight:1.55,border:mine?"none":"1px solid #E8E4DC"}}>{m.content}</div>
                  </div>
                );
              })}
              <div ref={msgsEndRef}/>
            </div>
            <div style={{borderTop:"1px solid #E8E4DC",paddingTop:12,background:"#F7F5F0"}}>
              <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
                <textarea className="finp fta" value={msgTxt} onChange={e=>setMsgTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}}} placeholder="Type a message… (Enter to send)" rows={2} style={{flex:1,marginBottom:0,resize:"none"}}/>
                <button className={`btn ${msgTxt.trim()?"btn-navy":"btn-ghost"}`} style={{padding:"10px 16px",flexShrink:0}} onClick={sendMsg} disabled={sendingMsg||!msgTxt.trim()}>{sendingMsg?"...":"Send"}</button>
              </div>
            </div>
          </>}
        </div>}
      </div>
    </div>
  );
}

  // Gold divider

  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(55,65,81);

  lines.forEach(line=>{
    if(y>730){doc.addPage();y=48;}

  });
  // Footer
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    doc.setFillColor(...navy);doc.rect(0,772,W,40,"F");
    doc.setFontSize(8);doc.setTextColor(...gold);doc.setFont("helvetica","bold");

    doc.setTextColor(180,180,180);doc.setFont("helvetica","normal");
    doc.text(`Page ${i} of ${pages}`,W/2,788,{align:"center"});
    doc.text(new Date().toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}),W-M,788,{align:"right"});
  }
  return doc;
};

// ─── CALENDAR ────────────────────────────────────────────────────────────────
function CalScr({jobs,profile,onSelectJob}){
  const[view,setView]=useState("month");
  const[cur,setCur]=useState(()=>{const d=new Date();d.setDate(1);return d;});
  const[phases,setPhases]=useState([]);
  const[loading,setLoading]=useState(true);
  const[filter,setFilter]=useState("all");

  useEffect(()=>{
    if(!jobs.length){setLoading(false);return;}
    window.SB.from("job_phases").select("*").in("job_id",jobs.map(j=>j.id)).then(({data})=>{setPhases(data||[]);setLoading(false);});
  },[]);

  const prevMonth=()=>setCur(d=>new Date(d.getFullYear(),d.getMonth()-1,1));
  const nextMonth=()=>setCur(d=>new Date(d.getFullYear(),d.getMonth()+1,1));
  const toStr=d=>d.toISOString().split("T")[0];
  const today=toStr(new Date());
  const SC={lead:"#9CA3AF",active:"#C9A84C",complete:"#10B981",punch:"#3B82F6",cancelled:"#EF4444",on_hold:"#F97316"};
  const filtJobs=filter==="all"?jobs:jobs.filter(j=>j.status===filter);

  const year=cur.getFullYear(),month=cur.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const prevDays=new Date(year,month,0).getDate();
  const days=[];
  for(let i=firstDay-1;i>=0;i--)days.push({date:new Date(year,month-1,prevDays-i),in:false});
  for(let d=1;d<=daysInMonth;d++)days.push({date:new Date(year,month,d),in:true});
  while(days.length<42)days.push({date:new Date(year,month+1,days.length-firstDay-daysInMonth+1),in:false});

  const jobsForDay=date=>{const ds=toStr(date);return filtJobs.filter(j=>j.target_completion===ds);};
  const phasesForDay=date=>{
    const ds=toStr(date);
    return phases.filter(ph=>{
      if(!ph.start_date||!ph.end_date)return false;
      const job=jobs.find(j=>j.id===ph.job_id);
      if(!job)return false;
      if(filter!=="all"&&job.status!==filter)return false;
      return ph.start_date<=ds&&ph.end_date>=ds;
    });
  };

  const upcoming=()=>{
    const evs=[],now=new Date(),cut=new Date();cut.setDate(cut.getDate()+90);
    filtJobs.forEach(j=>{
      if(j.target_completion){const d=new Date(j.target_completion+"T12:00:00");if(d>=now&&d<=cut)evs.push({type:"completion",date:d,job:j});}
    });
    phases.forEach(ph=>{
      const job=jobs.find(j=>j.id===ph.job_id);if(!job)return;
      if(filter!=="all"&&job.status!==filter)return;
      if(ph.start_date){const d=new Date(ph.start_date+"T12:00:00");if(d>=now&&d<=cut)evs.push({type:"start",date:d,job,ph});}
      if(ph.end_date){const d=new Date(ph.end_date+"T12:00:00");if(d>=now&&d<=cut)evs.push({type:"end",date:d,job,ph});}
    });
    return evs.sort((a,b)=>a.date-b.date);
  };

  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  return(
    <div style={{padding:"0 0 40px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button onClick={prevMonth} style={{background:"transparent",border:"1px solid #E8E4DC",borderRadius:4,width:32,height:32,cursor:"pointer",fontSize:18,color:"#6B7280",display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#0A1F44",minWidth:200,textAlign:"center"}}>{MONTHS[month]} {year}</div>
          <button onClick={nextMonth} style={{background:"transparent",border:"1px solid #E8E4DC",borderRadius:4,width:32,height:32,cursor:"pointer",fontSize:18,color:"#6B7280",display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
          <button onClick={()=>setCur(()=>{const d=new Date();d.setDate(1);return d;})} style={{fontSize:11,padding:"4px 10px",border:"1px solid #E8E4DC",borderRadius:4,background:"transparent",color:"#9CA3AF",cursor:"pointer"}}>Today</button>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <select value={filter} onChange={e=>setFilter(e.target.value)} style={{fontSize:12,padding:"6px 10px",border:"1px solid #E8E4DC",borderRadius:4,background:"#fff",color:"#374151"}}>
            <option value="all">All Projects</option>
            <option value="lead">Leads</option>
            <option value="active">Active</option>
            <option value="punch">Punch List</option>
            <option value="complete">Complete</option>
          </select>
          <div style={{display:"flex",border:"1px solid #E8E4DC",borderRadius:4,overflow:"hidden"}}>
            {[["month","Month"],["list","List"]].map(([v,lb])=>(
              <button key={v} onClick={()=>setView(v)} style={{padding:"6px 14px",fontSize:12,fontWeight:600,cursor:"pointer",border:"none",background:v===view?"#0A1F44":"transparent",color:v===view?"#C9A84C":"#9CA3AF"}}>{lb}</button>
            ))}
          </div>
        </div>
      </div>

      {loading?<div style={{textAlign:"center",padding:60,color:"#9CA3AF"}}>Loading...</div>:view==="month"?(
        <div style={{background:"#fff",border:"1px solid #E8E4DC",borderRadius:8,overflow:"hidden"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",borderBottom:"1px solid #E8E4DC"}}>
            {DAYS.map(d=><div key={d} style={{padding:"8px 0",textAlign:"center",fontSize:11,fontWeight:600,color:"#9CA3AF",letterSpacing:1}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)"}}>
            {days.map((day,i)=>{
              const ds=toStr(day.date);
              const isToday=ds===today;
              const dj=jobsForDay(day.date);
              const dp=phasesForDay(day.date);
              const total=dj.length+dp.length;
              return(
                <div key={i} style={{minHeight:80,padding:"5px 3px",borderRight:i%7!==6?"1px solid #F3F0EB":"none",borderBottom:i<35?"1px solid #F3F0EB":"none",background:!day.in?"#FAFAF8":isToday?"#FFFBF0":"#fff"}}>
                  <div style={{fontSize:11,fontWeight:isToday?700:400,color:isToday?"#C9A84C":day.in?"#6B7280":"#D1D5DB",textAlign:"right",marginBottom:3}}>{day.date.getDate()}</div>
                  {dp.slice(0,2).map(ph=>{
                    const job=jobs.find(j=>j.id===ph.job_id);
                    const isStart=ph.start_date===ds;
                    return(
                      <div key={ph.id} onClick={()=>onSelectJob(job.id)} title={ph.name+" — "+job?.address}
                        style={{fontSize:10,padding:"2px 4px",marginBottom:2,cursor:"pointer",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",background:"#DBEAFE",color:"#1D4ED8",borderRadius:3,borderLeft:isStart?"2px solid #3B82F6":"none",fontWeight:500}}>
                        {isStart?ph.name:"·"}
                      </div>
                    );
                  })}
                  {dj.slice(0,total<=3?2:1).map(j=>(
                    <div key={j.id} onClick={()=>onSelectJob(j.id)} title={j.address}
                      style={{fontSize:10,padding:"2px 4px",marginBottom:2,cursor:"pointer",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",background:SC[j.status]+"22",color:SC[j.status],border:"1px solid "+SC[j.status]+"44",borderRadius:3,fontWeight:600}}>
                      ⚑ {j.address.split(",")[0]}
                    </div>
                  ))}
                  {total>3&&<div style={{fontSize:10,color:"#9CA3AF",paddingLeft:3}}>+{total-3} more</div>}
                </div>
              );
            })}
          </div>
        </div>
      ):(
        <div>
          {upcoming().length===0?(
            <div style={{textAlign:"center",padding:60,color:"#9CA3AF",fontSize:14}}>No upcoming events in the next 90 days.</div>
          ):upcoming().map((ev,i)=>{
            const ds=ev.date.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
            const icon=ev.type==="completion"?"⚑":ev.type==="start"?"▶":"◼";
            const color=ev.type==="completion"?SC[ev.job.status]:"#3B82F6";
            const lbl=ev.type==="completion"?"Completion — "+ev.job.address:ev.type==="start"?ev.ph.name+" starts — "+ev.job.address:ev.ph.name+" ends — "+ev.job.address;
            return(
              <div key={i} onClick={()=>onSelectJob(ev.job.id)}
                style={{display:"flex",alignItems:"center",gap:14,padding:"12px 16px",background:"#fff",border:"1px solid #E8E4DC",borderRadius:6,marginBottom:8,cursor:"pointer",transition:"border-color 0.15s"}}
                onMouseEnter={e=>e.currentTarget.style.borderColor="#C9A84C"}
                onMouseLeave={e=>e.currentTarget.style.borderColor="#E8E4DC"}>
                <div style={{minWidth:80,fontSize:12,color:"#9CA3AF",fontWeight:500}}>{ds}</div>
                <div style={{fontSize:14,color,width:16,textAlign:"center"}}>{icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,color:"#0A1F44"}}>{lbl}</div>
                  {ev.ph&&<div style={{fontSize:11,color:"#9CA3AF",marginTop:2}}>{ev.job.assigned_rep||""}</div>}
                </div>
                <div style={{fontSize:11,padding:"3px 8px",borderRadius:10,background:SC[ev.job.status]+"22",color:SC[ev.job.status],fontWeight:600}}>{ev.job.status}</div>
              </div>
            );
          })}
        </div>
      )}

      <div style={{display:"flex",gap:16,marginTop:16,flexWrap:"wrap"}}>
        <div style={{fontSize:11,color:"#9CA3AF"}}><span style={{display:"inline-block",width:10,height:10,background:"#DBEAFE",border:"1px solid #93C5FD",borderRadius:2,marginRight:4}}></span>Phase</div>
        {Object.entries({lead:"Lead",active:"Active",punch:"Punch List",complete:"Complete"}).map(([s,lb])=>(
          <div key={s} style={{fontSize:11,color:"#9CA3AF"}}><span style={{display:"inline-block",width:10,height:10,background:SC[s]+"33",border:"1px solid "+SC[s],borderRadius:2,marginRight:4}}></span>{lb}</div>
        ))}
      </div>
    </div>
  );
}
