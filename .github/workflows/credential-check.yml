name: Credential expiration check
on:
  schedule:
    - cron: '0 14 * * *'   # Daily at 14:00 UTC (~9am CT)
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check credential expirations
        run: node scripts/credential-renewal-check.js
