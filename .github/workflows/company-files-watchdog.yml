name: Company Files Expiration Watchdog

on:
  schedule:
    - cron: '0 14 * * *'   # Daily at 14:00 UTC (~9am CT)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger company-files-watchdog
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/company-files-watchdog" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Watchdog returned non-200 status: $STATUS"
            exit 1
          fi
