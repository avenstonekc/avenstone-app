name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy all edge functions via Management API (multipart)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: cbfftukmhqvvjlrlnltk
        run: |
          set -u
          FAILED=()
          DEPLOYED=()

          for dir in supabase/functions/*/; do
            slug=$(basename "$dir")
            entry="${dir}index.ts"

            if [ ! -f "$entry" ]; then
              echo "::warning::Skipping $slug (no index.ts)"
              continue
            fi

            echo "→ Deploying $slug"

            response=$(curl -sS -w "\n__HTTP_STATUS__:%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/functions/deploy?slug=${slug}" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -F "metadata={\"entrypoint_path\":\"index.ts\",\"name\":\"${slug}\",\"verify_jwt\":false};type=application/json" \
              -F "file=@${entry};type=application/typescript" 2>&1)

            status=$(echo "$response" | grep "__HTTP_STATUS__" | cut -d: -f2)
            body=$(echo "$response" | sed '/__HTTP_STATUS__/d')

            if [ "$status" = "200" ] || [ "$status" = "201" ]; then
              echo "  ✓ $slug deployed (HTTP $status)"
              DEPLOYED+=("$slug")
            else
              echo "  ✗ $slug FAILED (HTTP $status)"
              echo "    Response: $(echo "$body" | head -c 300)"
              FAILED+=("$slug")
            fi
          done

          echo ""
          echo "════════════════════════════════════════"
          echo "Deployed: ${#DEPLOYED[@]}  |  Failed: ${#FAILED[@]}"
          echo "════════════════════════════════════════"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Failed functions: ${FAILED[*]}"
            exit 1
          fi
