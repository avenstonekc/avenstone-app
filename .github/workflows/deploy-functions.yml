name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy all edge functions via Management API
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');
          const path = require('path');

          const TOKEN = process.env.SUPABASE_ACCESS_TOKEN;
          const PROJECT = 'cbfftukmhqvvjlrlnltk';

          const fnsDir = 'supabase/functions';
          const dirs = fs.readdirSync(fnsDir).filter(f =>
            fs.statSync(path.join(fnsDir, f)).isDirectory()
          );

          async function deployFn(slug) {
            const indexPath = path.join(fnsDir, slug, 'index.ts');
            if (!fs.existsSync(indexPath)) {
              console.log('Skipping ' + slug + ' (no index.ts)');
              return;
            }
            const src = fs.readFileSync(indexPath, 'utf8');
            const body = JSON.stringify({
              slug,
              name: slug,
              body: Buffer.from(src).toString('base64'),
              verify_jwt: false,
            });

            // Try PATCH first (update existing), fall back to POST (create new)
            for (const method of ['PATCH', 'POST']) {
              const urlPath = method === 'PATCH'
                ? '/v1/projects/' + PROJECT + '/functions/' + slug
                : '/v1/projects/' + PROJECT + '/functions';

              const result = await new Promise((resolve) => {
                const opts = {
                  hostname: 'api.supabase.com',
                  path: urlPath,
                  method,
                  headers: {
                    Authorization: 'Bearer ' + TOKEN,
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(body),
                  },
                };
                const req = https.request(opts, (res) => {
                  let d = '';
                  res.on('data', c => d += c);
                  res.on('end', () => resolve({ status: res.statusCode, body: d }));
                });
                req.write(body);
                req.end();
              });

              if (result.status === 200 || result.status === 201) {
                const parsed = JSON.parse(result.body);
                console.log('Deployed ' + slug + ' v' + parsed.version + ' (' + result.status + ')');
                break;
              } else if (method === 'PATCH' && result.status === 404) {
                // Function doesn't exist yet, try POST
                continue;
              } else {
                console.error('Failed to deploy ' + slug + ': ' + result.status + ' ' + result.body.slice(0, 200));
                process.exit(1);
              }
            }
          }

          (async () => {
            for (const slug of dirs) {
              await deployFn(slug);
            }
            console.log('All functions deployed.');
          })();
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
