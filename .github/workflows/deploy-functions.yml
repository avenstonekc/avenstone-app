name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions via Supabase CLI
        # Switched from raw Management API multipart (single-file upload) to
        # Supabase CLI. Reason: single-file upload cannot resolve imports from
        # supabase/functions/_shared/ — the bundler only sees the uploaded
        # index.ts. The CLI bundles each function with its _shared/ dependencies
        # before uploading, so relative imports like '../_shared/foo.ts' work.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -u
          FAILED=()
          DEPLOYED=()

          for dir in supabase/functions/*/; do
            slug=$(basename "$dir")
            entry="${dir}index.ts"

            # Skip _shared/ and any dir without an index.ts
            if [ ! -f "$entry" ]; then
              echo "::warning::Skipping $slug (no index.ts)"
              continue
            fi

            echo "→ Deploying $slug"

            if supabase functions deploy "$slug" \
              --project-ref cbfftukmhqvvjlrlnltk \
              --no-verify-jwt 2>&1; then
              echo "  ✓ $slug deployed"
              DEPLOYED+=("$slug")
            else
              echo "  ✗ $slug FAILED"
              FAILED+=("$slug")
            fi
          done

          echo ""
          echo "════════════════════════════════════════"
          echo "Deployed: ${#DEPLOYED[@]}  |  Failed: ${#FAILED[@]}"
          echo "════════════════════════════════════════"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Failed functions: ${FAILED[*]}"
            exit 1
          fi
