name: Nightly AI Project Manager

on:
  workflow_dispatch:  # manual trigger only — daily analysis runs on first login via the app

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ai-pm-nightly
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ai-pm-nightly" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
